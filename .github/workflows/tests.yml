name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOBS: '1'
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Intégrité Spec Kit
        run: node tools/check-speckit.mjs
      - name: Syntaxe et ordre de chargement
        run: node tests/check-syntax.mjs
      - name: Dépendances de test
        run: |
          echo "SCRATCH=$RUNNER_TEMP/ftpb" >> "$GITHUB_ENV"; echo "PW_REQUIRE=$RUNNER_TEMP/ftpb/node_modules/x.js" >> "$GITHUB_ENV"; echo "THREE_JS=$RUNNER_TEMP/ftpb/node_modules/three/build/three.min.js" >> "$GITHUB_ENV"
          SCRATCH="$RUNNER_TEMP/ftpb"
          mkdir -p "$SCRATCH" && cd "$SCRATCH" && npm init -y >/dev/null
          npm i --no-audit --no-fund playwright fit-file-parser @garmin/fitsdk @supabase/supabase-js@2.45.4 three@0.147.0 leaflet@1.9.4 pdfjs-dist@3.11.174
          npx playwright install --with-deps chromium
      - name: Tests navigateur
        run: node tests/run-all.mjs
