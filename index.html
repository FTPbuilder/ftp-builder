<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>FTP Builder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--swim:#19c3c9;--run:#2fbf71;
  --bg:#0f1115; --bg2:#171a21; --card:#1c2029; --line:#2a2f3b; --text:#eef0f4; --muted:#9aa1b0;
  --accent:#ff8a4c; --accent2:#ffb02e; --ok:#3ecf8e; --warn:#ffb02e; --bad:#ff4d5e;
  --z1:#6b7280; --z2:#3b82f6; --z3:#22c55e; --z4:#facc15; --z5:#f97316; --z6:#ef4444;
  --radius:14px; --shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
/* hypnogramme : éveil, paradoxal, léger, profond */
:root{ --hy-awake:#f0805f; --hy-rem:#7cc8f2; --hy-core:#3b82f6; --hy-deep:#4338ca; }
/* pentes : 4 teintes douces (vert tendre, sable, corail, prune) */
:root{ --g1:#b9d98c; --g2:#efd27e; --g3:#e99a7c; --g4:#9c86c7; --gt:#1d1b20; }
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --g1:#cfe59f; --g2:#f6dc8f; --g3:#ef9f86; --g4:#5d4e7a; }
  :root:not([data-theme="dark"]){ --bg:#f5f4f1; --bg2:#ecebe7; --card:#ffffff; --line:#e1dfda; --text:#16181d; --muted:#666c78; --shadow:0 1px 2px rgba(0,0,0,.05); }
}
:root[data-theme="light"]{ --g1:#cfe59f; --g2:#f6dc8f; --g3:#ef9f86; --g4:#5d4e7a; }
:root[data-theme="light"]{ --bg:#f5f4f1; --bg2:#ecebe7; --card:#ffffff; --line:#e1dfda; --text:#16181d; --muted:#666c78; --shadow:0 1px 2px rgba(0,0,0,.05); }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Barlow Condensed","Arial Narrow",Inter,system-ui,sans-serif;letter-spacing:.01em;margin:0}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{max-width:760px;margin:0 auto;padding:16px 16px calc(118px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:14px;flex-wrap:wrap}
html,body{max-width:100%;overflow-x:hidden}
@media (max-width:420px){ .brand h1{font-size:24px} .brand small{display:none} header.top .chip{font-size:11px;padding:3px 8px} }
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:28px;font-weight:700;text-transform:uppercase}
.brand h1 b{color:#ff9a52;-webkit-text-fill-color:#ff9a52}
.brand small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:20px;font-weight:600;text-transform:uppercase;margin-bottom:10px}
.card h3{font-size:17px;font-weight:600;margin-bottom:6px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:11.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){ .grid4{grid-template-columns:repeat(2,1fr)} .grid3{grid-template-columns:1fr 1fr} }
.kpi{background:var(--bg2);border-radius:12px;padding:10px 12px}
.kpi .v{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:30px;font-weight:700;line-height:1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500}
.kpi[data-i],h2[data-i]{cursor:pointer;position:relative}
.kpi[data-i]::after{content:"i";position:absolute;top:8px;right:9px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font:600 10px/13px Inter,system-ui,sans-serif;text-align:center;opacity:.7}
.kpi{position:relative}
.kpi[data-i]:active{transform:scale(.98)}
h2[data-i]::after{content:"i";display:inline-block;margin-left:8px;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font:600 11px/14px Inter,system-ui,sans-serif;text-align:center;vertical-align:3px;text-transform:none;opacity:.7}
.infoscale{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.infoscale div{display:flex;gap:10px;align-items:baseline;font-size:13.5px;padding:6px 8px;border-radius:8px}
.infoscale div.on{background:color-mix(in srgb,var(--accent) 16%,var(--bg2));font-weight:600}
.infoscale b{min-width:86px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
nav.tabs{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;padding:0 22px;z-index:20;pointer-events:none}
nav.tabs .in{position:relative;display:flex;max-width:420px;width:100%;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--card) 62%,transparent);border:1px solid color-mix(in srgb,var(--text) 10%,transparent);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 10px 30px rgba(0,0,0,.28);pointer-events:auto}
nav.tabs .pill{position:absolute;top:6px;bottom:6px;left:6px;width:0;border-radius:999px;background:color-mix(in srgb,var(--text) 14%,transparent);transition:left .42s cubic-bezier(.3,1.45,.5,1),width .42s cubic-bezier(.3,1.45,.5,1);pointer-events:none}
nav.tabs .pill.still{transition:none}
nav.tabs button{position:relative;z-index:1;flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;height:56px;padding:0;cursor:pointer;border-radius:999px;-webkit-tap-highlight-color:transparent;transition:color .25s,transform .15s}
nav.tabs button:active{transform:scale(.92)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button .lbl{font-size:10.5px;font-weight:600;letter-spacing:.01em;line-height:1}
nav.tabs button.on{color:var(--text)}
/* Aujourd'hui : 4 tuiles iridescentes */
:root{ --iri:linear-gradient(115deg,#7cc3ff 0%,#8f86ff 18%,#ad5cf0 36%,#e05ad0 54%,#ff6f8a 70%,#ff9a52 85%,#7cc3ff 100%);
  --iri-t:linear-gradient(100deg,#7cc3ff 0%,#a66af2 38%,#e05ad0 66%,#ff9a52 100%); }
/* textes aux couleurs de l'icône */
.brand h1,.tiles .tile .tl,.pane-head h2,.arcs-head h2,.card h2,.card .kpi .v{background:var(--iri-t);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}
.pane-head h2{flex:0 1 auto;margin-right:auto}
.card .kpi .v small{-webkit-text-fill-color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{position:relative;aspect-ratio:1/1;border:4px solid transparent;border-radius:22px;padding:14px 14px 12px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;overflow:hidden;
  background:linear-gradient(var(--card),var(--card)) padding-box,var(--iri) border-box;background-size:100% 100%,260% 260%;background-position:0 0,var(--ip,0%) 50%;
  transition:transform .18s cubic-bezier(.3,1.4,.5,1),box-shadow .25s;-webkit-tap-highlight-color:transparent;animation:iriShift 9s ease-in-out infinite alternate;animation-delay:var(--idl,0s)}
.tile:active{transform:scale(.96)}
.tile .tl{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text)}
.tile .tv{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:800;font-size:clamp(58px,19vw,92px);line-height:.86;letter-spacing:-.01em;
  background:var(--iri);background-size:260% 260%;background-position:var(--ip,0%) 50%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:iriShiftT 9s ease-in-out infinite alternate;animation-delay:var(--idl,0s)}
.tile .tv small{font-size:.36em;font-weight:700;margin-left:2px}
.tile .ts{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.on{background:linear-gradient(color-mix(in srgb,var(--card) 82%,#b79cff),color-mix(in srgb,var(--card) 82%,#8ff0c6)) padding-box,var(--iri) border-box;background-size:100% 100%,260% 260%;box-shadow:0 8px 28px color-mix(in srgb,#b79cff 35%,transparent)}
.tile.on::after{content:"";position:absolute;right:12px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--iri);background-size:300% 300%}
@keyframes iriShift{from{background-position:0 0,0% 50%}to{background-position:0 0,100% 50%}}
@keyframes iriShiftT{from{background-position:0% 50%}to{background-position:100% 50%}}
@media (prefers-reduced-motion:reduce){.tile,.tile .tv{animation:none}}
/* Accueil : anneau Programme + cartes, typo condensée grasse italique */
:root{--h-prog1:#7fe3c4;--h-prog2:#6fb6ff;--h-hrs:#6fb6ff;--h-nrg:#ff9a52;--h-def:#b48cff}
.brand h1{font:italic 900 34px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:-.005em;background:none;-webkit-text-fill-color:currentColor;color:color-mix(in srgb,var(--text) 78%,var(--muted))}
.brand h1 .ftp{background:linear-gradient(100deg,var(--h-prog1),var(--h-prog2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-right:.04em}
.brand h1 b{color:var(--h-nrg);-webkit-text-fill-color:var(--h-nrg)}
header.top .chip{font:italic 700 15px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.03em;text-transform:uppercase}
header.top .chip b{color:var(--text);font-weight:900;font-size:17px}
nav.tabs button .lbl{font:italic 800 12.5px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.05em;text-transform:uppercase}
.home{position:relative;max-width:440px;margin:0 auto;isolation:isolate}
.home::before{content:"";position:absolute;left:-16px;right:-16px;top:-90px;height:420px;z-index:-1;pointer-events:none;background:radial-gradient(120% 70% at 70% 0%,color-mix(in srgb,#3b5aa8 30%,transparent),transparent 70%),radial-gradient(60% 30% at 100% 70%,rgba(255,154,82,.10),transparent)}
.home .bc{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-style:italic}
.home .lab{font:italic 800 17px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.home .num0{font:italic 900 82px/.85 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:-.02em;padding-right:.05em;color:var(--text)}
.home .num0 small{font-size:.38em;font-weight:800;color:color-mix(in srgb,var(--muted) 70%,var(--bg));margin-left:3px}
.home .sub{font:italic 700 15px/1.15 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.home button{font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.home button:active{transform:scale(.97)}
.home .hero{display:grid;place-items:center;margin:4px auto 14px;background:none;border:0;padding:0;width:240px;height:240px;position:relative}
.home .hero>svg{position:absolute;inset:0;width:100%;height:100%}
.home .hero .in{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center}
.home .hero .num0{font-size:140px;line-height:.82;margin:6px 0 4px}
.home .hero .num0 small{font-size:.36em}
.home .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.home .hc{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px 16px 0;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow,none)}
.home .hc .top{display:flex;align-items:center;gap:8px}
.home .hc .top svg{width:20px;height:20px;flex:none}
.home .hc .num0{margin:12px 0 6px}
.home .hc .spark{display:block;width:calc(100% + 32px);height:48px;margin:6px -16px 0}
.home .hc .nospark{height:22px}
.home .hc.wide{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;padding:14px 18px}
.home .ring{position:relative;width:86px;height:86px;display:grid;place-items:center;flex:none}
.home .ring>svg:first-child{position:absolute;inset:0}
.home .ring .ic{width:34px;height:34px}
@keyframes homeIn{from{opacity:0;transform:translateY(8px)}}
.home .hero,.home .hc{animation:homeIn .4s cubic-bezier(.3,1.2,.5,1) backwards}
.home .hc:nth-child(1){animation-delay:.05s}.home .hc:nth-child(2){animation-delay:.1s}.home .hc:nth-child(3){animation-delay:.15s}
@keyframes ringIn{from{stroke-dasharray:0 9999}}
.home .harc{animation:ringIn .9s cubic-bezier(.3,.9,.3,1) backwards .1s}
@media (prefers-reduced-motion:reduce){.home .hero,.home .hc,.home .harc{animation:none}}
.tiles-home{margin-top:6px}
.tiles-home .tile{aspect-ratio:auto;min-height:148px}
.tiles-home .tile .tv{display:block;font-size:clamp(46px,14vw,70px);transform:scaleY(1.35);transform-origin:left top;margin:6px 0 calc(.86em * .35)}
/* 0.19.1 — haut : halo fondu (plus de bord net sous la barre d'état) ; bas : l'accueil tient au-dessus de la barre d'onglets */
.app{padding-top:max(16px,env(safe-area-inset-top))}
.home::before{top:-60px;height:400px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 34%,#000 62%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 34%,#000 62%,transparent 100%)}
.home{--hs:clamp(196px,calc(100svh - 570px),240px)}
.home .hero{width:var(--hs);height:var(--hs);margin:0 auto 12px}
.home .hero .num0{font-size:calc(var(--hs) * .56);margin:4px 0 2px}
.home .hc .num0{font-size:clamp(64px,19vw,82px)}
.home .hc.wide{padding:12px 16px}
.home .hc.wide .num0{font-size:64px;margin:8px 0 4px}
.home .ring{width:76px;height:76px}
.home .ring .ic{width:30px;height:30px}
nav.tabs .in{background:color-mix(in srgb,var(--card) 84%,transparent)}
.tgoal{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.tgoal th,.tgoal td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tgoal th:first-child{text-align:left;font-weight:500}
.tgoal thead th{font:italic 800 13px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tgoal tr.tot th,.tgoal tr.tot td{border-bottom:0;font-weight:700;color:var(--text)}
.tgoal .ok{color:var(--ok);font-size:12px} .tgoal .bad{color:var(--bad);font-size:12px}
.tgin{display:flex;flex-direction:column;gap:8px}
.tgrow{display:grid;grid-template-columns:1fr 64px 64px 64px;gap:6px;align-items:center}
.tgrow .tgl{font-weight:500}
.tgrow label{position:relative;display:block}
.tgrow input{text-align:center;padding:10px 4px 16px;min-height:48px;font-family:"JetBrains Mono",ui-monospace,monospace}
.tgrow label span{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:10px;color:var(--muted);pointer-events:none}
.tbench{margin-top:10px}.tbench summary{cursor:pointer;font-weight:600;font-size:14px;padding:8px 0;list-style:none}
.tbench summary::before{content:'＋ ';color:var(--accent)} .tbench[open] summary::before{content:'− '}
.pane-head{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.pane-head h2{font-size:26px;font-weight:700;text-transform:uppercase;flex:1}
.pane-back{width:44px;height:44px;flex:none;border-radius:50%;border:3px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--iri) border-box;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.pane-back:active{transform:scale(.9)}
.pane-back svg{width:20px;height:20px}
.pane-num{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:800;font-size:40px;line-height:1;background:var(--iri);background-size:260% 260%;-webkit-background-clip:text;background-clip:text;color:transparent}
.pane-num small{font-size:.45em;margin-left:2px}
.tile{animation:iriShift 9s ease-in-out infinite alternate,tileIn .35s cubic-bezier(.3,1.3,.5,1) backwards;animation-delay:var(--idl,0s),var(--tdl,0s)}
@keyframes tileIn{from{opacity:0;transform:scale(.9)}}
#todayPane:not([data-p=seance]) .pane-head + .card > h2:first-child,#todayPane:not([data-p=seance]) .pane-head + .card > .row.between:first-child > h2,#todayPane .arcs-wrap + .card > .row.between:first-child > h2{display:none}
#todayPane:not([data-p=seance]) .pane-head + .card > .row.between:first-child,#todayPane .arcs-wrap + .card > .row.between:first-child{justify-content:flex-end}
.pane-in{animation:paneIn .28s ease-out}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* carrousel du programme : arches façon scène */
.arcs-wrap{position:relative;margin:0 -16px 12px}
.arcs-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 16px}
.arcs-head h2{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.arcs-head #arcPos{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1;background:var(--iri);background-size:260% 260%;-webkit-background-clip:text;background-clip:text;color:transparent}
.arcs{display:flex;align-items:flex-end;overflow-x:auto;scroll-snap-type:x mandatory;padding:46px calc(50% - 68px) 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.arcs::-webkit-scrollbar{display:none}
.arc{flex:0 0 136px;height:190px;margin-left:-40px;border-radius:68px 68px 16px 16px;scroll-snap-align:center;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1px;padding:0 10px 16px;text-align:center;cursor:pointer;transform-origin:bottom center;will-change:transform;
  background:color-mix(in srgb,var(--ac) 22%,transparent);border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);color:var(--text);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .25s,border-color .25s,box-shadow .25s}
.arc:first-child{margin-left:0}
.arc .ad{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.arc .an{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:18px;font-weight:600;line-height:1.05;text-transform:uppercase;max-width:110px}
.arc .am{font-size:12px;color:var(--muted)}
.arc .ast{font-size:15px;min-height:18px}
.arc.on{background:color-mix(in srgb,var(--ac) 86%,transparent);border-color:color-mix(in srgb,#fff 45%,transparent);color:#fff;box-shadow:0 6px 22px color-mix(in srgb,var(--ac) 35%,transparent)}
.arc.on .ad,.arc.on .am{color:rgba(255,255,255,.85)}

<script>

const $ = s => document.querySelector(s);

const pad = n => String(n).padStart(2, '0');

const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };

const fmtDur = sec => { sec = Math.round(sec); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return h ? `${h}h${pad(m)}` : (s && m < 10 ? `${m}'${pad(s)}` : `${m}'`); };

function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ============ état ============ */
let S = load();
function blank(){ return { version:1, profile:null, plan:[], activities:[], ftpHistory:[], settings:{ theme:'auto' } }; }

function save(opts={}){ if (!opts.remote) S.updatedAt = Date.now(); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){ console.warn('save failed', e); } if (!opts.remote) { try { Cloud.schedulePush(); } catch(e){} } }

const adj = () => (S.profile?.intensityAdj || 1);

function zoneOf(p){ return p < 56 ? 1 : p < 76 ? 2 : p < 91 ? 3 : p < 106 ? 4 : p < 121 ? 5 : 6; }
const ZCOL = z => `var(--z${z})`;

/* ============ bibliothèque de séances ============ */
// step: {d: sec, p: %FTP, label, int, max?:bool, cad?}
const S_ = (min, p, label, int='active', extra={}) => ({ d: Math.round(min*60), p, label, int, ...extra });
const R_ = (n, steps) => ({ repeat: n, steps });
const WU = [S_(5,50,'Échauffement','warmup'), S_(5,62,'Échauffement','warmup'), S_(3,75,'Échauffement','warmup')];

const WORKOUTS = {

  vo2_6x3: { name:'VO2max 6 × 3 min', type:'vo2', goal:"Intensité VO2 plus haute (118 %), récup égale.", steps:[...WU_ACT, R_(6,[S_(3,118,'VO2max',null,{cad:98}), S_(3,50,'Récup','rest')]), ...CD(8)] },
  vo2_3030: { name:'30/30 · 3 × 10', type:'vo2', goal:"Accumuler du temps près de VO2max avec des micro-récups.", steps:[...WU, R_(3,[R_(10,[S_(0.5,130,'ON',null,{cad:100}), S_(0.5,50,'OFF','rest')]), S_(5,55,'Récup','rest')]), ...CD(5)] },
  end_60: { name:'Endurance 1 h', type:'end', goal:"Zone 2 facile (65-72 %). Peut se faire dehors à la FC.", steps:[S_(5,55,'Échauffement','warmup'), S_(50,68,'Endurance Z2',null,{cad:90}), S_(5,55,'Retour au calme','cooldown')] },
  end_90: { name:'Endurance 1 h 30', type:'end', goal:"Sortie longue Z2 (65-72 %), idéalement dehors le week-end, à la FC.", steps:[S_(10,55,'Échauffement','warmup'), S_(75,68,'Endurance Z2',null,{cad:88}), S_(5,55,'Retour au calme','cooldown')] },
  end_120: { name:'Endurance 2 h', type:'end', goal:"Sortie longue Z2, dehors si possible.", steps:[S_(10,55,'Échauffement','warmup'), S_(105,67,'Endurance Z2'), S_(5,55,'Retour au calme','cooldown')] },
  // --- séances ajoutées v0.7 : plus de variété ---
  ss_4x10: { name:'Sweet spot 4 × 10 min', type:'ss', goal:"Volume sweet spot fractionné : 40 min à 90 % avec des récups courtes.", steps:[...WU, R_(4,[S_(10,90,'Sweet spot',null,{cad:90}), S_(4,55,'Récup','rest')]), ...CD(6)] },

  tempo_end: { name:'Endurance + tempo 1 h 15', type:'tempo', goal:"Sortie d'endurance avec 3 blocs tempo : du volume utile sans grosse fatigue.", steps:[S_(10,58,'Échauffement','warmup'), R_(3,[S_(10,82,'Tempo',null,{cad:88}), S_(8,65,'Endurance')]), S_(11,55,'Retour au calme','cooldown')] },
  thr_5x6: { name:'Seuil 5 × 6 min', type:'thr', goal:"Seuil en blocs courts (102 %) : bonne porte d'entrée vers le travail au seuil.", steps:[...WU_ACT, R_(5,[S_(6,102,'Seuil',null,{cad:92}), S_(3,55,'Récup','rest')]), ...CD(7)] },
  thr_prog: { name:'Seuil progressif 3 × 10 min', type:'thr', goal:"Chaque bloc monte 95 → 100 → 105 % : finir fort quand la fatigue arrive, comme en haut d'un col.", steps:[...WU_ACT, R_(3,[S_(10/3,95,'Seuil −'), S_(10/3,100,'Seuil'), S_(10/3,105,'Seuil +'), S_(5,55,'Récup','rest')]), ...CD(6)] },
  thr_2x15: { name:'Seuil 2 × 15 min', type:'thr', goal:"Deux longs blocs à 100 % : la séance qui fait monter la FTP.", steps:[...WU_ACT, R_(2,[S_(15,100,'Seuil',null,{cad:92}), S_(7,55,'Récup','rest')]), ...CD(7)] },
  vo2_4x5: { name:'VO2max 4 × 5 min', type:'vo2', goal:"VO2max « long » à 108 % : entrée en douceur dans le travail VO2.", steps:[...WU_ACT, R_(4,[S_(5,108,'VO2max',null,{cad:95}), S_(5,50,'Récup','rest')]), ...CD(7)] },
  vo2_8x2: { name:'VO2max 8 × 2 min', type:'vo2', goal:"Efforts de 2 min à 120 % : intense mais court, idéal pour progresser sur 3-5 min.", steps:[...WU_ACT, R_(8,[S_(2,120,'VO2max',null,{cad:100}), S_(2,50,'Récup','rest')]), ...CD(8)] },
  vo2_pyr: { name:'Pyramide VO2 1-2-3-4-3-2-1', type:'vo2', goal:"Pyramide à 115 % avec récup égale à l'effort : varié, dur, très efficace.", steps:[...WU_ACT, ...[1,2,3,4,3,2,1].flatMap(m => [S_(m,115,`VO2 ${m} min`,null,{cad:98}), S_(m,50,'Récup','rest')]), ...CD(6)] },
  vo2_4020: { name:'40/20 · 3 × 8 min', type:'vo2', goal:"40 s à 120 % / 20 s de récup : on accumule du temps près de VO2max avec très peu de récupération.", steps:[...WU, R_(3,[R_(8,[S_(40/60,120,'ON',null,{cad:100}), S_(20/60,50,'OFF','rest')]), S_(5,55,'Récup','rest')]), ...CD(6)] },
  end_neuro: { name:'Endurance + sprints 1 h', type:'end', goal:"Endurance Z2 avec 8 sprints de 15 s : réveille la puissance explosive sans fatigue.", steps:[S_(10,58,'Échauffement','warmup'), R_(8,[S_(0.25,180,'Sprint 15 s',null,{cad:110}), S_(4.75,66,'Endurance')]), S_(5,62,'Endurance'), S_(5,55,'Retour au calme','cooldown')] },
  end_150: { name:'Sortie longue 2 h 30 avec D+', type:'end', goal:"Dehors : endurance Z2 en terrain vallonné (vallée de Chevreuse), montées au tempo sans dépasser le seuil. Mange toutes les 30 min comme en course.", steps:[S_(10,55,'Échauffement','warmup'), R_(4,[S_(25,67,'Endurance Z2'), S_(8,82,'Montée tempo',null,{cad:80})]), S_(8,55,'Retour au calme','cooldown')] },
  end_180: { name:'Sortie longue 3 h · spécifique', type:'end', goal:"La répétition générale du vélo de l'AlpsMan : 3 h dehors avec les cols de la journée au tempo (82-88 %), nutrition de course, puis l'enchaînement à pied.", steps:[S_(15,55,'Échauffement','warmup'), R_(3,[S_(30,67,'Endurance Z2'), S_(20,85,'Col au tempo',null,{cad:78})]), S_(15,55,'Retour au calme','cooldown')] },
  rec_45: { name:'Récup active 45 min', type:'rec', goal:"Faire tourner les jambes, très facile (< 60 %).", steps:[S_(45,55,'Récup active','rest',{cad:90})] },
  openers: { name:'Rappels (veille de test)', type:'rec', goal:"Réveiller les jambes sans fatigue avant un test ou une semaine dure.", steps:[S_(10,55,'Échauffement','warmup'), R_(3,[S_(1,110,'Rappel',null,{cad:100}), S_(2,55,'Récup','rest')]), S_(10,65,'Endurance'), S_(5,50,'Retour au calme','cooldown')] },
};
const HARD = new Set(['test','ss','thr','vo2','force']);
const isHard = wid => HARD.has(WORKOUTS[wid]?.type);
function flat(steps){ const out = []; for (const s of steps) { if (s.repeat) for (let i=0;i<s.repeat;i++) out.push(...flat(s.steps)); else out.push(s); } return out; }
const wDur = wid => flat(WORKOUTS[wid].steps).reduce((a,s)=>a+s.d,0);
const wTSS = wid => Math.round(flat(WORKOUTS[wid].steps).reduce((a,s)=>a + s.d*Math.pow(s.p/100,2),0)/36);
const watts = (p, f=ftp(), k=1) => round5(p/100 * f * adj() * k);
const sAdj = s => (s && s.adj) || 1;
function mainStep(wid){ // le bloc principal le plus intense et le plus long (pour mesurer le respect des cibles)
  let best = null; for (const s of flat(WORKOUTS[wid].steps)) if ((s.int || 'active') === 'active' && s.p >= 85 && (!best || s.d*s.p > best.d*best.p)) best = s; return best;
}

/* ============ planificateur ============ */
const BLOCKS = [
  // k[i][semaine du bloc] : séance clé n°1, n°2, n°3 (si 3 séances clés / semaine)
  { name:'Base · Sweet spot', k:[['ss_3x10','ss_3x12','ss_4x10'],['force_5x5','tempo_2x20','ss_ou'],['tempo_end','force_5x5','tempo_2x20']] },
  { name:'Sweet spot → Seuil', k:[['ss_2x20','thr_5x6','thr_4x8'],['force_4x8','ss_3x15','vo2_4x5'],['tempo_2x20','ss_ou','tempo_end']] },
  { name:'Seuil + VO2max', k:[['thr_3x12','thr_prog','thr_2x15'],['vo2_5x4','vo2_8x2','vo2_pyr'],['force_4x8','ss_2x20','ou_3x9']] },
  { name:'VO2max · Spécifique', k:[['vo2_6x3','vo2_4020','vo2_3030'],['thr_2x15','ou_3x9','thr_2x20'],['ss_ou','force_4x8','tempo_end']] },
];
// bloc spécifique triathlon montagne : force en cadence basse, seuil long, tempo (cols)
const TRI_SPEC = { name:'Spécifique montagne', k:[['force_4x8','thr_2x15','force_5x5'],['ss_2x20','tempo_2x20','thr_prog'],['tempo_end','ss_ou','ss_3x15']] };
const ALT = { // repli si la séance dépasse la durée dispo du jour
  ss:['ss_3x10','ss_3x12','ss_ou','ss_4x10','ss_2x20','ss_3x15'], thr:['thr_5x6','thr_4x8','ou_3x9','thr_prog','thr_3x12','thr_2x15','thr_2x20'], vo2:['vo2_8x2','vo2_6x3','vo2_4x5','vo2_5x4','vo2_pyr','vo2_4020','vo2_3030'],
  force:['force_5x5','force_4x8'], tempo:['tempo_2x20','tempo_end'], end:['end_60','end_neuro','end_90','end_120','end_150','end_180'], rec:['openers','rec_45'], test:['ramp','test20'] };
// échelles de difficulté (de la plus facile à la plus dure) pour « plus facile / plus dur »
const LADDER = {
  rec:['rec_45','openers'], end:['rec_45','end_60','end_neuro','end_90','end_120','end_150','end_180'], tempo:['tempo_end','tempo_2x20'],
  force:['force_5x5','force_4x8'], ss:['ss_3x10','ss_3x12','ss_ou','ss_4x10','ss_2x20','ss_3x15'],
  thr:['thr_5x6','thr_4x8','ou_3x9','thr_prog','thr_3x12','thr_2x15','thr_2x20'], vo2:['vo2_4x5','vo2_8x2','vo2_5x4','vo2_pyr','vo2_6x3','vo2_4020','vo2_3030'] };
const DOWN = { vo2:'thr', thr:'ss', ss:'tempo', force:'tempo', tempo:'end', end:'rec', rec:null };
const UP = { rec:'end', end:'tempo', tempo:'ss', ss:'thr', force:'thr', thr:'vo2', vo2:null };
function neighbor(wid, dir){
  const t = WORKOUTS[wid].type; if (t === 'test') return null;
  const L = LADDER[t] || [wid]; const i = L.indexOf(wid);
  const ofType = f => (LADDER[f] || []).filter(w => WORKOUTS[w].type === f && w !== wid);
  if (dir < 0) { if (i > 0) return L[i-1]; const d = DOWN[t]; if (!d) return null; const c = ofType(d); return c[Math.max(0, c.length - (d === 'end' ? 3 : 1))] || null; }
  if (i >= 0 && i < L.length-1 && L[i+1] !== wid) return L[i+1]; const u = UP[t]; if (!u) return null; return ofType(u)[0] || null;
}
function fitTo(wid, maxMin){
  const t = WORKOUTS[wid].type, lim = maxMin*60;
  if (wDur(wid) <= lim) return wid;
  const opts = (ALT[t]||[wid]).filter(id => wDur(id) <= lim).sort((a,b)=>wDur(b)-wDur(a));
  if (opts.length) return opts[0];
  if (t === 'tempo' || t === 'ss') { const s = ALT.ss.filter(id=>wDur(id)<=lim); if (s.length) return s[0]; }
  return (ALT[t]||[wid]).slice().sort((a,b)=>wDur(a)-wDur(b))[0];

/* ============ coach ============ */
function coachNotes(){
  const notes = [];
  const p = S.profile; if (!p) return notes;
  const done = S.plan.filter(s => s.status==='done');
  const doneCount = countDone();
  const t = todayISO();
  const daysLeft = Math.max(diffDays(t, p.endDate), 0), weeksLeft = daysLeft/7;
  const need = Math.max(p.minSessions - doneCount, 0);
  if (need > 0 && weeksLeft > 0) {
    const rate = need / weeksLeft;
    if (rate > 3) notes.push({ cls:'bad', t:`Il reste ${need} séances en ${Math.round(weeksLeft)} semaines (${rate.toFixed(1)}/sem.) : l'objectif des ${p.minSessions} devient difficile.` });
    else if (rate > 2.2) notes.push({ cls:'', t:`Rythme à tenir : ${rate.toFixed(1)} séances/semaine pour atteindre ${p.minSessions}.` });
  } else if (need === 0) notes.push({ cls:'ok', t:`Objectif des ${p.minSessions} séances atteint. Tout ce qui suit, c'est du bonus.` });
  // ressentis séances clés
  // verdicts des deux dernières séances clés évaluées (avec ressenti)
  const keyEv = S.activities.filter(a => a.planId && a.feel?.rpe).map(a => { const pl = S.plan.find(s=>s.id===a.planId); return pl?.kind === 'key' ? { a, e: sessionEval(a, pl) } : null; })
    .filter(x => x?.e).sort((x,y)=>x.a.date.localeCompare(y.a.date)).slice(-2).map(x => x.e);
  if (keyEv.length === 2) {
    const hard = keyEv.every(e => e.cause === 'hard' || (e.cause === 'missed' && !e.legsHeavy && e.units.some(u => u.under)));
    const easy = keyEv.every(e => e.cause === 'easy');
    const tired = keyEv.every(e => e.legsHeavy && e.lvl >= 1);
    if (hard) notes.push({ cls:'bad', t:`Tes deux dernières séances clés : cibles non tenues malgré un effort élevé. Je te propose de baisser les cibles de 3 %.`, action:{ label:'Baisser de 3 %', f:()=>{ p.intensityAdj = +(adj()*0.97).toFixed(3); } } });
    else if (easy) notes.push({ cls:'ok', t:`Deux séances clés dans la cible avec un effort sous l'attendu. Tu peux monter les cibles de 2 %.`, action:{ label:'Monter de 2 %', f:()=>{ p.intensityAdj = +(adj()*1.02).toFixed(3); } } });
    else if (tired) notes.push({ cls:'', t:`Deux séances clés de suite avec les jambes lourdes : c'est de la fatigue, pas un problème de cibles. Allège la prochaine séance clé ou ajoute un jour de repos.` });
  }

// 5 jours en colonnes avec valeurs, moyenne 30 j en pointillé (fiches de la Forme du jour)
function trendChart(kind){
  const T = Health.trend(kind), vals = T.map(x => x.v).filter(v => v != null); if (vals.length < 2) return '';
  const fmt = { hrv: v => `${Math.round(v)}`, rhr: v => `${Math.round(v)}`, weight: v => v.toFixed(1).replace('.', ','), score: v => `${Math.round(v)}`, sleep: v => `${Math.floor(v)}h${pad(Math.round(v%1*60))}` }[kind];
  const unit = { hrv:'ms', rhr:'bpm', weight:'kg', score:'/100', sleep:'' }[kind], base = T.find(x => x.base != null)?.base ?? null;
  const all = [...vals, ...(base != null ? [base] : [])], lo0 = kind === 'score' ? 0 : Math.min(...all), hi0 = kind === 'score' ? 100 : Math.max(...all), pad0 = (hi0 - lo0)*0.25 || 1;
  const lo = kind === 'score' ? 0 : lo0 - pad0, hi = hi0 + (kind === 'score' ? 0 : pad0);
  const W = 320, Hh = 150, L = 8, R = 8, Tp = 22, B = 22, cw = (W - L - R)/T.length, Y = v => Tp + (Hh - Tp - B)*(1 - (v - lo)/(hi - lo || 1));
  const good = { hrv: 1, score: 1, sleep: 1, rhr: -1, weight: 0 }[kind];
  let g = '';
  if (base != null) g += `<line x1="${L}" x2="${W-R}" y1="${Y(base)}" y2="${Y(base)}" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="${W-R}" y="${Y(base)-4}" text-anchor="end" style="font-size:9px">moy. 30 j ${fmt(base)}</text>`;
  T.forEach((x, i) => { const cx = L + cw*i + cw/2, today = i === T.length - 1;
    if (x.v != null) { const better = base == null || good === 0 ? null : (x.v - base)*good >= 0;
      const col = kind === 'score' ? (x.v >= 75 ? 'var(--ok)' : x.v >= 55 ? 'var(--z2)' : x.v >= 40 ? 'var(--warn)' : 'var(--bad)') : better == null ? 'var(--accent)' : better ? 'var(--ok)' : 'var(--warn)';
      g += `<rect x="${cx - cw*0.28}" y="${Y(x.v)}" width="${cw*0.56}" height="${Hh - B - Y(x.v)}" rx="5" style="fill:${col}" opacity="${today ? 1 : .55}"/><text x="${cx}" y="${Y(x.v) - 5}" text-anchor="middle" style="fill:var(--text);font-weight:600;font-size:11px">${fmt(x.v)}</text>`; }
    else g += `<text x="${cx}" y="${Hh - B - 6}" text-anchor="middle" style="font-size:10px">—</text>`;
    g += `<text x="${cx}" y="${Hh - 6}" text-anchor="middle" style="font-size:10px${today ? ';fill:var(--text);font-weight:600' : ''}">${today ? "auj." : fmtShort(x.d).replace(/ .*/, '')}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="5 derniers jours" style="margin:4px 0 10px">${g}</svg><div class="tiny muted" style="margin:-6px 0 10px">5 derniers jours${unit ? ` · ${unit}` : ''}</div>`;
}
function lineChart({ series, xMin, xMax, yMin, yMax, w=680, h=220, xLabels=[], yTicks=5, unit='' }){
  const L=34, R=10, T=10, B=22; const iw = w-L-R, ih = h-T-B;
  const X = x => L + (x - xMin)/(xMax - xMin || 1) * iw, Y = y => T + ih - (y - yMin)/(yMax - yMin || 1) * ih;
  let g = '';
  for (let i=0;i<=yTicks;i++){ const v = yMin + (yMax-yMin)*i/yTicks; const y = Y(v); g += `<line x1="${L}" x2="${w-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+3}" text-anchor="end">${Math.round(v)}${unit}</text>`; }
  for (const [x, lab] of xLabels) g += `<text x="${X(x)}" y="${h-6}" text-anchor="middle">${lab}</text>`;
  for (const s of series) {
    if (s.type === 'area') { const pts = s.pts.map(([x,y])=>`${X(x)},${Y(y)}`).join(' '); g += `<polygon points="${X(s.pts[0][0])},${Y(yMin)} ${pts} ${X(s.pts[s.pts.length-1][0])},${Y(yMin)}" fill="${s.color}" opacity="${s.opacity||.15}"/>`; }
    else if (s.type === 'dots') for (const [x,y,lab] of s.pts) g += `<circle cx="${X(x)}" cy="${Y(y)}" r="${s.r||4.5}" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>${lab?`<text x="${X(x)}" y="${Y(y)-9}" text-anchor="middle" style="fill:var(--text);font-weight:600">${lab}</text>`:''}`;
    else if (s.pts.length) g += `<polyline points="${s.pts.map(([x,y])=>`${X(x)},${Y(y)}`).join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}" ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`;
  }

}

// séances de la semaine en cours (vélo + nat / course) : faites / prévues, et tout ce qui reste à venir
function weekCount(){
  const t = todayISO(), w0 = monday(t), w1 = addDays(w0, 6), inW = d => d >= w0 && d <= w1;
  const refs = swapRefs(), swOk = x => x.swap && x.swap.sp !== 'rest';
  const bike = S.plan.filter(s => (s.status !== 'skipped' || swOk(s)) && inW(s.date) && mandatory(s));
  let done = bike.filter(s => s.status === 'done' || swOk(s)).length, total = bike.length;
  // sorties vélo hors plan comptées comme séances (case « compter comme une séance ») : elles remplissent d'abord une séance vélo encore ouverte
  const bikeOpen = bike.filter(s => s.status === 'planned').length, bikeX = S.activities.filter(a => !a.planId && a.countAsSession && inW(a.date) && !refs.has('a:' + a.id)).length;
  done += bikeX; total += Math.max(0, bikeX - bikeOpen);
  if (triOn()) for (const sp of ['swim', 'run']) {
    // nat / course : une séance faite un autre jour que prévu (ou avant la création du plan) remplit un créneau ouvert de la semaine, sinon s'ajoute
    const tp = (S.triPlan || []).filter(x => x.sport === sp && (x.status !== 'skipped' || swOk(x)) && inW(x.date));
    const okDates = new Set(tp.filter(x => triStatus(x) === 'done').map(x => x.date)), nSw = tp.filter(swOk).length;
    const extra = new Set(Health.extraWorkouts().filter(e => e.sport === sp && inW(e.date) && e.date <= t && (+e.w.duration_min || 0) >= 15 && !okDates.has(e.date) && !refs.has('w:' + e.w.start_at)).map(e => e.date)).size;
    const open = tp.length - okDates.size - nSw;
    done += okDates.size + nSw + extra; total += tp.length + Math.max(0, extra - open);
  }
  const left = S.plan.filter(s => s.status === 'planned' && s.date >= t && mandatory(s)).length + (triOn() ? (S.triPlan || []).filter(x => x.date >= t && triStatus(x) === 'planned').length : 0);
  return { done: Math.min(done, total), total, left };
}

/* ----- Course A : objectifs et prédiction par discipline ----- */
// vélo : modèle physique (puissance = gravité + roulement + aéro), parcours découpé en montées à 5 %, descentes et plat
function bikeSpeed(P, grade, m, cda = 0.32, crr = 0.005, rho = 1.15, eta = 0.975){
  const g = 9.81, th = Math.atan(grade), F = m*g*(Math.sin(th) + crr*Math.cos(th));
  let lo = 0.5, hi = 25; // m/s : bissection sur P·η = (F + ½ρ·CdA·v²)·v
  for (let k = 0; k < 60; k++) { const v = (lo + hi)/2; ((F + 0.5*rho*cda*v*v)*v > P*eta) ? hi = v : lo = v; }
  return (lo + hi)/2;
}
// parcours GPX → altitude tous les 100 m (lissée sur 300 m) : de quoi simuler chaque portion
function gpxProfile(txt){
  const pts = [...txt.matchAll(/<trkpt[^>]*lat="([\d.\-]+)"[^>]*lon="([\d.\-]+)"[^>]*>[\s\S]*?<ele>([\d.\-]+)<\/ele>/g)].map(m => [+m[1], +m[2], +m[3]]);
  if (pts.length < 10) return null;
  const D = [0], E = [pts[0][2]];
  for (let i = 1; i < pts.length; i++) { const [a1, o1] = pts[i-1], [a2, o2, e] = pts[i], R = Math.PI/180;
    D.push(D[i-1] + 6371000*Math.hypot((o2 - o1)*R*Math.cos((a1 + a2)/2*R), (a2 - a1)*R)); E.push(e); }
  const raw = []; for (let x = 0, j = 0; x <= D[D.length - 1]; x += 100) { while (j < D.length - 2 && D[j+1] < x) j++; const t = (x - D[j])/Math.max(D[j+1] - D[j], 1e-9); raw.push(E[j] + t*(E[j+1] - E[j])); }
  const el = raw.map((_, i) => { const w = raw.slice(Math.max(0, i - 1), i + 2); return Math.round(w.reduce((a, b) => a + b, 0)/w.length*10)/10; });
  let up = 0, dn = 0; for (let i = 1; i < el.length; i++) { const d = el[i] - el[i-1]; d > 0 ? up += d : dn -= d; }
  return { step:100, el, km: Math.round(el.length*0.1*10)/10, up: Math.round(up), dn: Math.round(dn) };
}
// coût énergétique de la course selon la pente (Minetti 2002), relatif au plat ; au-delà de 15 % on marche vite : plafonné
const minetti = g => { g = Math.max(-0.3, Math.min(0.4, g)); const c = 155.4*g**5 - 30.4*g**4 - 43.3*g**3 + 46.3*g**2 + 19.5*g + 3.6; return Math.min(c/3.6, g > 0.15 ? 3 : 9); };
function triPredict(){
  const T = Object.assign(TRI_DEF(), S.tri || {}), r = T.race, g = triGuess(), kg = +S.profile?.weightKg || 75;
  const css = g.css || T.css, thr = g.runThr || T.runThr;
  // nat : allure course ≈ CSS + 4 s/100 m sur 2 km, +3 % de distance en eau libre (trajectoire, visée)
  const swim = r.swim/100*(css + 4)*1.03;
  // vélo : IF 0,78 × FTP sur un half vallonné (0,75–0,83 selon le niveau), +8 % dans les montées, roue libre dans les descentes (≤ 52 km/h)
  const P = 0.78*ftp(), m = kg + 8.5;
  let bike = 0;
  if (r.bikeProf) { const el = r.bikeProf.el, st = r.bikeProf.step;
    for (let i = 1; i < el.length; i++) { const gr = (el[i] - el[i-1])/st, pw = gr > 0.02 ? P*1.08 : gr < -0.03 ? P*0.3 : P;
      let v = bikeSpeed(pw, gr, m, 0.30, 0.005, 1.12); if (gr < -0.03) v = Math.min(v, 52/3.6); bike += st/v; } }
  else { const climbKm = Math.min(r.bike*0.45, (r.bikeDp || 0)/0.05/1000), flatKm = Math.max(0, r.bike - 2*climbKm);
    bike = climbKm*1000/bikeSpeed(P*1.08, 0.05, m) + climbKm*1000/Math.min(bikeSpeed(P*0.3, -0.05, m), 52/3.6) + flatKm*1000/bikeSpeed(P, 0, m); }
  // course : allure plat d'après vélo ≈ seuil × 1,10, modulée par la pente portion par portion (Minetti)
  const flat = thr*1.10;
  let run = 0;
  if (r.runProf) { const el = r.runProf.el, st = r.runProf.step; for (let i = 1; i < el.length; i++) run += st/1000*flat*minetti((el[i] - el[i-1])/st); }
  else { const gUp = (r.runDp || 0)/(r.run*500); run = r.run/2*flat*(minetti(gUp) + minetti(-gUp)); } // sans tracé : moitié montée, moitié descente
  return { swim, t1: 180, bike, t2: 90, run, css, thr, P: Math.round(P), cssData: !!g.css, thrData: !!g.runThr, flat, bikeGpx: !!r.bikeProf, runGpx: !!r.runProf };
}
const fmtHMS = sec => { sec = Math.round(sec); const h = Math.floor(sec/3600), m = Math.floor(sec % 3600/60), x = sec % 60; return h ? `${h}h${pad(m)}'${pad(x)}` : `${m}'${pad(x)}`; };

function phaseOf(k, prev){
  if (k.kind === 'calib') return 'calib';

  if (k.kind === 'load') return [ 'base', 'build1', 'build2', triOn() ? 'spec' : 'peak' ][k.bi ?? 0];
  return prev || 'base'; // semaine allégée / fêtes : dans le bloc en cours
}
function phases(){
  if (!S.profile) return null;
  const ks = weekKinds(S.profile); let prev = null;
  const weeks = ks.map(k => { const ph = phaseOf(k, prev); prev = ph; return { ...k, ph }; });

}
const weekRole = w => w.kind === 'recovery' ? (w.test ? 'Semaine allégée + retest FTP' : 'Semaine allégée : la progression se fait pendant la récup') : w.kind === 'holiday' ? 'Semaine des fêtes : maintien' : w.kind === 'load' ? `Semaine de charge ${(w.pos ?? 0) + 1}/3` : '';

    <div class="ph-now"><b style="color:${I.c}">${esc(I.l)}</b> · semaine ${iw}/${seg.weeks.length} du bloc${weekRole(cur) ? ` · ${esc(weekRole(cur))}` : ''}</div>

// ---- bilan de la semaine ----

    else if ((comp != null && comp < 0.75) || (ramp != null && ramp < 1 && comp != null && comp < 0.9)) { v = 'under'; }
    if (comp != null) why.push(`${Math.round(comp*100)} % de la charge prévue`);
    if (ramp != null) why.push(`fitness ${ramp >= 0 ? '+' : '−'}${Math.abs(ramp).toFixed(1).replace('.', ',')} CTL (cible +3 à +7 en semaine de charge)`);

  const p = S.profile, f0 = S.ftpHistory[0]?.ftp || p.ftp, d0 = S.ftpHistory[0]?.date || p.startDate;

}
function nextKeys(w0){

    ...(triOn() ? (S.triPlan || []).filter(x => inW(x.date) && x.status !== 'skipped' && x.kind !== 'optional' && x.sport !== 'race').map(x => ({ k:'t', x })) : [])];

// semaine à résumer : le dimanche (dès 17 h) et le lundi, la semaine qui se termine / vient de se terminer

}

/* ----- Progression ----- */
function progHTML(){
  const p = S.profile, t = todayISO();
  const done = countDone();
  const acts = S.activities.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const best = k => Math.max(0, ...acts.map(a => a.best?.[k] || 0)) || null;
  // séance qui détient le record (la plus récente en cas d'égalité)
  const bestAct = k => { const v = best(k); return v ? acts.filter(a => a.best?.[k] === v).pop() : null; };
  const f0 =S.ftpHistory[0]?.ftp || ftp();
  const proj = projection();
  let h = '';
  // courbe FTP
  const x0 = parseD(p.startDate).getTime(), x1 = parseD(p.endDate).getTime();
  const tests = S.ftpHistory.map(h => [parseD(h.date).getTime(), h.ftp, String(h.ftp)]);
  const floor = acts.filter(a=>a.best?.m20).map(a => [parseD(a.date).getTime(), Math.round(a.best.m20*0.95)]);
  const ys = [f0, p.goalFtp, ...tests.map(x=>x[1]), ...floor.map(x=>x[1])];
  const yMin = Math.floor((Math.min(...ys)-15)/10)*10, yMax = Math.ceil((Math.max(...ys)+15)/10)*10;
  const xl = []; for (let d = p.startDate.slice(0,8)+'01'; d <= p.endDate; d = addDays(d, 32).slice(0,8)+'01') if (d >= p.startDate) xl.push([parseD(d).getTime(), MONTHS[parseD(d).getMonth()]]);
  const series = [
    { pts:[[x0,f0],[parseD(p.goalDate).getTime(),p.goalFtp]], color:'var(--muted)', dash:'5 5', width:1.5 },
    { type:'dots', pts: floor, color:'var(--z2)', r:3 },
    { pts: tests.map(x=>[x[0],x[1]]), color:'var(--accent)', width:2.5 },
    { type:'dots', pts: tests, color:'var(--accent)' },
  ];
  if (proj) series.push({ pts:[[parseD(proj.fromDate).getTime(), proj.from],[parseD(p.goalDate).getTime(), proj.value]], color:'var(--accent)', dash:'2 4', width:1.5 });
  const todayX = parseD(t).getTime();
  h += `<div class="card"><h2>FTP vs objectif</h2>${lineChart({ series, xMin:x0, xMax:x1, yMin, yMax, xLabels:xl })}
    <div class="legend"><span><i style="background:var(--accent)"></i>Tests FTP</span><span><i style="background:var(--muted)"></i>Trajectoire cible</span><span><i style="background:var(--z2)"></i>95 % du meilleur 20 min de chaque séance</span></div></div>`;
  // records
  // records actuels, ou projetés à la FTP objectif : l'aérobie suit la FTP, le sprint beaucoup moins
  const rGoal = p.goalFtp && ftp() ? p.goalFtp / ftp() : 1, showGoal = recGoal && rGoal > 1;
  const projRec = (k, v) => !v ? null : Math.round(v * (1 + (rGoal - 1) * ({ s5: 0.2, m1: 0.5, m5: 0.9, m20: 1 }[k])));
  h += `<div class="card"><div class="row between"><h2>Records de puissance</h2>${p.goalFtp > ftp() ? `<button class="btn sm ${showGoal ? 'primary' : ''}" data-recgoal aria-pressed="${showGoal}">${showGoal ? 'Actuels' : `À ${p.goalFtp} W`}</button>` : ''}</div>
    <div class="grid4">${[['s5','5 s'],['m1','1 min'],['m5','5 min'],['m20','20 min']].map(([k,l]) => { const v = showGoal ? projRec(k, best(k)) : best(k), ra = bestAct(k);
      return `<div class="kpi"${ra ? ` data-act="${ra.id}" role="button" tabindex="0" aria-label="Voir la séance du record ${l}" style="cursor:pointer"` : ''}><div class="v num"${showGoal ? ' style="color:var(--accent)"' : ''}>${v ?? '—'}<small>${v ? ' W' : ''}</small></div><div class="l">${l}${v ? ` · ${(v/p.weightKg).toFixed(1)} W/kg` : ''}</div>${showGoal && v ? `<div class="tiny muted" style="margin-top:2px">+${v - best(k)} W</div>` : ra ? `<div class="tiny muted" style="margin-top:2px">${fmtShort(ra.date)} ›</div>` : ''}</div>`; }).join('')}
    </div>${showGoal ? `<p class="tiny muted" style="margin:10px 0 0">Projection si ta FTP passe de ${ftp()} à ${p.goalFtp} W (+${Math.round((rGoal-1)*100)} %) à poids égal : 20 min et 5 min suivent la FTP, la minute à moitié, le sprint de 5 s à peine (il dépend surtout de la force et de la vitesse de pédalage). Ordres de grandeur, pas une promesse.</p>` : ''}</div>`;
  // ressentis
  const felt = acts.filter(a=>a.feel?.rpe);
  if (felt.length) {
    h += `<div class="card"><h2>Ressentis</h2><div style="display:flex;align-items:flex-end;gap:4px;height:90px">${felt.slice(-30).map(a=>`<div title="${fmtShort(a.date)} · RPE ${a.feel.rpe}" style="flex:1;max-width:22px;height:${a.feel.rpe*10}%;border-radius:4px 4px 0 0;background:${a.feel.rpe>=9?'var(--bad)':a.feel.rpe>=7?'var(--warn)':'var(--ok)'}"></div>`).join('')}</div>
      <div class="tiny muted" style="margin-top:6px">RPE moyen sur les 5 dernières : <b class="num">${(felt.slice(-5).reduce((a,x)=>a+x.feel.rpe,0)/Math.min(5,felt.length)).toFixed(1)}</b></div></div>`;
  }
  h += Climbs.html();
  h += `<div class="card"><h2>Historique</h2>${acts.length ? acts.slice().reverse().map(actRow).join('') : '<p class="muted">Aucune séance enregistrée.</p>'}</div>`;
  h += Health.otherSportsHTML();
  return h;
}
function projection(){
  const p = S.profile; const H = S.ftpHistory.filter(h => h.source === 'test');
  if (!H.length) return null;
  const last = H[H.length-1];
  const all = S.ftpHistory;
  let rate; // W par semaine
  if (H.length >= 2) { const first = H[0]; const w = diffDays(first.date, last.date)/7; rate = w > 0 ? (last.ftp - first.ftp)/w : 0; }
  else rate = 1.5; // hypothèse prudente : +1,5 W/semaine avec 2-3 séances structurées
  rate = clamp(rate, 0, 3);
  const weeks = Math.max(diffDays(last.date, p.goalDate)/7, 0);
  const value = Math.round(last.ftp + rate*weeks);
  const gap = p.goalFtp - value;
  const text = H.length >= 2
    ? `Au rythme mesuré entre tes tests (${rate.toFixed(1)} W/semaine), tu serais vers ${value} W le ${fmtShort(p.goalDate)}${gap>0?` (${gap} W sous l'objectif)`:' : objectif en vue'}.`
    : `Hypothèse prudente de +1,5 W/semaine : ~${value} W le ${fmtShort(p.goalDate)}. Il te faudrait ${((p.goalFtp-last.ftp)/Math.max(weeks,1)).toFixed(1)} W/semaine pour ${p.goalFtp} W. Le prochain test affinera.`;
  return { value, text, from: last.ftp, fromDate: last.date };
}

/* ============ import de l'export Apple Santé (export.zip / export.xml) ============ */
const HealthImport = (() => {
  const DAYS = 120;
  const Q = { // type HealthKit -> [métrique, agrégat]
    HKQuantityTypeIdentifierHeartRateVariabilitySDNN: ['hrv','avg'], HKQuantityTypeIdentifierRestingHeartRate: ['rhr','avg'],
    HKQuantityTypeIdentifierBodyMass: ['weight','last'], HKQuantityTypeIdentifierVO2Max: ['vo2max','last'],
    HKQuantityTypeIdentifierRespiratoryRate: ['resp_rate','avg'], HKQuantityTypeIdentifierOxygenSaturation: ['spo2','avg'],
    HKQuantityTypeIdentifierBodyFatPercentage: ['body_fat','last'], HKQuantityTypeIdentifierLeanBodyMass: ['lean_mass','last'],
    HKQuantityTypeIdentifierAppleExerciseTime: ['exercise_min','sum'], HKQuantityTypeIdentifierWalkingHeartRateAverage: ['walking_hr','avg'],
    HKQuantityTypeIdentifierBloodPressureSystolic: ['systolic','avg'], HKQuantityTypeIdentifierBloodPressureDiastolic: ['diastolic','avg'],
  };
  const SLEEP = 'HKCategoryTypeIdentifierSleepAnalysis';
  const WT = { Running:'Course à pied', Cycling:'Vélo', Swimming:'Natation', Walking:'Marche', Hiking:'Randonnée', TraditionalStrengthTraining:'Renforcement musculaire', FunctionalStrengthTraining:'Renforcement fonctionnel', HighIntensityIntervalTraining:'HIIT', CoreTraining:'Gainage', Yoga:'Yoga', Pilates:'Pilates', Elliptical:'Elliptique', Rowing:'Aviron', CrossTraining:'Cross training', Flexibility:'Mobilité', MixedCardio:'Cardio', Other:'Autre', Surfing:'Surf', SurfingSports:'Surf', Climbing:'Escalade', Cooldown:'Retour au calme', Soccer:'Football', Tennis:'Tennis', Basketball:'Basket', Skiing:'Ski', DownhillSkiing:'Ski alpin', CrossCountrySkiing:'Ski de fond', Boxing:'Boxe', MartialArts:'Arts martiaux', Paddling:'Paddle', StairClimbing:'Escaliers', Dance:'Danse', Badminton:'Badminton', Squash:'Squash', Padel:'Padel', PickleBall:'Pickleball' };
  const isoOf = s => s ? s.replace(' ', 'T').replace(/ ([+-]\d{2})(\d{2})$/, '$1:$2') : null; // "2026-10-20 07:12:00 +0200"
  const attrs = s => { const o = {}; s.replace(/(\w+)="([^"]*)"/g, (_, k, v) => { o[k] = v; return ''; }); return o; };

  // --- lecture du zip sans tout charger en mémoire (gère le ZIP64 des gros exports) ---
  async function zipEntry(file){
    const tailLen = Math.min(file.size, 70000), tail = new DataView(await file.slice(file.size - tailLen).arrayBuffer());
    let e = -1; for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { e = i; break; }
    if (e < 0) throw new Error('Archive .zip illisible');
    let cdOff = tail.getUint32(e + 16, true), cdSize = tail.getUint32(e + 12, true), n = tail.getUint16(e + 10, true);
    if (cdOff === 0xFFFFFFFF || n === 0xFFFF) { // ZIP64
      const loc = e - 20; if (loc < 0 || tail.getUint32(loc, true) !== 0x07064b50) throw new Error('ZIP64 non reconnu');
      const e64 = Number(tail.getBigUint64(loc + 8, true));
      const r = new DataView(await file.slice(e64, e64 + 56).arrayBuffer());
      n = Number(r.getBigUint64(32, true)); cdSize = Number(r.getBigUint64(40, true)); cdOff = Number(r.getBigUint64(48, true));
    }
    const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
    let p = 0;
    for (let k = 0; k < n && p < cd.byteLength; k++) {
      const method = cd.getUint16(p + 10, true); let csize = cd.getUint32(p + 20, true), usize = cd.getUint32(p + 24, true);
      const nl = cd.getUint16(p + 28, true), xl = cd.getUint16(p + 30, true), cl = cd.getUint16(p + 32, true); let off = cd.getUint32(p + 42, true);
      const name = new TextDecoder().decode(new Uint8Array(cd.buffer, p + 46, nl));
      let x = p + 46 + nl; const xe = x + xl;
      while (x + 4 <= xe) { const id = cd.getUint16(x, true), sz = cd.getUint16(x + 2, true); if (id === 1) { let q = x + 4; if (usize === 0xFFFFFFFF) { usize = Number(cd.getBigUint64(q, true)); q += 8; } if (csize === 0xFFFFFFFF) { csize = Number(cd.getBigUint64(q, true)); q += 8; } if (off === 0xFFFFFFFF) { off = Number(cd.getBigUint64(q, true)); } } x += 4 + sz; }
      p = xe + cl;
      if (!/(^|\/)export\.xml$/i.test(name)) continue;
      const lh = new DataView(await file.slice(off, off + 30).arrayBuffer());
      const start = off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
      return { start, csize, method };
    }
    throw new Error('export.xml introuvable dans l’archive');
  }

  async function run(file, box){
    const sb = Cloud.sb, user = Cloud.user;
    if (!sb || !user) { box.innerHTML = '<div class="note bad">Connecte-toi d’abord à ton compte.</div>'; return; }
    if (!('DecompressionStream' in window) || !('TextDecoderStream' in window)) { box.innerHTML = '<div class="note bad">Navigateur trop ancien : mets à jour iOS (16.4 minimum).</div>'; return; }
    const btn = $('#hImportBtn'); if (btn) btn.disabled = true;
    const status = t => box.innerHTML = `<div class="note">${t}</div>`;
    try {
      status('Ouverture du fichier…');
      const head = new Uint8Array(await file.slice(0, 4).arrayBuffer());
      let stream, total;
      if (head[0] === 0x50 && head[1] === 0x4b) {
        const ent = await zipEntry(file); total = ent.csize;
        let s = file.slice(ent.start, ent.start + ent.csize).stream();
        stream = { s, deflate: ent.method === 8 };
      } else { total = file.size; stream = { s: file.stream(), deflate: false }; }
      let read = 0, lastUi = 0;
      const counter = new TransformStream({ transform(chunk, ctrl){ read += chunk.byteLength; const now = Date.now(); if (now - lastUi > 400) { lastUi = now; status(`Lecture de ton historique… <b>${Math.min(99, Math.round(read/total*100))} %</b><br><span class="tiny muted">${(read/1e6).toFixed(0)} / ${(total/1e6).toFixed(0)} Mo · ne quitte pas l'app</span>`); } ctrl.enqueue(chunk); } });
      let s = stream.s.pipeThrough(counter);
      if (stream.deflate) s = s.pipeThrough(new DecompressionStream('deflate-raw'));
      const reader = s.pipeThrough(new TextDecoderStream()).getReader();

      const cutoff = addDays(todayISO(), -DAYS);
      const daily = {}; // day|metric -> {sum,n,last,lastT}
      const segs = []; const workouts = []; let cur = null;
      const RE = /<(Record|Workout|WorkoutStatistics|MetadataEntry|\/Workout)\b([^>]*)>/g;
      const handle = (tag, a) => {
        if (tag === 'Record') {
          const t = a.match(/type="([^"]+)"/)?.[1]; if (!t) return;
          if (t !== SLEEP && !Q[t]) return;
          const at = attrs(a); const sd = at.startDate || ''; if (sd.slice(0, 10) < cutoff) return;
          if (t === SLEEP) { segs.push({ s: isoOf(at.startDate), e: isoOf(at.endDate), v: at.value || '', src: at.sourceName || '' }); return; }
          const [m, agg] = Q[t]; let v = parseFloat(at.value); if (isNaN(v)) return;
          if (m === 'weight' && /lb/i.test(at.unit || '')) v *= 0.4536;
          if ((m === 'spo2' || m === 'body_fat') && v <= 1) v *= 100;
          if (m === 'exercise_min' && !/watch/i.test(at.sourceName || '') && !/watch/i.test(at.device || '')) { /* minutes d'exercice : la montre fait foi */ }
          const day = sd.slice(0, 10), key = day + '|' + m, o = daily[key] ||= { day, m, agg, sum: 0, n: 0, last: null, lastT: '' };
          o.sum += v; o.n++; if (sd >= o.lastT) { o.last = v; o.lastT = sd; }
        } else if (tag === 'Workout') {
          const at = attrs(a); if ((at.startDate || '').slice(0, 10) < cutoff) { cur = null; return; }
          const type = (at.workoutActivityType || '').replace('HKWorkoutActivityType', '');
          let dur = parseFloat(at.duration); if (/s$|^s/i.test(at.durationUnit || '') && at.durationUnit !== 'min') dur = dur / 60; if (/hr|h$/i.test(at.durationUnit || '')) dur = dur * 60;
          cur = { start_at: isoOf(at.startDate), end_at: isoOf(at.endDate), type: WT[type] || type, duration_min: isNaN(dur) ? null : dur,
            distance_km: at.totalDistance ? +at.totalDistance * (/mi/i.test(at.totalDistanceUnit||'') ? 1.609 : /^m$/i.test(at.totalDistanceUnit||'') ? 0.001 : 1) : null,
            energy_kcal: at.totalEnergyBurned ? +at.totalEnergyBurned : null, avg_hr: null, source: at.sourceName || '' };
          if (/\/\s*$/.test(a)) { workouts.push(cur); cur = null; }
        } else if (tag === 'MetadataEntry') {
          if (cur && /key="HKIndoorWorkout"/.test(a)) cur.indoor = /value="1"/.test(a);
        } else if (tag === 'WorkoutStatistics' && cur) {
          const at = attrs(a), t = at.type || '';
          if (/HeartRate$/.test(t) && at.average) cur.avg_hr = +at.average;
          else if (/ActiveEnergyBurned/.test(t) && at.sum) cur.energy_kcal = +at.sum;
          else if (/Distance/.test(t) && at.sum) cur.distance_km = +at.sum * (/mi/i.test(at.unit||'') ? 1.609 : /^m$/i.test(at.unit||'') ? 0.001 : 1);
        } else if (tag === '/Workout' && cur) { workouts.push(cur); cur = null; }
      };
      let buf = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (value) buf += value;
        const cut = done ? buf.length : buf.lastIndexOf('>') + 1;
        if (cut > 0) { const part = buf.slice(0, cut); buf = buf.slice(cut); RE.lastIndex = 0; let m; while ((m = RE.exec(part))) handle(m[1], m[2]); }
        if (done) break;
      }

      status('Calcul de tes nuits et de tes séances…');
      // mesures quotidiennes
      const rowsD = Object.values(daily).map(o => ({ user_id: user.id, day: o.day, metric: o.m, value: +(o.agg === 'sum' ? o.sum : o.agg === 'last' ? o.last : o.sum / o.n).toFixed(2), updated_at: new Date().toISOString() }));
      // nuits : rattachées au jour du réveil, une source retenue (montre en priorité)
      const stage = v => /InBed/.test(v) ? 'inbed' : /Deep/.test(v) ? 'deep' : /REM/.test(v) ? 'rem' : /Core/.test(v) ? 'core' : /Awake/.test(v) ? 'awake' : 'asleep';
      const byNight = {};
      for (const g of segs) { if (!g.s || !g.e) continue; const night = g.e.slice(0, 10); ((byNight[night] ||= {})[g.src] ||= []).push({ s: Date.parse(g.s), e: Date.parse(g.e), st: stage(g.v) }); }
      const union = iv => { iv.sort((a,b)=>a[0]-b[0]); let t=0, cs=-1, ce=-1; for (const [s,e] of iv){ if (s>ce){ if (ce>cs) t+=ce-cs; cs=s; ce=e; } else ce=Math.max(ce,e); } if (ce>cs) t+=ce-cs; return Math.round(t/60000); };
      const rowsS = [];
      for (const [night, bySrc] of Object.entries(byNight)) {
        const cands = Object.entries(bySrc).map(([src, list]) => {
          const m = st => union(list.filter(x => x.st === st).map(x => [x.s, x.e]));
          const core = m('core'), deep = m('deep'), rem = m('rem'), plain = m('asleep'), asleep = core + deep + rem || plain;
          return { source: src, asleep_min: asleep, core_min: core || null, deep_min: deep || null, rem_min: rem || null, awake_min: m('awake') || null, in_bed_min: m('inbed') || null,
            bed_start: new Date(Math.min(...list.map(x=>x.s))).toISOString(), bed_end: new Date(Math.max(...list.map(x=>x.e))).toISOString(),
            sc: asleep + (/watch/i.test(src) ? 10000 : 0) + (deep + rem ? 5000 : 0) };
        }).filter(c => c.asleep_min >= 120).sort((a,b) => b.sc - a.sc);
        if (cands.length) { const { sc, ...best } = cands[0]; rowsS.push({ user_id: user.id, night, ...best, updated_at: new Date().toISOString() }); }
      }
      // séances : doublons (montre / Strava / Garmin Connect) à ±5 min fusionnés
      const prio = s => /garmin|connect/i.test(s) ? 3 : /watch|apple|forme|fitness/i.test(s) ? 2 : /strava/i.test(s) ? 1 : 0;
      workouts.sort((a,b) => a.start_at.localeCompare(b.start_at));
      const rowsW = [];
      for (const w of workouts) {
        const prev = rowsW[rowsW.length-1];
        if (prev && Math.abs(Date.parse(w.start_at) - Date.parse(prev.start_at)) <= 300000) {
          const keepNew = prio(w.source) > prio(prev.source); const base = keepNew ? { ...w } : prev, other = keepNew ? prev : w;
          for (const k of ['end_at','duration_min','distance_km','energy_kcal','avg_hr','indoor']) if (base[k] == null) base[k] = other[k];
          if (/^(Autre|Other|)$/.test(base.type || '') && other.type && !/^(Autre|Other)$/.test(other.type)) base.type = other.type; // garder le type le plus précis (ex. Hevy > Strava « Autre »)
          if (keepNew) rowsW[rowsW.length-1] = { ...base, user_id: user.id }; else rowsW[rowsW.length-1] = base;
          continue;
        }
        rowsW.push({ ...w, user_id: user.id, updated_at: new Date().toISOString() });
      }
      // envoi
      // chaque ligne doit avoir exactement les mêmes colonnes (sinon PostgREST met les absentes à NULL)
      const COLS = { health_daily:['user_id','day','metric','value'], health_sleep:['user_id','night','source','asleep_min','core_min','deep_min','rem_min','awake_min','in_bed_min','bed_start','bed_end'], health_workouts:['user_id','start_at','end_at','type','duration_min','distance_km','energy_kcal','avg_hr','source','indoor'] };
      const norm = (table, rows) => { const now = new Date().toISOString(); return rows.map(r => { const o = { updated_at: now }; for (const c of COLS[table]) o[c] = r[c] ?? null; o.user_id = user.id; return o; }); };
      const up = async (table, rows0, conflict) => { const rows = norm(table, rows0); for (let i = 0; i < rows.length; i += 400) { status(`Enregistrement… ${table.replace('health_','')} ${Math.min(i+400, rows.length)}/${rows.length}`); const { error } = await sb.from(table).upsert(rows.slice(i, i+400), { onConflict: conflict }); if (error) throw new Error(error.message); } };
      // les séances déjà présentes (raccourci) à ±5 min sont remplacées par la version de l'export
      if (rowsW.length) { const since = rowsW[0].start_at; await sb.from('health_workouts').delete().eq('user_id', user.id).gte('start_at', since); }
      await up('health_daily', rowsD, 'user_id,day,metric');
      await up('health_sleep', rowsS, 'user_id,night');
      await up('health_workouts', rowsW, 'user_id,start_at');
      S.healthImportedAt = new Date().toISOString(); save();
      await Health.load(sb);
      const nH = rowsD.filter(r => r.metric === 'hrv').length;
      HealthImport.last = `<div class="note ok"><b>Historique importé ✔</b><br>${nH} jours de VFC · ${rowsD.filter(r=>r.metric==='rhr').length} de FC repos · ${rowsS.length} nuits · ${rowsW.length} séances${rowsD.some(r=>r.metric==='weight')?' · poids':''}${rowsD.some(r=>r.metric==='vo2max')?' · VO2max':''} (${DAYS} derniers jours).<br>Ton indice de forme est calibré : regarde l'onglet Aujourd'hui.</div>`;
      render();
    } catch (e) {
      console.error(e);
      box.innerHTML = `<div class="note bad">Import interrompu : ${esc(e.message || e)}. Réessaie ; si ça recommence, envoie-moi une capture.</div>`;
    } finally { const b = $('#hImportBtn'); if (b) b.disabled = false; }
  }
  return { run, last: '' };
})();

/* ============ explications des chiffres ============ */
const lastLoad = () => { const L = loadSeries(); return L[L.length-1] || null; };
const scale = (rows, v) => `<div class="infoscale">${rows.map(([lo,hi,lab,txt]) => `<div class="${v!=null && v>=lo && v<hi ? 'on':''}"><b>${lab}</b><span>${txt}</span></div>`).join('')}</div>`;
const INFO = {
  periodisation: () => ({ t:'La méthode du plan vélo', body:`<p><b>Périodisation par blocs de 4 semaines</b> : 3 semaines de charge progressive puis 1 semaine allégée (schéma 3:1). L'adaptation se fait pendant la récupération, pas pendant l'effort.</p>
      <p><b>Progression des intensités</b> : Base (sweet spot 88–94 % FTP, force en cadence basse) → Build 1 (seuil 95–105 %) → Build 2 (seuil + VO2max) → Peak / Spécifique, puis affûtage d'une semaine avant le test final ou la course. Dans chaque bloc, la même famille de séance s'allonge ou se durcit d'une semaine à l'autre (surcharge progressive).</p>
      <p><b>Mesure</b> : zones de Coggan en % de FTP, test rampe (FTP = 75 % de la meilleure minute) ou 20 min (95 %), retest toutes les ~6 semaines pour recaler les watts. Charge en TSS ; fitness (CTL, 42 j) et fatigue (ATL, 7 j) selon le modèle impulsion-réponse de Banister.</p>
      <p><b>Ce que dit la recherche, honnêtement</b> : le sweet spot est très rentable quand le temps est compté (≈ 6–8 h / semaine), mais beaucoup d'études sur des athlètes d'endurance favorisent une répartition <b>polarisée</b> (≈ 80 % facile, 20 % dur). Le plan s'en rapproche avec 2–3 séances clés par semaine, le reste en endurance facile. En mode triathlon, les sorties longues et les blocs nat / course augmentent la part facile.</p>
      <p class="muted">Aucun plan ne garantit un résultat : les tests disent si la trajectoire tient.</p>` }),
  ctl: () => { const l = lastLoad(); const v = l ? Math.round(l.ctl) : null;
    const L = loadSeries(); const w = L.length > 7 ? Math.round(l.ctl - L[L.length-8].ctl) : null;
    return { t:'Fitness (CTL)', body:`<p>Ton <b>niveau d'entraînement de fond</b> : la moyenne de ta charge quotidienne sur les <b>42 derniers jours</b> (6 semaines). Plus il monte, plus ton corps est habitué à encaisser du travail. C'est lui qui porte la progression de ta FTP.</p>
      <p>Chaque séance donne un score de charge (TSS : 1 h pile à ta FTP = 100). Le CTL lisse ces scores sur 6 semaines.</p>
      ${scale([[0,30,'< 30','Reprise, base légère'],[30,50,'30 – 50','Pratiquant régulier'],[50,70,'50 – 70','Bien entraîné'],[70,999,'> 70','Très chargé (triathlète en préparation)']], v)}
      <p><b>Toi : ${v ?? '—'}</b>${w!=null?` · ${w>=0?'+':''}${w} sur 7 jours`:''}. Une hausse de <b>+3 à +6 par semaine</b> est productive et tenable ; au-delà de +8, le risque de fatigue ou de blessure grimpe.</p>` }; },
  atl: () => { const l = lastLoad(); const v = l ? Math.round(l.atl) : null;
    return { t:'Fatigue (ATL)', body:`<p>Ta <b>charge récente</b> : la même moyenne que le CTL mais sur <b>7 jours</b> seulement. Elle réagit vite : une grosse séance la fait bondir, deux jours de repos la font redescendre.</p>
      <p>On la compare toujours au CTL : si la fatigue dépasse nettement la fitness, tu es en train de charger (normal en bloc dur) ; si elle passe en dessous, tu récupères.</p>
      <p><b>Toi : ${v ?? '—'}</b>${l?` (fitness ${Math.round(l.ctl)})`:''}. ${l ? (l.atl > l.ctl + 10 ? 'Tu charges en ce moment : surveille le sommeil et les jambes.' : l.atl < l.ctl - 10 ? 'Charge récente faible : tu es en phase de récupération.' : 'Charge récente équilibrée avec ton niveau de fond.') : ''}</p>` }; },
  tsb: () => { const l = lastLoad(); const v = l ? Math.round(l.tsb) : null;
    return { t:'Forme (TSB)', body:`<p><b>Forme = Fitness − Fatigue</b> (CTL − ATL, valeurs de la veille). C'est ta « fraîcheur » du jour : positif, tu es reposé ; négatif, tu portes de la fatigue d'entraînement.</p>
      ${scale([[-999,-30,'< −30','Fatigue élevée : risque de surmenage, lève le pied'],[-30,-10,'−30 à −10','Zone de travail : fatigue productive, c’est là que tu progresses'],[-10,5,'−10 à +5','Neutre : séances normales'],[5,25,'+5 à +25','Frais : idéal pour un test FTP ou une course'],[25,999,'> +25','Très frais : si ça dure, tu perds en forme']], v)}
      <p><b>Toi : ${v ?? '—'}</b>. ${v==null?'':v>=5?'Bon moment pour un test ou une séance qualitative.':v>=-10?'Rien à signaler, suis le plan.':v>=-30?'Normal en plein bloc ; les semaines allégées sont là pour remonter.':'Allège : passe la prochaine séance clé en endurance.'}</p>` }; },
  loadchart: () => ({ t:'Le graphique forme & fatigue', body:`<p><span style="color:var(--z2)">■</span> <b>Fitness</b> (CTL, 6 semaines) : la courbe lente, ton niveau de fond. Tu veux qu'elle monte doucement jusqu'à mars.</p>
      <p><span style="color:var(--z5)">■</span> <b>Fatigue</b> (ATL, 7 jours) : la courbe nerveuse, elle suit tes séances de la semaine.</p>
      <p><span style="color:var(--z3)">■</span> <b>Forme</b> (TSB) : l'écart entre les deux. Elle plonge pendant les blocs et remonte pendant les semaines allégées : c'est le rythme voulu par le plan.</p>

  ftp: () => { const f = ftp(), w = S.profile.weightKg;
    return { t:'FTP', body:`<p>La <b>Functional Threshold Power</b> : la puissance que tu peux tenir environ <b>1 heure</b> à fond. C'est la référence de toutes tes zones : chaque séance est exprimée en % de ta FTP, puis convertie en watts.</p>

function infoKey(label){
  const l = label.trim();
  if (/CTL|^Fitness/.test(l)) return 'ctl'; if (/ATL|^Fatigue/.test(l)) return 'atl'; if (/TSB|^Forme/.test(l)) return 'tsb';
  if (/^FTP/i.test(l)) return 'ftp'; if (/W\/kg/i.test(l) && !/^(5 s|1 min|5 min|20 min)/i.test(l)) return 'wkg'; if (/^Projection/i.test(l)) return 'proj';
  if (/^Séances/i.test(l)) return 'sessions'; if (/^Objectif/i.test(l)) return 'goal';
  const r = l.match(/^(5 s|1 min|5 min|20 min)/i); if (r) return 'rec:' + r[1];
  if (/^NP$/i.test(l)) return 'np'; if (/^IF$/i.test(l)) return 'if'; if (/^TSS$/i.test(l)) return 'tss'; if (/^P\. moy/i.test(l)) return 'avgp';
  if (/^FC (moy|max)/i.test(l)) return 'hr'; if (/^VFC/i.test(l)) return 'hrv'; if (/^FC repos/i.test(l)) return 'rhr'; if (/^Sommeil/i.test(l)) return 'sleep'; if (/^Poids/i.test(l)) return 'weight';
  return null;
}

function absencesHTML(){

  return `<div style="margin-top:12px">${list.map(a => `<div class="hist"><span>✈︎</span><div style="flex:1"><b>${fmtShort(a.from)} → ${fmtShort(a.to)}</b><div class="tiny muted">${a.moves.length} séance${a.moves.length>1?'s':''} reprogrammée${a.moves.length>1?'s':''}${a.label?` · ${esc(a.label)}`:''}</div></div><button class="btn sm ghost" data-undoabs="${a.id}">Annuler</button></div>`).join('')}</div>`;

const dayFree = (date, exceptIds, absFrom, absTo) => !(date >= absFrom && date <= absTo) && !S.plan.some(x => x.date === date && x.status !== 'skipped' && !exceptIds.has(x.id) && mandatory(x));
function hardOk(s, date, moved){
  if (!isHard(s.workoutId)) return true;
  return !S.plan.some(x => x.id !== s.id && x.status !== 'skipped' && isHard(moved.get(x.id)?.workoutId || x.workoutId) && Math.abs(diffDays(moved.get(x.id)?.date || x.date, date)) < 2 && !(moved.get(x.id)?.skip));
}
// propose une nouvelle date pour chaque séance tombant pendant l'absence
function planAbsence(from, to){
  const p = S.profile, t = todayISO();
  const hit = S.plan.filter(s => s.status === 'planned' && s.date >= from && s.date <= to).sort((a,b) => (mandatory(b)-mandatory(a)) || a.date.localeCompare(b.date));
  const moved = new Map(); // id -> {date, skip}
  const taken = new Set();
  for (const s of hit) {
    if (!mandatory(s)) { moved.set(s.id, { date: s.date, skip: true, reason: 'optionnelle' }); continue; }
    const cands = [];
    for (let k = -4; k <= 9; k++) {
      const d = k < 0 ? addDays(from, k) : addDays(to, k + 1);
      if (d <= t || d > p.endDate) continue; // à partir de demain
      if (taken.has(d)) continue;
      const avail = p.days[dowMon(d)]?.avail;
      if (!dayFree(d, new Set([s.id]), from, to)) continue;

    const before = S.plan.filter(x => x.status === 'planned' && !moved.has(x.id) && mandatory(x) && WORKOUTS[x.workoutId].type !== 'test' && x.date > to && x.date < m.date).sort((a,b)=>a.date.localeCompare(b.date))[0];

function tentativeConflict(s, date, tmp){ // comme hardConflict, mais avec les déplacements proposés
  if (!isHard(s.workoutId)) return '';

    return isHard(x.workoutId) && Math.abs(diffDays(m ? m.date : x.date, date)) < 2; });
  return near ? `⚠️ ${WORKOUTS[near.workoutId].name} à moins de 48 h` : '';
}
function applyAbsence(from, to, choices){
  const p = S.profile; p.absences ||= [];
  const rec = { id: uid(), from, to, label: $('#abLabel')?.value.trim() || '', moves: [] };
  for (const [id, m] of choices) {
    const s = S.plan.find(x => x.id === id); if (!s) continue;
    rec.moves.push({ id, date: s.date, status: s.status, week: s.week });
    if (m.skip) s.status = 'skipped';
    else { s.date = m.date; s.week = Math.floor(diffDays(monday(p.startDate), m.date)/7); }
  }
  // jours indisponibles mémorisés pour les prochaines régénérations
  p.absences.push(rec);
  S.plan.sort((a,b)=>a.date.localeCompare(b.date));
  save(); closeDlg(); render();
  const mv = rec.moves.length; toast(mv ? `Absence enregistrée · ${mv} séance${mv>1?'s':''} reprogrammée${mv>1?'s':''}` : 'Absence enregistrée');
}
function undoAbsence(id){
  const p = S.profile; const a = (p.absences||[]).find(x => x.id === id); if (!a) return;

  S.plan.sort((x,y)=>x.date.localeCompare(y.date)); save(); render(); toast('Absence annulée, séances remises à leur place');
}

/* ============ tracés GPS (sorties extérieures) ============ */
// stockés à part (table activity_tracks + cache local), retrouvés par l'heure de départ de la sortie
const Tracks = (() => {
  const KEY = 'ftpb-tracks', MAX_LOCAL = 40;
  let cache = {}; try { cache = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
  const persist = () => { try {
    const ks = Object.keys(cache);
    if (ks.length > MAX_LOCAL) ks.sort((a, b) => (cache[a].at || 0) - (cache[b].at || 0)).slice(0, ks.length - MAX_LOCAL).forEach(k => delete cache[k]);
    localStorage.setItem(KEY, JSON.stringify(cache));
  } catch {} };
  // séries alignées -> tracé compact (≤ 800 points) ; d en km, spd en km/h, alt en m
  function build({ lat, lon, alt, d, t, spd, hr }){
    const idx = []; for (let i = 0; i < (lat?.length || 0); i++) if (lat[i] != null && lon[i] != null && (lat[i] || lon[i])) idx.push(i);
    if (idx.length < 10) return null;
    const k = Math.max(1, Math.ceil(idx.length / 800)), pick = idx.filter((_, j) => j % k === 0); if (pick[pick.length-1] !== idx[idx.length-1]) pick.push(idx[idx.length-1]);
    const r = (x, n) => x == null || !isFinite(x) ? null : +(+x).toFixed(n);
    const col = (arr, n) => arr && arr.some(v => v != null) ? pick.map(i => r(arr[i], n)) : null;
    return { v:1, lat: pick.map(i => r(lat[i], 5)), lon: pick.map(i => r(lon[i], 5)), alt: col(alt, 1), d: col(d, 3), t: t ? pick.map(i => t[i]) : null, spd: col(spd, 1), hr: col(hr, 0) };
  }
  const fromRecords = recs => { const R = recs.filter(x => x.t != null); const t0 = R[0]?.t || 0;
    return build({ lat: R.map(x => x.lat), lon: R.map(x => x.lon), alt: R.map(x => x.alt), d: R.map(x => x.dist), t: R.map(x => x.t - t0), spd: R.map(x => x.spd), hr: R.map(x => x.hr) }); };
  const fromStreams = st => !st?.latlng ? null : build({ lat: st.latlng.map(p => p?.[0]), lon: st.latlng.map(p => p?.[1]), alt: st.altitude, d: st.distance?.map(x => x/1000), t: st.time, spd: st.velocity_smooth?.map(x => x*3.6), hr: st.heartrate });
  function local(ts){ for (const k of Object.keys(cache)) if (Math.abs(+k - ts) <= 180) return cache[k].track; return null; }
  async function put(ts, track, source){
    if (!ts || !track) return; cache[ts] = { track, at: Date.now() }; persist();
    try { const sb = Cloud.sb, u = Cloud.user; if (sb && u) await sb.from('activity_tracks').upsert({ user_id: u.id, start_ts: ts, source, track }); } catch (e) { console.warn('tracé', e); }
  }
  async function get(a){
    if (!a?.startTs) return null;
    const l = local(a.startTs); if (l) return l;
    try { const sb = Cloud.sb, u = Cloud.user; if (!sb || !u) return null;
      const { data } = await sb.from('activity_tracks').select('start_ts, track').gte('start_ts', a.startTs - 180).lte('start_ts', a.startTs + 180).limit(1);
      if (data?.[0]) { cache[data[0].start_ts] = { track: data[0].track, at: Date.now() }; persist(); return data[0].track; }
    } catch (e) { console.warn('tracé', e); }
    return null;
  }
  return { build, fromRecords, fromStreams, put, get, local };
})();
