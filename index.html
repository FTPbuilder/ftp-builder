<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>FTP Builder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115; --bg2:#171a21; --card:#1c2029; --line:#2a2f3b; --text:#eef0f4; --muted:#9aa1b0;
  --accent:#ff6a2b; --accent2:#ffb02e; --ok:#3ecf8e; --warn:#ffb02e; --bad:#ff4d5e;
  --z1:#6b7280; --z2:#3b82f6; --z3:#22c55e; --z4:#facc15; --z5:#f97316; --z6:#ef4444;
  --radius:14px; --shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#f5f4f1; --bg2:#ecebe7; --card:#ffffff; --line:#e1dfda; --text:#16181d; --muted:#666c78; --shadow:0 1px 2px rgba(0,0,0,.05); }
}
:root[data-theme="light"]{ --bg:#f5f4f1; --bg2:#ecebe7; --card:#ffffff; --line:#e1dfda; --text:#16181d; --muted:#666c78; --shadow:0 1px 2px rgba(0,0,0,.05); }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Barlow Condensed","Arial Narrow",Inter,system-ui,sans-serif;letter-spacing:.01em;margin:0}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{max-width:760px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:14px;flex-wrap:wrap}
html,body{max-width:100%;overflow-x:hidden}
@media (max-width:420px){ .brand h1{font-size:24px} .brand small{display:none} header.top .chip{font-size:11px;padding:3px 8px} }
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:28px;font-weight:700;text-transform:uppercase}
.brand h1 b{color:var(--accent)}
.brand small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:20px;font-weight:600;text-transform:uppercase;margin-bottom:10px}
.card h3{font-size:17px;font-weight:600;margin-bottom:6px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:11.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){ .grid4{grid-template-columns:repeat(2,1fr)} .grid3{grid-template-columns:1fr 1fr} }
.kpi{background:var(--bg2);border-radius:12px;padding:10px 12px}
.kpi .v{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:30px;font-weight:700;line-height:1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{display:flex;max-width:760px;width:100%;justify-content:space-around}
nav.tabs button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;padding:6px 10px;cursor:pointer;border-radius:10px;min-width:64px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
.prof{display:flex;align-items:flex-end;gap:1px;height:70px;background:var(--bg2);border-radius:10px;padding:6px;overflow:hidden}
.prof div{border-radius:2px 2px 0 0;min-width:1px}
.steps{width:100%;border-collapse:collapse;font-size:13.5px}
.steps td{padding:6px 4px;border-bottom:1px solid var(--line)}
.steps td.r{text-align:right}
.zone{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.week{margin-bottom:14px}
.week .wh{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 6px}
.week .wh h3{font-size:16px;text-transform:uppercase}
.sess{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer}
.sess:hover{border-color:var(--muted)}
.sess .d{width:46px;text-align:center;flex:none}
.sess .d b{display:block;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:22px;line-height:1}
.sess .d span{font-size:11px;color:var(--muted);text-transform:uppercase}
.sess .m{flex:1;min-width:0}
.sess .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .st{flex:none;font-size:18px}
.sess.done{border-left:4px solid var(--ok)} .sess.skipped{opacity:.5} .sess.today{outline:2px solid var(--accent)}
.sess.opt .m b::after{content:" · optionnelle";color:var(--muted);font-weight:400;font-size:12px}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.note{background:color-mix(in srgb,var(--accent) 12%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.note.ok{background:color-mix(in srgb,var(--ok) 12%,var(--card));border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.note.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px 3px 6px;text-align:center;font-size:12px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;min-width:0}
.day.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg2))}
.day button{background:none;border:0;cursor:pointer;width:100%;font-weight:600;padding:10px 0;font-size:13px}
.day.on button{color:var(--accent)}
.day input:disabled{opacity:.35;pointer-events:none}
.day input{width:100%;min-height:32px;padding:4px 0;text-align:center;font-size:12px;border-radius:7px;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg2);border-radius:9px;padding:7px 11px;cursor:pointer;min-width:38px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
dialog{border:0;padding:0;background:transparent;max-width:640px;width:calc(100% - 24px);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog .card{max-height:88vh;overflow-y:auto;overflow-x:hidden;margin:0}
dialog{margin:auto;box-sizing:border-box}
.grid2>*,.grid3>*,.grid4>*{min-width:0}
input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
.x{float:right;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px;font-family:Inter}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.hist{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;color:var(--muted)}
.drop:hover{border-color:var(--accent);color:var(--text)}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;max-width:90%;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.onb{max-width:640px;margin:0 auto}
.hero{padding:6px 2px 14px}
.hero h1{font-size:40px;font-weight:700;text-transform:uppercase;line-height:.95}
.hero h1 b{color:var(--accent)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs hidden" id="tabs"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Aujourd'hui</button>
  <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendrier</button>
  <button data-tab="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progression</button>
  <button data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</button>
</div></nav>
<dialog id="dlg"><div class="card" id="dlgBody"></div></dialog>
<input type="file" id="fileIn" class="hidden">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
const APP_VERSION = '0.3.3';
/* ---- configuration cloud ---- */
const SB_URL = 'https://jhemwfhmohqncywjixgh.supabase.co';
const SB_KEY = 'sb_publishable_zrv0VlJ43zNW4IyGZEuByw_4HRwzzF5';
const STRAVA_CLIENT_ID = ''; // à renseigner : strava.com/settings/api > Client ID
const LS_KEY = 'ftpb_state_v1';

/* ============ utilitaires ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const todayISO = () => iso(new Date());
const dowMon = s => (parseD(s).getDay() + 6) % 7; // 0 = lundi
const monday = s => addDays(s, -dowMon(s));
const DOW = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fmtDate = s => { const d = parseD(s); return `${DOW[dowMon(s)].toLowerCase()} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtShort = s => { const d = parseD(s); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtDur = sec => { sec = Math.round(sec); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return h ? `${h}h${pad(m)}` : (s && m < 10 ? `${m}'${pad(s)}` : `${m}'`); };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round5 = w => Math.round(w / 5) * 5;
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ============ état ============ */
let S = load();
function blank(){ return { version:1, profile:null, plan:[], activities:[], ftpHistory:[], settings:{ theme:'auto' } }; }
function load(){ try { const r = localStorage.getItem(LS_KEY); if (r) return Object.assign(blank(), JSON.parse(r)); } catch(e){} return blank(); }
function save(opts={}){ if (!opts.remote) S.updatedAt = Date.now(); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){ console.warn('save failed', e); } if (!opts.remote) { try { Cloud.schedulePush(); } catch(e){} } }
const ftp = () => (S.profile?.ftp || 250);
const adj = () => (S.profile?.intensityAdj || 1);

/* ============ zones ============ */
function zoneOf(p){ return p < 56 ? 1 : p < 76 ? 2 : p < 91 ? 3 : p < 106 ? 4 : p < 121 ? 5 : 6; }
const ZCOL = z => `var(--z${z})`;
const ZNAME = ['','Récup','Endurance','Tempo','Seuil','VO2max','Anaérobie'];

/* ============ bibliothèque de séances ============ */
// step: {d: sec, p: %FTP, label, int, max?:bool, cad?}
const S_ = (min, p, label, int='active', extra={}) => ({ d: Math.round(min*60), p, label, int, ...extra });
const R_ = (n, steps) => ({ repeat: n, steps });
const WU = [S_(5,50,'Échauffement','warmup'), S_(5,62,'Échauffement','warmup'), S_(3,75,'Échauffement','warmup')];
const WU_ACT = [...WU, R_(3,[S_(0.5,105,'Activation'), S_(1,55,'Récup','rest')])];
const CD = (m=8) => [S_(m,50,'Retour au calme','cooldown')];

const WORKOUTS = {
  test20: { name:'Test FTP 20 min', type:'test', goal:"Mesurer ta FTP : 95 % de ta puissance moyenne sur les 20 min. Mode résistance (pas ERG) sur l'effort, pars prudemment les 5 premières minutes puis accélère.",
    steps:[...WU, R_(3,[S_(1,105,'Activation'), S_(1,55,'Récup','rest')]), S_(5,110,'5 min à fond (vider l\'anaérobie)','active',{max:true}), S_(10,52,'Récup','rest'), S_(20,102,'20 MIN À FOND, régulier','active',{max:true}), ...CD(10)] },
  ramp: { name:'Test rampe ERG', type:'test', goal:"Tout en ERG : l'Edge règle la résistance, toi tu gardes 85-95 rpm. Paliers d'1 min de +8 % (~+20 W) jusqu'à ce que la cadence s'effondre : arrête-toi là. FTP = 75 % de ta meilleure minute. Plus court et moins mental qu'un 20 min, mais il peut surestimer la FTP des profils explosifs.",
    steps:[S_(5,45,'Échauffement','warmup'), S_(3,55,'Échauffement','warmup'), ...Array.from({length:18},(_,i)=>S_(1,50+i*8,`Palier ${i+1}`,'active',{cad:90})), ...CD(8)] },
  ss_3x10: { name:'Sweet spot 3 × 10 min', type:'ss', goal:"Construire le moteur aérobie au meilleur rapport fatigue / gain (88-93 % FTP).", steps:[...WU, R_(3,[S_(10,90,'Sweet spot',null,{cad:90}), S_(5,55,'Récup','rest')]), ...CD()] },
  ss_3x12: { name:'Sweet spot 3 × 12 min', type:'ss', goal:"Allonger le temps passé sous le seuil.", steps:[...WU, R_(3,[S_(12,90,'Sweet spot',null,{cad:90}), S_(4,55,'Récup','rest')]), ...CD()] },
  ss_3x15: { name:'Sweet spot 3 × 15 min', type:'ss', goal:"Gros bloc sweet spot : endurance au seuil.", steps:[...WU, R_(3,[S_(15,91,'Sweet spot',null,{cad:90}), S_(5,55,'Récup','rest')]), ...CD(6)] },
  ss_2x20: { name:'Sweet spot 2 × 20 min', type:'ss', goal:"Le classique : 2 × 20 à 90 %, tenir sans à-coups.", steps:[...WU, R_(2,[S_(20,90,'Sweet spot',null,{cad:90}), S_(5,55,'Récup','rest')]), ...CD(7)] },
  tempo_2x20: { name:'Tempo 2 × 20 min', type:'tempo', goal:"Endurance haute, cadence variée (85-95 rpm).", steps:[S_(10,58,'Échauffement','warmup'), R_(2,[S_(20,82,'Tempo',null,{cad:88}), S_(5,55,'Récup','rest')]), ...CD(5)] },
  thr_4x8: { name:'Seuil 4 × 8 min', type:'thr', goal:"Travail au seuil (98-102 %) pour repousser la FTP.", steps:[...WU_ACT, R_(4,[S_(8,100,'Seuil',null,{cad:92}), S_(4,55,'Récup','rest')]), ...CD()] },
  thr_3x12: { name:'Seuil 3 × 12 min', type:'thr', goal:"Allonger la durée au seuil.", steps:[...WU_ACT, R_(3,[S_(12,97,'Seuil',null,{cad:92}), S_(5,55,'Récup','rest')]), ...CD(6)] },
  thr_2x20: { name:'Seuil 2 × 20 min', type:'thr', goal:"La séance reine : 2 × 20 à 95-98 %. Si tu la tiens, la FTP suit.", steps:[...WU_ACT, R_(2,[S_(20,96,'Seuil',null,{cad:92}), S_(6,55,'Récup','rest')]), ...CD(6)] },
  ou_3x9: { name:'Over-unders 3 × 9 min', type:'thr', goal:"Alterner 95 % / 105 % pour apprendre à évacuer le lactate au seuil.", steps:[...WU_ACT, R_(3,[R_(3,[S_(2,95,'Under'), S_(1,106,'Over')]), S_(5,55,'Récup','rest')]), ...CD(6)] },
  vo2_5x4: { name:'VO2max 5 × 4 min', type:'vo2', goal:"Relever le plafond aérobie (110-115 %). Dur, mais court.", steps:[...WU_ACT, R_(5,[S_(4,112,'VO2max',null,{cad:95}), S_(4,50,'Récup','rest')]), ...CD(7)] },
  vo2_6x3: { name:'VO2max 6 × 3 min', type:'vo2', goal:"Intensité VO2 plus haute (118 %), récup égale.", steps:[...WU_ACT, R_(6,[S_(3,118,'VO2max',null,{cad:98}), S_(3,50,'Récup','rest')]), ...CD(8)] },
  vo2_3030: { name:'30/30 · 3 × 10', type:'vo2', goal:"Accumuler du temps près de VO2max avec des micro-récups.", steps:[...WU, R_(3,[R_(10,[S_(0.5,130,'ON',null,{cad:100}), S_(0.5,50,'OFF','rest')]), S_(5,55,'Récup','rest')]), ...CD(5)] },
  end_60: { name:'Endurance 1 h', type:'end', goal:"Zone 2 facile (65-72 %). Peut se faire dehors à la FC.", steps:[S_(5,55,'Échauffement','warmup'), S_(50,68,'Endurance Z2',null,{cad:90}), S_(5,55,'Retour au calme','cooldown')] },
  end_90: { name:'Endurance 1 h 30', type:'end', goal:"Sortie longue Z2 (65-72 %), idéalement dehors le week-end, à la FC.", steps:[S_(10,55,'Échauffement','warmup'), S_(75,68,'Endurance Z2',null,{cad:88}), S_(5,55,'Retour au calme','cooldown')] },
  end_120: { name:'Endurance 2 h', type:'end', goal:"Sortie longue Z2, dehors si possible.", steps:[S_(10,55,'Échauffement','warmup'), S_(105,67,'Endurance Z2'), S_(5,55,'Retour au calme','cooldown')] },
  rec_45: { name:'Récup active 45 min', type:'rec', goal:"Faire tourner les jambes, très facile (< 60 %).", steps:[S_(45,55,'Récup active','rest',{cad:90})] },
  openers: { name:'Rappels (veille de test)', type:'rec', goal:"Réveiller les jambes sans fatigue avant un test ou une semaine dure.", steps:[S_(10,55,'Échauffement','warmup'), R_(3,[S_(1,110,'Rappel',null,{cad:100}), S_(2,55,'Récup','rest')]), S_(10,65,'Endurance'), S_(5,50,'Retour au calme','cooldown')] },
};
const HARD = new Set(['test','ss','thr','vo2']);
const isHard = wid => HARD.has(WORKOUTS[wid]?.type);
function flat(steps){ const out = []; for (const s of steps) { if (s.repeat) for (let i=0;i<s.repeat;i++) out.push(...flat(s.steps)); else out.push(s); } return out; }
const wDur = wid => flat(WORKOUTS[wid].steps).reduce((a,s)=>a+s.d,0);
const wTSS = wid => Math.round(flat(WORKOUTS[wid].steps).reduce((a,s)=>a + s.d*Math.pow(s.p/100,2),0)/36);
const watts = (p, f=ftp()) => round5(p/100 * f * adj());
function mainStep(wid){ // le bloc principal le plus intense et le plus long (pour mesurer le respect des cibles)

function powerSeries(recs, key='pw'){ // série 1 Hz, trous ≤ 5 s comblés

  def(0, 0, [[0,1,0x00],[1,2,0x84],[2,2,0x84],[3,4,0x8C],[4,4,0x86]]);
  u8(0); u8(5); u16(255); u16(0); u32((Math.random()*0xFFFFFFF|0)+1); u32(now);
  def(1, 26, [[8,32,0x07],[4,1,0x00],[5,4,0x8C],[6,2,0x84]]);
  u8(1); str(W.name, 32); u8(2); u32(0x20); u16(steps.length);
  def(2, 27, [[254,2,0x84],[0,16,0x07],[1,1,0x00],[2,4,0x86],[3,1,0x00],[4,4,0x86],[5,4,0x86],[6,4,0x86],[7,1,0x00]]);
  const INT = { active:0, rest:1, warmup:2, cooldown:3 };
  steps.forEach((st, i) => {
    u8(2); u16(i);
    if (st.kind === 'rep') { str('Repeter', 16); u8(6); u32(st.from); u8(2); u32(st.n); u32(0); u32(0); u8(0); return; }
    const s = st.s; const w = s.p/100 * f * adj();
    const name = s.max ? 'A FOND' : `${s.label}`;
    str(name, 16); u8(0); u32(s.d*1000);
    if (s.max) { u8(2); u32(0); u32(0); u32(0); }
    else { u8(4); u32(0); u32(Math.round(w*0.97)+1000); u32(Math.round(w*1.03)+1000); }
    u8(INT[s.int||'active'] ?? 0);
  });
  const data = Uint8Array.from(bytes);
  const hdr = [14, 0x20, ...[2132 & 0xFF, 2132 >> 8], ...[data.length & 0xFF, (data.length>>8)&0xFF, (data.length>>16)&0xFF, (data.length>>>24)&0xFF], 0x2E,0x46,0x49,0x54];
  const hcrc = fitCrc(hdr); hdr.push(hcrc & 0xFF, hcrc >> 8);
  const all = new Uint8Array(hdr.length + data.length + 2);
  all.set(hdr, 0); all.set(data, hdr.length);
  const crc = fitCrc(all.subarray(0, hdr.length + data.length));
  all[all.length-2] = crc & 0xFF; all[all.length-1] = crc >> 8;
  return all;
}

}

/* ============ coach ============ */
function coachNotes(){
  const notes = [];
  const p = S.profile; if (!p) return notes;
  const done = S.plan.filter(s => s.status==='done');
  const doneCount = countDone();
  const t = todayISO();
  const daysLeft = Math.max(diffDays(t, p.endDate), 0), weeksLeft = daysLeft/7;
  const need = Math.max(p.minSessions - doneCount, 0);
  if (need > 0 && weeksLeft > 0) {
    const rate = need / weeksLeft;
    if (rate > 3) notes.push({ cls:'bad', t:`Il reste ${need} séances en ${Math.round(weeksLeft)} semaines (${rate.toFixed(1)}/sem.) : l'objectif des ${p.minSessions} devient difficile.` });
    else if (rate > 2.2) notes.push({ cls:'', t:`Rythme à tenir : ${rate.toFixed(1)} séances/semaine pour atteindre ${p.minSessions}.` });
  } else if (need === 0) notes.push({ cls:'ok', t:`Objectif des ${p.minSessions} séances atteint. Tout ce qui suit, c'est du bonus.` });
  // ressentis séances clés
  const keyActs = S.activities.filter(a => a.planId && ['key','test'].includes(S.plan.find(s=>s.id===a.planId)?.kind) && a.feel?.rpe).sort((a,b)=>a.date.localeCompare(b.date)).slice(-2);
  if (keyActs.length === 2) {
    const hard = keyActs.every(a => a.feel.rpe >= 9 || (a.compliance && a.compliance.ratio < 0.95));
    const easy = keyActs.every(a => a.feel.rpe <= 6 && (!a.compliance || a.compliance.ratio >= 1));
    if (hard) notes.push({ cls:'bad', t:`Tes deux dernières séances clés étaient très dures (RPE ≥ 9 ou cibles non tenues). Je te propose de baisser les cibles de 3 %.`, action:{ label:'Baisser de 3 %', f:()=>{ p.intensityAdj = +(adj()*0.97).toFixed(3); } } });
    else if (easy) notes.push({ cls:'ok', t:`Deux séances clés tenues facilement (RPE ≤ 6). Tu peux monter les cibles de 2 %.`, action:{ label:'Monter de 2 %', f:()=>{ p.intensityAdj = +(adj()*1.02).toFixed(3); } } });
  }
  if (adj() !== 1) notes.push({ cls:'', t:`Ajustement des cibles en cours : ${adj()>1?'+':''}${Math.round((adj()-1)*1000)/10} %.`, action:{ label:'Remettre à 0', f:()=>{ p.intensityAdj = 1; } } });
  const load = loadSeries(); const lastL = load[load.length-1];
  if (lastL && lastL.tsb < -25) notes.push({ cls:'bad', t:`Fatigue élevée (forme ${Math.round(lastL.tsb)}). Privilégie le sommeil et passe la prochaine séance en endurance si les jambes ne répondent pas.` });
  // séance manquée récente
  const missed = S.plan.filter(s => s.status==='planned' && s.date < t && diffDays(s.date, t) <= 3 && mandatory(s));
  if (missed.length) notes.push({ cls:'', t:`Séance non enregistrée : ${WORKOUTS[missed[0].workoutId].name} (${fmtDate(missed[0].date)}). Saisis-la, décale-la ou passe-la.`, plan: missed[0].id });
  return notes;
}
function countDone(){ return S.plan.filter(s => s.status==='done').length + S.activities.filter(a => !a.planId && a.countAsSession).length; }

/* ============ charge CTL / ATL ============ */
function loadSeries(){
  const hw = Health.extraWorkouts();
  if (!S.activities.length && !hw.length) return [];
  const byDay = {}; for (const a of S.activities) byDay[a.date] = (byDay[a.date]||0) + (a.tss||0);
  for (const w of hw) byDay[w.date] = (byDay[w.date]||0) + w.tss;
  const first = [...S.activities.map(a=>a.date), ...hw.map(w=>w.date)].sort()[0]; const start = addDays(first < S.profile.startDate ? first : S.profile.startDate, -1);
  const end = todayISO(); const out = []; let ctl = S.profile.ctl0 || 0, atl = ctl;
  for (let d = start; d <= end; d = addDays(d,1)) { const t = byDay[d]||0; const tsb = ctl - atl; ctl += (t-ctl)/42; atl += (t-atl)/7; out.push({ d, ctl, atl, tsb, tss:t }); }
  return out;
}

/* ============ graphiques SVG ============ */
function lineChart({ series, xMin, xMax, yMin, yMax, w=680, h=220, xLabels=[], yTicks=5, unit='' }){
  const L=34, R=10, T=10, B=22; const iw = w-L-R, ih = h-T-B;
  const X = x => L + (x - xMin)/(xMax - xMin || 1) * iw, Y = y => T + ih - (y - yMin)/(yMax - yMin || 1) * ih;
  let g = '';
  for (let i=0;i<=yTicks;i++){ const v = yMin + (yMax-yMin)*i/yTicks; const y = Y(v); g += `<line x1="${L}" x2="${w-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+3}" text-anchor="end">${Math.round(v)}${unit}</text>`; }
  for (const [x, lab] of xLabels) g += `<text x="${X(x)}" y="${h-6}" text-anchor="middle">${lab}</text>`;
  for (const s of series) {
    if (s.type === 'area') { const pts = s.pts.map(([x,y])=>`${X(x)},${Y(y)}`).join(' '); g += `<polygon points="${X(s.pts[0][0])},${Y(yMin)} ${pts} ${X(s.pts[s.pts.length-1][0])},${Y(yMin)}" fill="${s.color}" opacity="${s.opacity||.15}"/>`; }
    else if (s.type === 'dots') for (const [x,y,lab] of s.pts) g += `<circle cx="${X(x)}" cy="${Y(y)}" r="${s.r||4.5}" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>${lab?`<text x="${X(x)}" y="${Y(y)-9}" text-anchor="middle" style="fill:var(--text);font-weight:600">${lab}</text>`:''}`;
    else if (s.pts.length) g += `<polyline points="${s.pts.map(([x,y])=>`${X(x)},${Y(y)}`).join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}" ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${g}</svg>`;
}
function profileBars(wid){
  const st = flat(WORKOUTS[wid].steps); const tot = st.reduce((a,s)=>a+s.d,0); const mx = Math.max(130, ...st.map(s=>s.p));
  return `<div class="prof">${st.map(s=>`<div title="${esc(s.label)} · ${fmtDur(s.d)} · ${s.p}%" style="flex:${s.d/tot};height:${Math.max(6, s.p/mx*100)}%;background:${ZCOL(zoneOf(s.p))};${s.max?'background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(255,255,255,.35) 4px 7px)':''}"></div>`).join('')}</div>`;
}
function stepsTable(wid){
  const rows = [];
  const walk = (steps, prefix='') => { for (const s of steps) {
    if (s.repeat) { rows.push(`<tr><td colspan="3"><b>${s.repeat} ×</b></td></tr>`); walk(s.steps, '&nbsp;&nbsp;&nbsp;'); }
    else rows.push(`<tr><td>${prefix}<span class="zone" style="background:${ZCOL(zoneOf(s.p))}"></span>${esc(s.max ? s.label : s.label)}${s.cad?` <span class="muted tiny">· ${s.cad} rpm</span>`:''}</td><td class="r num">${fmtDur(s.d)}</td><td class="r num">${s.max ? '<b>max</b>' : `${watts(s.p)} W <span class="muted tiny">${s.p}%</span>`}</td></tr>`);
  }};
  walk(WORKOUTS[wid].steps);
  return `<table class="steps">${rows.join('')}</table>`;
}

function projection(){
  const p = S.profile; const H = S.ftpHistory.filter(h => h.source === 'test');
  if (!H.length) return null;
  const last = H[H.length-1];
  const all = S.ftpHistory;
  let rate; // W par semaine
  if (H.length >= 2) { const first = H[0]; const w = diffDays(first.date, last.date)/7; rate = w > 0 ? (last.ftp - first.ftp)/w : 0; }
  else rate = 1.5; // hypothèse prudente : +1,5 W/semaine avec 2-3 séances structurées
  rate = clamp(rate, 0, 3);
  const weeks = Math.max(diffDays(last.date, p.goalDate)/7, 0);
  const value = Math.round(last.ftp + rate*weeks);
  const gap = p.goalFtp - value;
  const text = H.length >= 2
    ? `Au rythme mesuré entre tes tests (${rate.toFixed(1)} W/semaine), tu serais vers ${value} W le ${fmtShort(p.goalDate)}${gap>0?` (${gap} W sous l'objectif)`:' : objectif en vue'}.`
    : `Hypothèse prudente de +1,5 W/semaine : ~${value} W le ${fmtShort(p.goalDate)}. Il te faudrait ${((p.goalFtp-last.ftp)/Math.max(weeks,1)).toFixed(1)} W/semaine pour ${p.goalFtp} W. Le prochain test affinera.`;
  return { value, text, from: last.ftp, fromDate: last.date };
}

const dayFree = (date, exceptIds, absFrom, absTo) => !(date >= absFrom && date <= absTo) && !S.plan.some(x => x.date === date && x.status !== 'skipped' && !exceptIds.has(x.id) && mandatory(x));
function hardOk(s, date, moved){
  if (!isHard(s.workoutId)) return true;
  return !S.plan.some(x => x.id !== s.id && x.status !== 'skipped' && isHard(moved.get(x.id)?.workoutId || x.workoutId) && Math.abs(diffDays(moved.get(x.id)?.date || x.date, date)) < 2 && !(moved.get(x.id)?.skip));
}
// propose une nouvelle date pour chaque séance tombant pendant l'absence
function planAbsence(from, to){
  const p = S.profile, t = todayISO();
  const hit = S.plan.filter(s => s.status === 'planned' && s.date >= from && s.date <= to).sort((a,b) => (mandatory(b)-mandatory(a)) || a.date.localeCompare(b.date));
  const moved = new Map(); // id -> {date, skip}
  const taken = new Set();
  for (const s of hit) {
    if (!mandatory(s)) { moved.set(s.id, { date: s.date, skip: true, reason: 'optionnelle' }); continue; }
    const cands = [];
    for (let k = -4; k <= 9; k++) {
      const d = k < 0 ? addDays(from, k) : addDays(to, k + 1);
      if (d <= t || d > p.endDate) continue; // à partir de demain
      if (taken.has(d)) continue;
      const avail = p.days[dowMon(d)]?.avail;
      if (!dayFree(d, new Set([s.id]), from, to)) continue;
      if (!hardOk(s, d, moved)) continue;
      // éviter d'empiler le test juste avant/après une séance clé
      const dist = k < 0 ? -k : k + 1;
      const score = (avail ? 0 : 6) + dist + (k < 0 ? 0.5 : 0) + (WORKOUTS[s.workoutId].type === 'test' && k < 0 && dist === 1 ? 2 : 0);
      cands.push({ d, score });
    }
    cands.sort((a,b) => a.score - b.score);
    if (cands.length) { moved.set(s.id, { date: cands[0].d, skip: false }); taken.add(cands[0].d); }
    else moved.set(s.id, { date: s.date, skip: true, reason: 'pas de créneau' });
  }
  // un test doit précéder les séances clés suivantes (leurs watts en dépendent) : on échange
  for (const [id, m] of [...moved]) {
    const s = S.plan.find(x => x.id === id);
    if (m.skip || WORKOUTS[s.workoutId].type !== 'test') continue;
    const before = S.plan.filter(x => x.status === 'planned' && !moved.has(x.id) && mandatory(x) && WORKOUTS[x.workoutId].type !== 'test' && x.date > to && x.date < m.date).sort((a,b)=>a.date.localeCompare(b.date))[0];
    if (before) { const d = m.date; moved.set(id, { date: before.date, skip: false }); moved.set(before.id, { date: d, skip: false, reason: 'échangée avec le test pour qu’il passe en premier' }); }
  }
  // les séances optionnelles qui gênent un créneau choisi sont sautées
  const bump = [];
  for (const [id, m] of moved) if (!m.skip) for (const x of S.plan) if (x.date === m.date && x.status === 'planned' && !mandatory(x) && !moved.has(x.id)) bump.push(x);
  for (const x of bump) moved.set(x.id, { date: x.date, skip: true, reason: 'remplacée par une séance déplacée' });
  return { hit: [...moved.keys()].map(id => S.plan.find(s => s.id === id)), moved };
}

    if (!from || !to || to < from) { $('#abPrev').innerHTML = '<p class="small" style="color:var(--bad)">Vérifie les dates.</p>'; return; }
    const { hit, moved } = planAbsence(from, to);
    if (!hit.length) { $('#abPrev').innerHTML = `<div class="note ok">Aucune séance prévue sur ces dates : rien à déplacer.</div><div class="row"><button class="btn primary" id="abOk">Enregistrer l'absence</button></div>`; $('#abOk').onclick = () => applyAbsence(from, to, new Map()); return; }
    $('#abPrev').innerHTML = `<h3>${hit.length} séance${hit.length>1?'s':''} concernée${hit.length>1?'s':''}</h3>` + hit.sort((a,b)=>a.date.localeCompare(b.date)).map(s => {
      const m = moved.get(s.id);
      return `<div class="hist" style="flex-wrap:wrap"><div style="flex:1;min-width:160px"><b>${esc(WORKOUTS[s.workoutId].name)}</b><div class="tiny muted">prévue ${fmtDate(s.date)}${mandatory(s)?'':' · optionnelle'}</div></div>
        <div class="row" style="gap:6px"><select data-abmode="${s.id}" style="width:auto;min-height:36px;padding:4px 8px"><option value="move" ${m.skip?'':'selected'}>Déplacer au</option><option value="skip" ${m.skip?'selected':''}>Sauter</option></select>
        <input type="date" data-abdate="${s.id}" value="${m.date}" style="width:auto;min-height:36px;padding:4px 8px" ${m.skip?'disabled':''}></div>
        ${m.reason ? `<div class="tiny muted" style="width:100%">${esc(m.reason)}</div>` : ''}<div class="tiny" data-abwarn="${s.id}" style="width:100%;color:var(--warn)"></div></div>`;
    }).join('') + `<div class="row" style="margin-top:12px"><button class="btn primary" id="abOk">Appliquer</button></div>`;
    const check = () => {
      const tmp = new Map(); dlgBody.querySelectorAll('[data-abmode]').forEach(sel => { const id = sel.dataset.abmode; tmp.set(id, { skip: sel.value==='skip', date: dlgBody.querySelector(`[data-abdate="${id}"]`).value }); });
      for (const [id, m] of tmp) { const s = S.plan.find(x=>x.id===id); const w = dlgBody.querySelector(`[data-abwarn="${id}"]`); dlgBody.querySelector(`[data-abdate="${id}"]`).disabled = m.skip;
        w.textContent = m.skip ? '' : (m.date >= from && m.date <= to) ? '⚠️ toujours pendant ton absence' : tentativeConflict(s, m.date, tmp); }
      return tmp;
    };
    dlgBody.querySelectorAll('[data-abmode],[data-abdate]').forEach(el => el.onchange = check); check();
    $('#abOk').onclick = () => applyAbsence(from, to, check());
  };
  $('#abFrom').onchange = prev; $('#abTo').onchange = prev; prev();
}
function tentativeConflict(s, date, tmp){ // comme hardConflict, mais avec les déplacements proposés
  if (!isHard(s.workoutId)) return '';
  const near = S.plan.find(x => { if (x.id === s.id) return false; const m = tmp.get(x.id); if (m?.skip || (!m && x.status === 'skipped')) return false;
    return isHard(x.workoutId) && Math.abs(diffDays(m ? m.date : x.date, date)) < 2; });
  return near ? `⚠️ ${WORKOUTS[near.workoutId].name} à moins de 48 h` : '';
}
function applyAbsence(from, to, choices){
  const p = S.profile; p.absences ||= [];
  const rec = { id: uid(), from, to, label: $('#abLabel')?.value.trim() || '', moves: [] };
  for (const [id, m] of choices) {
    const s = S.plan.find(x => x.id === id); if (!s) continue;
    rec.moves.push({ id, date: s.date, status: s.status, week: s.week });
    if (m.skip) s.status = 'skipped';
    else { s.date = m.date; s.week = Math.floor(diffDays(monday(p.startDate), m.date)/7); }
  }
  // jours indisponibles mémorisés pour les prochaines régénérations
  p.absences.push(rec);
  S.plan.sort((a,b)=>a.date.localeCompare(b.date));
  save(); closeDlg(); render();
  const mv = rec.moves.length; toast(mv ? `Absence enregistrée · ${mv} séance${mv>1?'s':''} reprogrammée${mv>1?'s':''}` : 'Absence enregistrée');
}
function undoAbsence(id){
  const p = S.profile; const a = (p.absences||[]).find(x => x.id === id); if (!a) return;
  for (const m of a.moves) { const s = S.plan.find(x => x.id === m.id); if (s && s.status !== 'done') { s.date = m.date; s.status = m.status; s.week = m.week; } }
  p.absences = p.absences.filter(x => x.id !== id);
  S.plan.sort((x,y)=>x.date.localeCompare(y.date)); save(); render(); toast('Absence annulée, séances remises à leur place');
}

/* ============ cloud : Supabase (compte, synchro) + Strava ============ */
const Cloud = (() => {
  const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, detectSessionInUrl: true, flowType: 'pkce' } }) : null;
  let session = null, pushTimer = null, strava = { connected: false }, busy = false;
  const appUrl = () => location.origin + location.pathname;
  const user = () => session?.user || null;

  async function init(){
    if (!sb) return;
    const { data } = await sb.auth.getSession(); session = data.session;
    sb.auth.onAuthStateChange((ev, s) => { const was = !!session; session = s; if (s && !was) afterLogin(); if (!s && was) { strava = { connected:false }; render(); } });
    await handleStravaReturn();
    if (session) await afterLogin();
  }
  async function afterLogin(){
    await pull();
    await refreshStrava();
    await importInbox();
    await Health.load(sb);
    render();
  }
  async function pull(){
    const { data, error } = await sb.from('user_state').select('data, updated_at').maybeSingle();
    if (error) { console.warn(error); return; }
    const remote = data?.data;
    if (!remote) { if (S.profile) await push(); return; }
    const rT = remote.updatedAt || Date.parse(data.updated_at) || 0, lT = S.updatedAt || 0;
    if (!S.profile || rT > lT) { S = Object.assign(blank(), remote); save({ remote:true }); toast('Données récupérées depuis ton compte'); }
    else if (lT > rT) await push();
  }
  async function push(){
    if (!sb || !user() || !S.profile) return;
    const { error } = await sb.from('user_state').upsert({ user_id: user().id, data: S, updated_at: new Date().toISOString() });
    if (error) console.warn('push', error);
  }
  function schedulePush(){ if (!user()) return; clearTimeout(pushTimer); pushTimer = setTimeout(push, 1500); }

  /* ----- Strava ----- */
  async function refreshStrava(){
    if (!user()) return;
    const { data } = await sb.rpc('strava_status');
    strava = data && data.length ? { connected: true, athlete: data[0].athlete_id } : { connected: false };
  }
  function connectStrava(){
    if (!STRAVA_CLIENT_ID) return toast("Strava n'est pas encore configuré (Client ID manquant)");
    if (!user()) return toast('Connecte-toi d’abord à ton compte FTP Builder');
    const u = new URL('https://www.strava.com/oauth/authorize');
    u.search = new URLSearchParams({ client_id: STRAVA_CLIENT_ID, redirect_uri: appUrl(), response_type:'code', approval_prompt:'auto', scope:'read,activity:read_all', state:'strava' });
    location.href = u.toString();
  }
  async function handleStravaReturn(){
    const q = new URLSearchParams(location.search);
    if (q.get('state') !== 'strava') return;
    history.replaceState(null, '', appUrl());
    if (q.get('error')) return toast('Connexion Strava annulée');
    if (!session) return toast('Connecte-toi puis relance la connexion Strava');
    const { data, error } = await sb.functions.invoke('strava', { body: { action:'exchange', code: q.get('code'), scope: q.get('scope') } });
    if (error || data?.error) return toast('Strava : ' + (data?.error || error.message));
    toast(`Strava connecté${data.athlete?.firstname ? ' : ' + data.athlete.firstname : ''} 🚴`);
    await syncStrava(30);
  }
  async function syncStrava(days=14){
    if (busy) return; busy = true;
    try {
      const { data, error } = await sb.functions.invoke('strava', { body: { action:'sync', days } });
      if (error || data?.error) throw new Error(data?.error || error.message);
      const n = await importInbox();
      toast(n ? `${n} sortie${n>1?'s':''} importée${n>1?'s':''} depuis Strava` : 'Rien de nouveau sur Strava');
    } catch(e){ toast('Strava : ' + e.message); } finally { busy = false; render(); }
  }
  async function disconnectStrava(){
    await sb.functions.invoke('strava', { body: { action:'disconnect' } }); strava = { connected:false }; render(); toast('Strava déconnecté');
  }
  // convertit les activités reçues (webhook ou synchro) en séances de l'app
  async function importInbox(){
    if (!user() || !S.profile) return 0;
    const { data, error } = await sb.from('strava_inbox').select('id, strava_id, activity, streams').eq('imported', false).order('received_at');
    if (error || !data?.length) return 0;
    let n = 0;
    for (const row of data) {
      const a0 = row.activity, st = row.streams || {};
      if (S.activities.some(x => x.stravaId === row.strava_id)) { await sb.from('strava_inbox').update({ imported:true }).eq('id', row.id); continue; }
      const start = Math.floor(Date.parse(a0.start_date)/1000);
      const time = st.time || [];
      const records = time.map((t, i) => ({ t: start + t, pw: st.watts?.[i] ?? null, hr: st.heartrate?.[i] ?? null, cad: st.cadence?.[i] ?? null }));
      const fit = { records, laps:[], user:{}, zones:{}, workout:{ name: a0.name }, noPower: !a0.device_watts,
        sessions:[{ start, timer: a0.moving_time, distKm: a0.distance/1000, subSport: a0.trainer ? 6 : 0, avgHr: a0.average_heartrate ? Math.round(a0.average_heartrate) : null, maxHr: a0.max_heartrate || null }] };
      const a = activityFromFit(fit, a0.name);
      a.source = 'strava'; a.stravaId = row.strava_id; a.startTs = start;
      if (!a.durationS) a.durationS = a0.moving_time;
      // doublon avec un .fit déjà importé (même départ à 2 min près)
      if (S.activities.some(x => x.startTs && Math.abs(x.startTs - start) < 120)) { await sb.from('strava_inbox').update({ imported:true }).eq('id', row.id); continue; }
      const pl = S.plan.find(s => s.date === a.date && s.status === 'planned');
      if (pl) { a.planId = pl.id; pl.status = 'done'; pl.activityId = a.id; a.compliance = compliance(Object.assign(a, { _pw: powerSeries(records, 'pw') }), pl); }
      else a.countAsSession = a.durationS >= 1800;
      delete a._pw;
      computeLoad(a); S.activities.push(a); n++;
      await sb.from('strava_inbox').update({ imported:true }).eq('id', row.id);
    }
    if (n) save();
    return n;
  }

  /* ----- interface compte ----- */
  function accountHTML(){
    if (!sb) return `<div class="card"><h2>Compte</h2><p class="muted small">Hors ligne : la synchronisation reviendra avec la connexion.</p></div>`;
    if (!user()) return `<div class="card"><h2>Compte</h2><p class="muted small" style="margin-top:0">Connecte-toi pour sauvegarder tes séances dans le cloud, les retrouver sur tous tes appareils et activer Strava.</p><button class="btn primary" data-auth="open">Se connecter / créer un compte</button></div>`;
    return `<div class="card"><div class="row between"><h2>Compte</h2><button class="btn sm ghost" data-auth="logout">Se déconnecter</button></div>
      <p class="small muted" style="margin:0 0 12px">Connecté : <b style="color:var(--text)">${esc(user().email || '')}</b> · synchro automatique</p>
      <h3>Strava</h3>
      ${strava.connected
        ? `<p class="small muted" style="margin:0 0 8px">Connecté (athlète ${esc(strava.athlete)}). Chaque nouvelle sortie vélo arrive toute seule ; ouvre l'app pour l'intégrer.</p><div class="row"><button class="btn" data-strava="sync">Synchroniser maintenant</button><button class="btn sm ghost" data-strava="off">Déconnecter Strava</button></div>`
        : `<p class="small muted" style="margin:0 0 8px">Récupère automatiquement tes sorties (puissance, FC, cadence) dès qu'elles arrivent sur Strava.</p><button class="btn" data-strava="on" style="background:#fc4c02;border-color:#fc4c02;color:#fff">Connecter Strava</button>`}
    </div>`;
  }
  function authDlg(){
    openDlg(`<h2>Mon compte</h2><p class="muted small">Tes séances sont sauvegardées et synchronisées entre tes appareils.</p>
      <button class="btn" id="gBtn" style="width:100%;margin-top:6px">Continuer avec Google</button>
      <div class="tiny muted" style="text-align:center;margin:12px 0">ou par email</div>
      <label class="f" for="aEmail">Email</label><input type="text" id="aEmail" inputmode="email" autocomplete="email">
      <label class="f" for="aPass">Mot de passe (8 caractères min.)</label><input type="password" id="aPass" autocomplete="current-password" style="width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px">
      <div class="row" style="margin-top:12px"><button class="btn primary" id="aIn">Se connecter</button><button class="btn" id="aUp">Créer un compte</button></div>
      <div id="aMsg" class="small" style="margin-top:10px"></div>`);
    const msg = t => $('#aMsg').textContent = t;
    $('#gBtn').onclick = () => sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: appUrl() } });
    $('#aIn').onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: $('#aEmail').value.trim(), password: $('#aPass').value }); if (error) msg(error.message === 'Invalid login credentials' ? 'Email ou mot de passe incorrect.' : error.message); else { closeDlg(); toast('Connecté'); } };
    $('#aUp').onclick = async () => { const { data, error } = await sb.auth.signUp({ email: $('#aEmail').value.trim(), password: $('#aPass').value, options:{ emailRedirectTo: appUrl() } }); if (error) msg(error.message); else if (!data.session) msg('Compte créé : clique sur le lien reçu par email pour l’activer.'); else { closeDlg(); toast('Compte créé'); } };
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-auth],[data-strava],[data-feelact]'); if (!a) return;
    if (a.dataset.auth === 'open') authDlg();
    else if (a.dataset.auth === 'logout') sb.auth.signOut();
    else if (a.dataset.strava === 'on') connectStrava();
    else if (a.dataset.strava === 'sync') syncStrava(30);
    else if (a.dataset.strava === 'off') disconnectStrava();
    else if (a.dataset.feelact) feelDlg(a.dataset.feelact);
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && user()) importInbox().then(n => { if (n) { render(); toast(`${n} sortie${n>1?'s':''} Strava importée${n>1?'s':''}`); } }); });
  return { init, schedulePush, accountHTML, importInbox, get user(){ return user(); }, get sb(){ return sb; } };
})();

/* ============ Apple Santé (via le Raccourci iOS) ============ */
const Health = (() => {
  const LS = 'ftpb_health_v1';
  let H = { daily: [], sleep: [], workouts: [], token: null, loadedAt: 0 };
  try { const r = localStorage.getItem(LS); if (r) H = Object.assign(H, JSON.parse(r)); } catch(e){}
  const persist = () => { try { localStorage.setItem(LS, JSON.stringify({ daily:H.daily, sleep:H.sleep, workouts:H.workouts, token:H.token })); } catch(e){} };
  const INGEST_URL = SB_URL + '/functions/v1/health-ingest';

  async function load(sb){
    if (!sb) return;
    const since = addDays(todayISO(), -75);
    const [d, s, w, t] = await Promise.all([
      sb.from('health_daily').select('day, metric, value').gte('day', since).order('day'),
      sb.from('health_sleep').select('night, source, asleep_min, deep_min, rem_min, core_min, awake_min, in_bed_min, bed_start, bed_end').gte('night', since).order('night'),
      sb.from('health_workouts').select('start_at, end_at, type, duration_min, distance_km, energy_kcal, avg_hr, source').gte('start_at', since).order('start_at'),
      sb.rpc('ingest_status'),
    ]);
    if (!d.error) H.daily = d.data; if (!s.error) H.sleep = s.data; if (!w.error) H.workouts = w.data;
    H.token = t.data && t.data.length ? { last: t.data[0].last_used_at } : null;
    persist();
  }
  // séries utilitaires
  const series = m => H.daily.filter(x => x.metric === m).map(x => [x.day, x.value]);
  const valOn = (m, day) => H.daily.find(x => x.metric === m && x.day === day)?.value ?? null;
  const latest = m => { const s = series(m); return s.length ? s[s.length-1] : null; };
  function baseline(m, upto, days=30){
    const vals = H.daily.filter(x => x.metric === m && x.day < upto && x.day >= addDays(upto, -days)).map(x => x.value);
    if (vals.length < 4) return null; return vals.reduce((a,b)=>a+b,0)/vals.length;
  }
  const sleepOn = day => H.sleep.find(s => s.night === day) || null;

  // sport -> catégorie + TSS estimé
  function sportOf(type){
    const t = (type||'').toLowerCase();
    if (/vélo|velo|cycl|bike|ride|vtt/.test(t)) return 'bike';
    if (/course|run|trail|jogging/.test(t)) return 'run';
    if (/nata|swim|piscine|eau libre/.test(t)) return 'swim';
    if (/renfo|force|muscu|strength|fonctionnel|hiit|core|training/.test(t)) return 'strength';
    if (/marche|walk|randonn|hiking/.test(t)) return 'walk';
    if (/yoga|pilates|étirement|mobilit|stretch/.test(t)) return 'mobility';
    return 'other';
  }
  const IF_GUESS = { run:0.78, swim:0.72, strength:0.6, walk:0.45, mobility:0.4, bike:0.7, other:0.65 };
  const ICON = { run:'🏃', swim:'🏊', strength:'🏋️', walk:'🚶', mobility:'🧘', bike:'🚴', other:'⏱️' };
  const LABEL = { run:'Course', swim:'Natation', strength:'Renfo', walk:'Marche', mobility:'Mobilité', bike:'Vélo', other:'Autre' };
  function wTss(w){
    const min = w.duration_min || (w.end_at ? (Date.parse(w.end_at)-Date.parse(w.start_at))/60000 : 0);
    const sp = sportOf(w.type);
    const hrMax = S.profile?.hrMax;
    if (w.avg_hr && hrMax && sp !== 'swim') return Math.round(min/60 * Math.pow(w.avg_hr/(0.9*hrMax), 2) * 100);
    return Math.round(min/60 * Math.pow(IF_GUESS[sp], 2) * 100);
  }
  // séances Santé à ajouter à la charge (sauf vélos déjà importés dans l'app)
  function extraWorkouts(){
    return H.workouts.map(w => {
      const start = Math.floor(Date.parse(w.start_at)/1000), date = iso(new Date(w.start_at));
      const sp = sportOf(w.type);
      if (sp === 'bike' && S.activities.some(a => (a.startTs && Math.abs(a.startTs - start) < 1800) || (!a.startTs && a.date === date))) return null;
      return { date, sport: sp, tss: wTss(w), w };
    }).filter(Boolean);
  }

  // indicateur de forme du jour
  function readiness(day = todayISO()){
    const out = { items: [], bad: 0, warn: 0 };
    const hrv = valOn('hrv', day) ?? valOn('hrv', addDays(day,-1)), hrvB = baseline('hrv', day);
    if (hrv != null) { const r = hrvB ? hrv/hrvB : null; const st = r == null ? '' : r >= 0.95 ? 'ok' : r >= 0.85 ? 'warn' : 'bad';
      out.items.push({ l:'VFC', v:`${Math.round(hrv)} ms`, sub: hrvB ? `moy. 30 j ${Math.round(hrvB)}` : 'référence en construction', st }); }
    const rhr = valOn('rhr', day) ?? valOn('rhr', addDays(day,-1)), rhrB = baseline('rhr', day);
    if (rhr != null) { const d = rhrB ? rhr - rhrB : null; const st = d == null ? '' : d <= 2 ? 'ok' : d <= 5 ? 'warn' : 'bad';
      out.items.push({ l:'FC repos', v:`${Math.round(rhr)} bpm`, sub: rhrB ? `${d>=0?'+':''}${d.toFixed(0)} vs moy.` : 'référence en construction', st }); }
    const sl = sleepOn(day);
    if (sl && sl.asleep_min) { const hh = sl.asleep_min/60; const st = hh >= 7 ? 'ok' : hh >= 6 ? 'warn' : 'bad';
      out.items.push({ l:'Sommeil', v:`${Math.floor(hh)}h${pad(Math.round(sl.asleep_min%60))}`, sub: sl.deep_min||sl.rem_min ? `profond ${fmtDur((sl.deep_min||0)*60)} · paradoxal ${fmtDur((sl.rem_min||0)*60)}` : esc(sl.source||''), st }); }
    const wt = latest('weight');
    if (wt) out.items.push({ l:'Poids', v:`${wt[1].toFixed(1)} kg`, sub: wt[0] === day ? "aujourd'hui" : fmtShort(wt[0]), st:'' });
    for (const i of out.items) { if (i.st === 'bad') out.bad++; if (i.st === 'warn') out.warn++; }
    out.level = !out.items.some(i=>i.st) ? 'none' : out.bad >= 2 ? 'bad' : (out.bad === 1 || out.warn >= 2) ? 'warn' : 'ok';
    return out;
  }
  function todayCard(){
    if (!H.daily.length && !H.sleep.length) return '';
    const r = readiness();
    if (!r.items.length) return '';
    const msg = { ok:"Feu vert : tu es récupéré, fais la séance comme prévue.", warn:"Récupération moyenne : garde la séance, mais baisse les cibles de 3 à 5 % si les jambes ne répondent pas à l'échauffement.", bad:"Récupération faible : remplace la séance clé par de l'endurance ou décale-la de 24 h.", none:"Encore quelques jours de données et je pourrai comparer à tes valeurs habituelles." }[r.level];
    const col = { ok:'var(--ok)', warn:'var(--warn)', bad:'var(--bad)', '':'var(--muted)' };
    const p = S.profile; const wt = latest('weight');
    const wNote = wt && p && Math.abs(wt[1] - p.weightKg) >= 0.5 ? `<div class="row" style="margin-top:10px"><span class="small muted">Ton poids Santé (${wt[1].toFixed(1)} kg) diffère de ton profil (${p.weightKg} kg).</span><button class="btn sm" data-hweight="${wt[1].toFixed(1)}">Mettre à jour</button></div>` : '';
    return `<div class="card"><div class="row between"><h2>Forme du jour</h2><span class="chip" style="color:${col[r.level==='none'?'':r.level]}">● ${ {ok:'Récupéré',warn:'Moyen',bad:'Fatigué',none:'Apple Santé'}[r.level] }</span></div>
      <div class="grid4">${r.items.map(i=>`<div class="kpi"><div class="v num" style="font-size:24px;color:${i.st?col[i.st]:'var(--text)'}">${i.v}</div><div class="l">${i.l}</div><div class="tiny muted" style="margin-top:2px">${i.sub}</div></div>`).join('')}</div>
      <p class="small" style="margin:10px 0 0">${msg}</p>${wNote}</div>`;
  }
  function progressCards(){
    if (!H.daily.length && !H.sleep.length && !H.workouts.length) return '';
    let h = '';
    const t = todayISO(), from = addDays(t, -42);
    const hrv = series('hrv').filter(x => x[0] >= from), rhr = series('rhr').filter(x => x[0] >= from);
    if (hrv.length >= 3 || rhr.length >= 3) {
      const X = d => parseD(d).getTime(); const all = [...hrv.map(x=>x[1]), ...rhr.map(x=>x[1])];
      const xl = []; for (let i=0;i<=3;i++){ const d = addDays(from, Math.round(42*i/3)); xl.push([X(d), fmtShort(d)]); }
      h += `<div class="card"><h2>Récupération (6 sem.)</h2>${lineChart({ series:[ { pts: hrv.map(x=>[X(x[0]),x[1]]), color:'var(--z3)', width:2 }, { type:'dots', pts: hrv.slice(-1).map(x=>[X(x[0]),x[1],Math.round(x[1])+' ms']), color:'var(--z3)' }, { pts: rhr.map(x=>[X(x[0]),x[1]]), color:'var(--bad)', width:1.5 } ], xMin:X(from), xMax:X(t), yMin: Math.floor(Math.min(...all, 40)/10)*10, yMax: Math.ceil(Math.max(...all)/10)*10+10, xLabels:xl, h:170 })}
        <div class="legend"><span><i style="background:var(--z3)"></i>VFC (ms)</span><span><i style="background:var(--bad)"></i>FC repos (bpm)</span></div>`;
      const nights = H.sleep.filter(s => s.night >= addDays(t,-14));
      if (nights.length) h += `<div style="display:flex;align-items:flex-end;gap:4px;height:70px;margin-top:14px">${nights.map(s=>`<div title="${fmtShort(s.night)} · ${fmtDur(s.asleep_min*60)}" style="flex:1;max-width:24px;height:${clamp(s.asleep_min/600*100,5,100)}%;border-radius:4px 4px 0 0;background:${s.asleep_min>=420?'var(--z2)':s.asleep_min>=360?'var(--warn)':'var(--bad)'}"></div>`).join('')}</div><div class="tiny muted" style="margin-top:4px">Sommeil des 14 dernières nuits · moyenne ${fmtDur(nights.reduce((a,s)=>a+s.asleep_min,0)/nights.length*60)}</div>`;
      h += `</div>`;
    }
    const ex = extraWorkouts().slice(-12).reverse();
    if (ex.length) {
      const week = ex.filter(e => e.date >= addDays(t,-6));
      const bySport = {}; for (const e of week) bySport[e.sport] = (bySport[e.sport]||0) + (e.w.duration_min||0);
      h += `<div class="card"><h2>Autres sports</h2>${Object.keys(bySport).length?`<div class="row" style="margin-bottom:8px">${Object.entries(bySport).map(([s,m])=>`<span class="chip">${ICON[s]} ${LABEL[s]} ${fmtDur(m*60)} / 7 j</span>`).join('')}</div>`:''}
        ${ex.map(e=>`<div class="hist"><span style="font-size:20px">${ICON[e.sport]}</span><div style="flex:1;min-width:0"><b>${esc(e.w.type||LABEL[e.sport])}</b><div class="tiny muted">${fmtDate(e.date)} · ${fmtDur((e.w.duration_min||0)*60)}${e.w.distance_km?` · ${(+e.w.distance_km).toFixed(1)} km`:''}${e.w.avg_hr?` · ${Math.round(e.w.avg_hr)} bpm`:''} · ${esc(e.w.source||'')}</div></div><span class="chip num">TSS ~${e.tss}</span></div>`).join('')}
        <p class="tiny muted" style="margin:8px 0 0">Ces séances comptent dans ta forme/fatigue (TSS estimé à la FC ou selon le sport).</p></div>`;
    }
    return h;
  }
  function settingsHTML(){
    const sb = Cloud.sb;
    if (!sb || !Cloud.user) return '';
    const last = H.token?.last ? new Date(H.token.last) : null;
    return `<div class="card"><div class="row between"><h2>Apple Santé</h2><a class="small" href="raccourci.html">Guide du raccourci</a></div>
      <p class="small muted" style="margin-top:0">Un Raccourci iOS envoie chaque jour sommeil, VFC, FC repos, poids et entraînements (montre, Withings, Strava, Garmin Connect…) vers l'app.</p>
      <p class="small">${H.token ? (last ? `Dernier envoi : <b>${last.toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</b>` : 'Clé créée, aucun envoi reçu pour l’instant.') : 'Aucune clé pour l’instant.'}</p>
      <div id="hKeyBox"></div>
      <div class="row"><button class="btn primary" id="hKeyBtn">${H.token ? 'Générer une nouvelle clé' : 'Générer ma clé'}</button><button class="btn ghost" id="hReload">Actualiser</button></div></div>`;
  }
  async function genKey(btn){
    const sb = Cloud.sb, box = $('#hKeyBox');
    if (!sb || !Cloud.user) { box.innerHTML = '<div class="note bad">Connecte-toi d’abord (carte Compte ci-dessus).</div>'; return; }
    btn.disabled = true; btn.textContent = 'Génération…';
    let data, error;
    try { ({ data, error } = await sb.rpc('create_ingest_token')); } catch(e) { error = e; }
    btn.disabled = false; btn.textContent = 'Générer une nouvelle clé';
    if (error || !data) { box.innerHTML = `<div class="note bad">Impossible de générer la clé : ${esc(error?.message || 'réponse vide')}. Vérifie ta connexion et réessaie.</div>`; return; }
    H.token = { last: null }; persist();
    $('#hKeyBox').innerHTML = `<div class="note" style="margin-top:8px"><b>Ta clé (affichée une seule fois) :</b>
      <div class="num small" style="word-break:break-all;margin:6px 0;user-select:all">Bearer ${data}</div>
      <div class="row"><button class="btn sm" data-copy="Bearer ${data}">Copier « Bearer … »</button></div>
      <div class="small" style="margin-top:10px"><b>Adresse :</b> <span class="num" style="word-break:break-all;user-select:all">${INGEST_URL}</span></div>
      <div class="row" style="margin-top:6px"><button class="btn sm" data-copy="${INGEST_URL}">Copier l'adresse</button></div>
      <p class="tiny muted" style="margin:8px 0 0">Colle-les dans le raccourci (voir le guide). Ne partage pas cette clé : elle permet d'écrire dans tes données. Générer une nouvelle clé désactive l'ancienne.</p></div>`;
    box.scrollIntoView({ behavior:'smooth', block:'center' });
  }
  document.addEventListener('click', async e => {
    const b = e.target.closest('#hKeyBtn,#hReload,[data-copy],[data-hweight]'); if (!b) return;
    if (b.id === 'hKeyBtn') genKey(b);
    else if (b.id === 'hReload') { await load(Cloud.sb); render(); toast('Données Santé actualisées'); }
    else if (b.dataset.copy) { try { await navigator.clipboard.writeText(b.dataset.copy); toast('Copié'); } catch(err){ toast('Sélectionne le texte et copie-le'); } }
    else if (b.dataset.hweight) { S.profile.weightKg = +b.dataset.hweight; save(); render(); toast('Poids mis à jour'); }
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Cloud.user && Date.now() - H.loadedAt > 60000) { H.loadedAt = Date.now(); load(Cloud.sb).then(render); } });
  return { load, todayCard, progressCards, settingsHTML, extraWorkouts, readiness };
})();

// ressenti a posteriori pour une activité importée (Strava)
function feelDlg(id){
  const a = S.activities.find(x => x.id === id); if (!a) return;
  const chips = (k, n, lab, labels) => `<label class="f">${lab}</label><div class="seg" data-feel="${k}">${Array.from({length:n},(_,i)=>`<button type="button" data-v="${i+1}">${labels?labels[i]:i+1}</button>`).join('')}</div>`;
  openDlg(`<h2>${esc(a.name)}</h2><p class="muted small">${fmtDate(a.date)} · ${fmtDur(a.durationS)}${a.np?` · NP ${a.np} W`:''}${a.avgHr?` · ${a.avgHr} bpm`:''}</p>
    ${chips('rpe',10,'Effort perçu (RPE)')}${chips('legs',5,'Jambes',['Vides','Lourdes','Normales','Bonnes','Top'])}${chips('breath',5,'Souffle',['Asphyxie','Dur','Correct','Facile','Aisé'])}${chips('motivation',5,'Motivation',['Nulle','Faible','Moyenne','Bonne','À fond'])}
    <label class="f" for="fNote">Commentaire</label><textarea id="fNote"></textarea>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="fSave">Enregistrer</button></div>`);
  const feel = {};
  dlgBody.querySelectorAll('.seg[data-feel]').forEach(seg => seg.querySelectorAll('button').forEach(b => b.onclick = () => { feel[seg.dataset.feel] = +b.dataset.v; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); }));
  $('#fSave').onclick = () => { a.feel = { ...feel, note: $('#fNote').value.trim() || null }; if (!a.np) computeLoad(a); save(); closeDlg(); render(); toast('Ressenti enregistré'); };
}

render();
Cloud.init().catch(e => console.warn('cloud', e));
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(() => { const ts = $('#themeSel'); if (ts) ts.value = S.settings.theme; }, 0);
// accès pour les tests
window.FTPB = { FIT, WORKOUTS, generatePlan, encodeWorkout, activityFromFit, powerSeries, defaultProfile, get S(){ return S; } };
</script>
