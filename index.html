<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>FTP Builder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1115; --bg2:#171a21; --card:#1c2029; --line:#2a2f3b; --text:#eef0f4; --muted:#9aa1b0;
  --accent:#ff6a2b; --accent2:#ffb02e; --ok:#3ecf8e; --warn:#ffb02e; --bad:#ff4d5e;
  --z1:#6b7280; --z2:#3b82f6; --z3:#22c55e; --z4:#facc15; --z5:#f97316; --z6:#ef4444;
  --radius:14px; --shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
/* hypnogramme : éveil, paradoxal, léger, profond */
:root{ --hy-awake:#f0805f; --hy-rem:#7cc8f2; --hy-core:#3b82f6; --hy-deep:#4338ca; }
/* pentes : 4 teintes douces (vert tendre, sable, corail, prune) */
:root{ --g1:#b9d98c; --g2:#efd27e; --g3:#e99a7c; --g4:#9c86c7; --gt:#1d1b20; }
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --g1:#cfe59f; --g2:#f6dc8f; --g3:#ef9f86; --g4:#5d4e7a; }
  :root:not([data-theme="dark"]){ --bg:#f5f4f1; --bg2:#ecebe7; --card:#ffffff; --line:#e1dfda; --text:#16181d; --muted:#666c78; --shadow:0 1px 2px rgba(0,0,0,.05); }
}
:root[data-theme="light"]{ --g1:#cfe59f; --g2:#f6dc8f; --g3:#ef9f86; --g4:#5d4e7a; }
:root[data-theme="light"]{ --bg:#f5f4f1; --bg2:#ecebe7; --card:#ffffff; --line:#e1dfda; --text:#16181d; --muted:#666c78; --shadow:0 1px 2px rgba(0,0,0,.05); }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Barlow Condensed","Arial Narrow",Inter,system-ui,sans-serif;letter-spacing:.01em;margin:0}
.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{max-width:760px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:14px;flex-wrap:wrap}
html,body{max-width:100%;overflow-x:hidden}
@media (max-width:420px){ .brand h1{font-size:24px} .brand small{display:none} header.top .chip{font-size:11px;padding:3px 8px} }
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:28px;font-weight:700;text-transform:uppercase}
.brand h1 b{color:var(--accent)}
.brand small{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:20px;font-weight:600;text-transform:uppercase;margin-bottom:10px}
.card h3{font-size:17px;font-weight:600;margin-bottom:6px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:11.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){ .grid4{grid-template-columns:repeat(2,1fr)} .grid3{grid-template-columns:1fr 1fr} }
.kpi{background:var(--bg2);border-radius:12px;padding:10px 12px}
.kpi .v{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:30px;font-weight:700;line-height:1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500}
.kpi[data-i],h2[data-i]{cursor:pointer;position:relative}
.kpi[data-i]::after{content:"i";position:absolute;top:8px;right:9px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font:600 10px/13px Inter,system-ui,sans-serif;text-align:center;opacity:.7}
.kpi{position:relative}
.kpi[data-i]:active{transform:scale(.98)}
h2[data-i]::after{content:"i";display:inline-block;margin-left:8px;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font:600 11px/14px Inter,system-ui,sans-serif;text-align:center;vertical-align:3px;text-transform:none;opacity:.7}
.infoscale{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.infoscale div{display:flex;gap:10px;align-items:baseline;font-size:13.5px;padding:6px 8px;border-radius:8px}
.infoscale div.on{background:color-mix(in srgb,var(--accent) 16%,var(--bg2));font-weight:600}
.infoscale b{min-width:86px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
nav.tabs{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;padding:0 22px;z-index:20;pointer-events:none}
nav.tabs .in{position:relative;display:flex;max-width:420px;width:100%;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--card) 62%,transparent);border:1px solid color-mix(in srgb,var(--text) 10%,transparent);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:0 10px 30px rgba(0,0,0,.28);pointer-events:auto}
nav.tabs .pill{position:absolute;top:6px;bottom:6px;left:6px;width:0;border-radius:999px;background:color-mix(in srgb,var(--text) 14%,transparent);transition:left .42s cubic-bezier(.3,1.45,.5,1),width .42s cubic-bezier(.3,1.45,.5,1);pointer-events:none}
nav.tabs .pill.still{transition:none}
nav.tabs button{position:relative;z-index:1;flex:1;background:none;border:0;color:var(--muted);display:flex;align-items:center;justify-content:center;height:52px;padding:0;cursor:pointer;border-radius:999px;-webkit-tap-highlight-color:transparent;transition:color .25s,transform .15s}
nav.tabs button:active{transform:scale(.92)}
nav.tabs button svg{width:25px;height:25px}
nav.tabs button .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
nav.tabs button.on{color:var(--text)}
/* carrousel du programme : arches façon scène */
.arcs-wrap{position:relative;margin:0 -16px 12px}
.arcs-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 16px}
.arcs-head h2{font-size:20px;font-weight:600;text-transform:uppercase}
.arcs{display:flex;align-items:flex-end;overflow-x:auto;scroll-snap-type:x mandatory;padding:46px calc(50% - 68px) 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.arcs::-webkit-scrollbar{display:none}
.arc{flex:0 0 136px;height:190px;margin-left:-40px;border-radius:68px 68px 16px 16px;scroll-snap-align:center;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1px;padding:0 10px 16px;text-align:center;cursor:pointer;transform-origin:bottom center;will-change:transform;
  background:color-mix(in srgb,var(--ac) 22%,transparent);border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);color:var(--text);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .25s,border-color .25s,box-shadow .25s}
.arc:first-child{margin-left:0}
.arc .ad{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.arc .an{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:18px;font-weight:600;line-height:1.05;text-transform:uppercase;max-width:110px}
.arc .am{font-size:12px;color:var(--muted)}
.arc .ast{font-size:15px;min-height:18px}
.arc.on{background:color-mix(in srgb,var(--ac) 86%,transparent);border-color:color-mix(in srgb,#fff 45%,transparent);color:#fff;box-shadow:0 6px 22px color-mix(in srgb,var(--ac) 35%,transparent)}
.arc.on .ad,.arc.on .am{color:rgba(255,255,255,.85)}
.arc>span{opacity:var(--fo,1);transition:opacity .15s}
.arc.done{opacity:.8}
.arcs-hint{text-align:center;font-size:12px;color:var(--muted);margin-top:-2px}
.prof{display:flex;align-items:flex-end;gap:1px;height:70px;background:var(--bg2);border-radius:10px;padding:6px;overflow:hidden}
.prof div{border-radius:2px 2px 0 0;min-width:1px}
.steps{width:100%;border-collapse:collapse;font-size:13.5px}
.steps td{padding:6px 4px;border-bottom:1px solid var(--line)}
.steps td.r{text-align:right}
.zone{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mcal .dh{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.04em;padding-bottom:2px}
.mcal .c{position:relative;aspect-ratio:1/1;min-width:0;border-radius:9px;background:var(--bg2);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
.mcal .c.out{opacity:.35}
.mcal .c.today{border-color:var(--accent);font-weight:700}
.mcal .c.planned::after{content:"";position:absolute;left:50%;bottom:6px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;border:1.5px solid var(--muted);box-sizing:border-box}
.mcal .c.hasdots::after{display:none}
.mcal .c.miss{background:color-mix(in srgb,var(--bad) 22%,var(--bg2));border-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--bad)}
.mcal .c .sm{font-size:15px;line-height:1;margin-top:1px}
.mcal .dots{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.mcal .dots i{width:7px;height:7px;border-radius:50%;display:block}
.mcal .dots i.in{background:var(--accent)} .mcal .dots i.ext{background:var(--z2)} .mcal .dots i.oth{background:var(--muted);opacity:.7}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mnav b{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.mnav button{border:1px solid var(--line);background:var(--bg2);border-radius:9px;width:38px;height:34px;cursor:pointer;font-size:18px;color:var(--text)}
.mleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;align-items:center}
.mleg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.achips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 8px}
.achips button{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.achips button i{width:10px;height:3px;border-radius:2px;display:inline-block}
.achips button.on{color:var(--text);border-color:var(--text)}
.atip{position:absolute;top:-6px;left:0;right:0;margin:0 auto;width:max-content;max-width:100%;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:11.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);font-variant-numeric:tabular-nums;text-align:center}
.awrap{position:relative;touch-action:pan-y}
.achips button.afull{margin-left:auto;color:var(--text)}
dialog.fs{max-width:none;max-height:none;width:100vw;height:100vh;height:100dvh;margin:0;background:var(--bg)}
dialog.fs .actchart{height:100%;display:flex;flex-direction:column;box-sizing:border-box;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
dialog.fs .fshead{display:flex;align-items:center;gap:10px}
dialog.fs .fshead h3{margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
dialog.fs .fshead button{border:1px solid var(--line);background:var(--bg2);border-radius:999px;width:36px;height:36px;font-size:20px;line-height:1;cursor:pointer;color:var(--text);flex:none}
dialog.fs .achips{flex-wrap:nowrap;overflow-x:auto;margin:8px 0 4px;scrollbar-width:none}
dialog.fs .achips button{flex:none}
dialog.fs .awrap{flex:1;min-height:0}
dialog.fs .achart{position:absolute;inset:0}
dialog.fs svg.chart{width:100%;height:100%}
dialog.fs svg.chart text{font-size:12px}
dialog.fs3d{background:#0a1020}
.climbs{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.climb{--tint:var(--g1);border-radius:20px;padding:14px;background:color-mix(in srgb,var(--tint) 28%,var(--card));border:1px solid color-mix(in srgb,var(--tint) 45%,var(--line));cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative}
.climb:hover{border-color:var(--tint)}
/* pile façon dossiers : seuls les en-têtes dépassent, la dernière carte est entière */
.climbs.stack{gap:0}
.climbs.stack .climb:not(:last-child){max-height:92px;overflow:hidden;padding-bottom:30px}
.climbs.stack .climb + .climb{margin-top:-26px;box-shadow:0 -6px 16px rgba(0,0,0,.10)}
.more{width:100%;margin-top:10px;justify-content:center}
.chhead{cursor:pointer;border-radius:8px}.chhead:hover b{color:var(--accent)}
.climbs.stack .climb:not(:last-child) .cstat{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.climb > *{flex-shrink:0}
.gdot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:baseline;margin:0 2px 0 6px}
.climbpredwrap{margin-top:12px}
.climbpredwrap summary{cursor:pointer;font-weight:600;padding:10px 12px;border-radius:12px;background:var(--bg2);list-style:none}
.climbpredwrap summary::before{content:'＋ ';color:var(--accent)} .climbpredwrap[open] summary::before{content:'− '}
.climbpred{margin-top:12px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--accent) 8%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
.climbpred .f{margin-top:0}
.t3d{position:relative;width:100%;height:100%;overflow:hidden;color:#e8eefc;font-variant-numeric:tabular-nums}
.t3c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.t3top{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none}
.t3title{flex:1;min-width:0;display:flex;flex-direction:column;text-shadow:0 1px 6px #000}
.t3title b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t3title span{font-size:12px;color:#9fb3d9}
.t3btn{pointer-events:auto;flex:none;min-width:38px;height:38px;border-radius:999px;border:1px solid rgba(120,170,255,.35);background:rgba(10,20,40,.7);color:#e8eefc;font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}
.t3btn.on{background:#ff6a2b;border-color:#ff6a2b}
.t3hud{position:absolute;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 50px);display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.t3hud div{background:rgba(10,20,40,.62);border:1px solid rgba(120,170,255,.25);border-radius:10px;padding:3px 8px;font-size:12px;backdrop-filter:blur(6px)}
.t3hud small{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#8ea4cc}.t3hud b{font-size:16px}
.t3bot{position:absolute;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:linear-gradient(transparent,rgba(5,10,22,.85) 40%)}
.t3prof{width:100%;height:48px;display:block;cursor:pointer}
.t3ctl{display:flex;align-items:center;gap:10px;margin-top:6px}
.t3play{width:46px;height:46px;border-radius:50%;border:0;background:#ff6a2b;color:#fff;font-size:18px;cursor:pointer;flex:none;box-shadow:0 0 18px rgba(255,106,43,.55)}
.t3seek{flex:1;accent-color:#ff6a2b}
.t3spd{font-size:13px;font-weight:600}
.t3attr{font-size:9px;color:#8ea4cc;text-align:right;margin-top:4px;opacity:.8}
@media (max-height:430px){ .t3hud b{font-size:14px} .t3prof{height:38px} }
dialog.fs .fshint{display:none;text-align:center;font-size:12px;color:var(--muted);margin-top:6px}
@media (orientation:portrait){ dialog.fs .fshint{display:block} }
.week{margin-bottom:14px}
.week .wh{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 6px}
.week .wh h3{font-size:16px;text-transform:uppercase}
.sess{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;cursor:pointer}
.sess:hover{border-color:var(--muted)}
.sess .d{width:46px;text-align:center;flex:none}
.sess .d b{display:block;font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:22px;line-height:1}
.sess .d span{font-size:11px;color:var(--muted);text-transform:uppercase}
.sess .m{flex:1;min-width:0}
.sess .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .st{flex:none;font-size:18px}
.sess.done{border-left:4px solid var(--ok)} .sess.skipped{opacity:.5} .sess.today{outline:2px solid var(--accent)}
.sess.opt .m b::after{content:" · optionnelle";color:var(--muted);font-weight:400;font-size:12px}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.bar{height:10px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.note{background:color-mix(in srgb,var(--accent) 12%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.note.ok{background:color-mix(in srgb,var(--ok) 12%,var(--card));border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.note.warn{background:color-mix(in srgb,var(--warn) 12%,var(--card));border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.note.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:4px 3px 6px;text-align:center;font-size:12px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;min-width:0}
.day.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bg2))}
.day button{background:none;border:0;cursor:pointer;width:100%;font-weight:600;padding:10px 0;font-size:13px}
.day.on button{color:var(--accent)}
.day input:disabled{opacity:.35;pointer-events:none}
.day input{width:100%;min-height:32px;padding:4px 0;text-align:center;font-size:12px;border-radius:7px;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg2);border-radius:9px;padding:7px 11px;cursor:pointer;min-width:38px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
dialog{border:0;padding:0;background:transparent;max-width:640px;width:calc(100% - 24px);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog .card{max-height:88vh;overflow-y:auto;overflow-x:hidden;margin:0}
dialog{margin:auto;box-sizing:border-box}
.grid2>*,.grid3>*,.grid4>*{min-width:0}
input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
.x{float:right;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px;font-family:Inter}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.hist{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;color:var(--muted)}
.drop:hover{border-color:var(--accent);color:var(--text)}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;max-width:90%;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.onb{max-width:640px;margin:0 auto}
.hero{padding:6px 2px 14px}
.hero h1{font-size:40px;font-weight:700;text-transform:uppercase;line-height:.95}
.hero h1 b{color:var(--accent)}

  ss_2x20: { name:'Sweet spot 2 × 20 min', type:'ss', goal:"Le classique : 2 × 20 à 90 %, tenir sans à-coups.", steps:[...WU, R_(2,[S_(20,90,'Sweet spot',null,{cad:90}), S_(5,55,'Récup','rest')]), ...CD(7)] },

  vo2_3030: { name:'30/30 · 3 × 10', type:'vo2', goal:"Accumuler du temps près de VO2max avec des micro-récups.", steps:[...WU, R_(3,[R_(10,[S_(0.5,130,'ON',null,{cad:100}), S_(0.5,50,'OFF','rest')]), S_(5,55,'Récup','rest')]), ...CD(5)] },

  // --- séances ajoutées v0.7 : plus de variété ---
  ss_4x10: { name:'Sweet spot 4 × 10 min', type:'ss', goal:"Volume sweet spot fractionné : 40 min à 90 % avec des récups courtes.", steps:[...WU, R_(4,[S_(10,90,'Sweet spot',null,{cad:90}), S_(4,55,'Récup','rest')]), ...CD(6)] },

  force_4x8: { name:'Force 4 × 8 min (60 rpm)', type:'force', goal:"Endurance de force : 4 × 8 min à 88 % en cadence basse, comme dans un long col.", steps:[...WU, R_(4,[S_(8,88,'Force · 60 rpm assis',null,{cad:60}), S_(4,55,'Récup souple','rest',{cad:95})]), ...CD(6)] },
  tempo_end: { name:'Endurance + tempo 1 h 15', type:'tempo', goal:"Sortie d'endurance avec 3 blocs tempo : du volume utile sans grosse fatigue.", steps:[S_(10,58,'Échauffement','warmup'), R_(3,[S_(10,82,'Tempo',null,{cad:88}), S_(8,65,'Endurance')]), S_(11,55,'Retour au calme','cooldown')] },
  thr_5x6: { name:'Seuil 5 × 6 min', type:'thr', goal:"Seuil en blocs courts (102 %) : bonne porte d'entrée vers le travail au seuil.", steps:[...WU_ACT, R_(5,[S_(6,102,'Seuil',null,{cad:92}), S_(3,55,'Récup','rest')]), ...CD(7)] },
  thr_prog: { name:'Seuil progressif 3 × 10 min', type:'thr', goal:"Chaque bloc monte 95 → 100 → 105 % : finir fort quand la fatigue arrive, comme en haut d'un col.", steps:[...WU_ACT, R_(3,[S_(10/3,95,'Seuil −'), S_(10/3,100,'Seuil'), S_(10/3,105,'Seuil +'), S_(5,55,'Récup','rest')]), ...CD(6)] },
  thr_2x15: { name:'Seuil 2 × 15 min', type:'thr', goal:"Deux longs blocs à 100 % : la séance qui fait monter la FTP.", steps:[...WU_ACT, R_(2,[S_(15,100,'Seuil',null,{cad:92}), S_(7,55,'Récup','rest')]), ...CD(7)] },
  vo2_4x5: { name:'VO2max 4 × 5 min', type:'vo2', goal:"VO2max « long » à 108 % : entrée en douceur dans le travail VO2.", steps:[...WU_ACT, R_(4,[S_(5,108,'VO2max',null,{cad:95}), S_(5,50,'Récup','rest')]), ...CD(7)] },
  vo2_8x2: { name:'VO2max 8 × 2 min', type:'vo2', goal:"Efforts de 2 min à 120 % : intense mais court, idéal pour progresser sur 3-5 min.", steps:[...WU_ACT, R_(8,[S_(2,120,'VO2max',null,{cad:100}), S_(2,50,'Récup','rest')]), ...CD(8)] },
  vo2_pyr: { name:'Pyramide VO2 1-2-3-4-3-2-1', type:'vo2', goal:"Pyramide à 115 % avec récup égale à l'effort : varié, dur, très efficace.", steps:[...WU_ACT, ...[1,2,3,4,3,2,1].flatMap(m => [S_(m,115,`VO2 ${m} min`,null,{cad:98}), S_(m,50,'Récup','rest')]), ...CD(6)] },
  vo2_4020: { name:'40/20 · 3 × 8 min', type:'vo2', goal:"40 s à 120 % / 20 s de récup : on accumule du temps près de VO2max avec très peu de récupération.", steps:[...WU, R_(3,[R_(8,[S_(40/60,120,'ON',null,{cad:100}), S_(20/60,50,'OFF','rest')]), S_(5,55,'Récup','rest')]), ...CD(6)] },
  end_neuro: { name:'Endurance + sprints 1 h', type:'end', goal:"Endurance Z2 avec 8 sprints de 15 s : réveille la puissance explosive sans fatigue.", steps:[S_(10,58,'Échauffement','warmup'), R_(8,[S_(0.25,180,'Sprint 15 s',null,{cad:110}), S_(4.75,66,'Endurance')]), S_(5,62,'Endurance'), S_(5,55,'Retour au calme','cooldown')] },
  rec_45: { name:'Récup active 45 min', type:'rec', goal:"Faire tourner les jambes, très facile (< 60 %).", steps:[S_(45,55,'Récup active','rest',{cad:90})] },
  openers: { name:'Rappels (veille de test)', type:'rec', goal:"Réveiller les jambes sans fatigue avant un test ou une semaine dure.", steps:[S_(10,55,'Échauffement','warmup'), R_(3,[S_(1,110,'Rappel',null,{cad:100}), S_(2,55,'Récup','rest')]), S_(10,65,'Endurance'), S_(5,50,'Retour au calme','cooldown')] },
};
const HARD = new Set(['test','ss','thr','vo2','force']);
const isHard = wid => HARD.has(WORKOUTS[wid]?.type);
function flat(steps){ const out = []; for (const s of steps) { if (s.repeat) for (let i=0;i<s.repeat;i++) out.push(...flat(s.steps)); else out.push(s); } return out; }
const wDur = wid => flat(WORKOUTS[wid].steps).reduce((a,s)=>a+s.d,0);
const wTSS = wid => Math.round(flat(WORKOUTS[wid].steps).reduce((a,s)=>a + s.d*Math.pow(s.p/100,2),0)/36);
const watts = (p, f=ftp(), k=1) => round5(p/100 * f * adj() * k);
const sAdj = s => (s && s.adj) || 1;
function mainStep(wid){ // le bloc principal le plus intense et le plus long (pour mesurer le respect des cibles)
  let best = null; for (const s of flat(WORKOUTS[wid].steps)) if ((s.int || 'active') === 'active' && s.p >= 85 && (!best || s.d*s.p > best.d*best.p)) best = s; return best;
}

/* ============ planificateur ============ */
const BLOCKS = [
  // k[i][semaine du bloc] : séance clé n°1, n°2, n°3 (si 3 séances clés / semaine)
  { name:'Base · Sweet spot', k:[['ss_3x10','ss_3x12','ss_4x10'],['force_5x5','tempo_2x20','ss_ou'],['tempo_end','force_5x5','tempo_2x20']] },
  { name:'Sweet spot → Seuil', k:[['ss_2x20','thr_5x6','thr_4x8'],['force_4x8','ss_3x15','vo2_4x5'],['tempo_2x20','ss_ou','tempo_end']] },
  { name:'Seuil + VO2max', k:[['thr_3x12','thr_prog','thr_2x15'],['vo2_5x4','vo2_8x2','vo2_pyr'],['force_4x8','ss_2x20','ou_3x9']] },
  { name:'VO2max · Spécifique', k:[['vo2_6x3','vo2_4020','vo2_3030'],['thr_2x15','ou_3x9','thr_2x20'],['ss_ou','force_4x8','tempo_end']] },
];
const ALT = { // repli si la séance dépasse la durée dispo du jour
  ss:['ss_3x10','ss_3x12','ss_ou','ss_4x10','ss_2x20','ss_3x15'], thr:['thr_5x6','thr_4x8','ou_3x9','thr_prog','thr_3x12','thr_2x15','thr_2x20'], vo2:['vo2_8x2','vo2_6x3','vo2_4x5','vo2_5x4','vo2_pyr','vo2_4020','vo2_3030'],
  force:['force_5x5','force_4x8'], tempo:['tempo_2x20','tempo_end'], end:['end_60','end_neuro','end_90','end_120'], rec:['openers','rec_45'], test:['ramp','test20'] };
// échelles de difficulté (de la plus facile à la plus dure) pour « plus facile / plus dur »
const LADDER = {
  rec:['rec_45','openers'], end:['rec_45','end_60','end_neuro','end_90','end_120'], tempo:['tempo_end','tempo_2x20'],
  force:['force_5x5','force_4x8'], ss:['ss_3x10','ss_3x12','ss_ou','ss_4x10','ss_2x20','ss_3x15'],
  thr:['thr_5x6','thr_4x8','ou_3x9','thr_prog','thr_3x12','thr_2x15','thr_2x20'], vo2:['vo2_4x5','vo2_8x2','vo2_5x4','vo2_pyr','vo2_6x3','vo2_4020','vo2_3030'] };
const DOWN = { vo2:'thr', thr:'ss', ss:'tempo', force:'tempo', tempo:'end', end:'rec', rec:null };
const UP = { rec:'end', end:'tempo', tempo:'ss', ss:'thr', force:'thr', thr:'vo2', vo2:null };
function neighbor(wid, dir){
  const t = WORKOUTS[wid].type; if (t === 'test') return null;
  const L = LADDER[t] || [wid]; const i = L.indexOf(wid);
  const ofType = f => (LADDER[f] || []).filter(w => WORKOUTS[w].type === f && w !== wid);
  if (dir < 0) { if (i > 0) return L[i-1]; const d = DOWN[t]; if (!d) return null; const c = ofType(d); return c[Math.max(0, c.length - (d === 'end' ? 3 : 1))] || null; }
  if (i >= 0 && i < L.length-1 && L[i+1] !== wid) return L[i+1]; const u = UP[t]; if (!u) return null; return ofType(u)[0] || null;
}
function fitTo(wid, maxMin){
  const t = WORKOUTS[wid].type, lim = maxMin*60;
  if (wDur(wid) <= lim) return wid;
  const opts = (ALT[t]||[wid]).filter(id => wDur(id) <= lim).sort((a,b)=>wDur(b)-wDur(a));
  if (opts.length) return opts[0];
  if (t === 'tempo' || t === 'ss') { const s = ALT.ss.filter(id=>wDur(id)<=lim); if (s.length) return s[0]; }
  return (ALT[t]||[wid]).slice().sort((a,b)=>wDur(a)-wDur(b))[0];
}
function pickDays(p){
  const av = [0,1,2,3,4,5,6].filter(d => p.days[d]?.avail && (p.days[d].max||0) >= 40);
  const K = Math.min(p.keyPerWeek, av.length);
  let best = null;
  const combos = (arr, k, start=0, cur=[]) => { if (cur.length===k) { score(cur.slice()); return; } for (let i=start;i<arr.length;i++){ cur.push(arr[i]); combos(arr,k,i+1,cur); cur.pop(); } };

/* ============ charge CTL / ATL ============ */
function loadSeries(){
  const hw = [...Health.extraWorkouts(), ...Health.exerciseLoad()];
  if (!S.activities.length && !hw.length) return [];
  const byDay = {}; for (const a of S.activities) byDay[a.date] = (byDay[a.date]||0) + (a.tss||0);
  for (const w of hw) byDay[w.date] = (byDay[w.date]||0) + w.tss;
  const first = [...S.activities.map(a=>a.date), ...hw.map(w=>w.date)].sort()[0]; const start = addDays(first < S.profile.startDate ? first : S.profile.startDate, -1);
  const end = todayISO(); const out = [];
  const longHistory = S.healthImportedAt && diffDays(start, end) >= 90;
  let ctl = longHistory ? 0 : (S.profile.ctl0 || 0), atl = ctl;
  for (let d = start; d <= end; d = addDays(d,1)) { const t = byDay[d]||0; const tsb = ctl - atl; ctl += (t-ctl)/42; atl += (t-atl)/7; out.push({ d, ctl, atl, tsb, tss:t }); }
  return out;
}

  const from = Date.parse(addDays(night, -1) + 'T18:00:00'), to = Date.parse(night + 'T14:00:00');

  if (!list.length) return '';
  const bySrc = {}; for (const x of list) bySrc[x.source] = (bySrc[x.source] || 0) + 1; // une seule source : la plus détaillée (la montre)
  const src = Object.keys(bySrc).sort((a, b) => (/watch/i.test(b) - /watch/i.test(a)) || bySrc[b] - bySrc[a])[0]; list = list.filter(x => x.source === src);

  let g = ''; for (let r = 0; r < 4; r++) g += `<line x1="${L}" x2="${W-R}" y1="${T + rowH*(r+1)}" y2="${T + rowH*(r+1)}" stroke="var(--line)"/><circle cx="5" cy="${Yc(r)}" r="3.5" style="fill:${COL[r]}"/><text x="12" y="${Yc(r) + 3}" style="font-size:9.5px">${LAB[r]}</text>`;
  for (let h = Math.ceil(t0/3600000)*3600000; h <= t1; h += 3600000) { const d = new Date(h); if (d.getHours() % 2) continue;
    g += `<line x1="${X(h)}" x2="${X(h)}" y1="${T}" y2="${T + rowH*4}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${X(h)}" y="${Hh - 6}" text-anchor="middle" style="font-size:9px">${pad(d.getHours())}:00</text>`; }
  list.sort((a, b) => Date.parse(a.start_at) - Date.parse(b.start_at));
  let prev = null;
  for (const x of list) { const r = ROW[x.stage] ?? 2, x0 = X(Date.parse(x.start_at)), x1 = Math.max(x0 + 1.5, X(Date.parse(x.end_at)));
    if (prev) g += `<line x1="${x0}" x2="${x0}" y1="${Yc(prev)}" y2="${Yc(r)}" stroke="var(--muted)" stroke-width=".8" opacity=".5"/>`;
    g += `<rect x="${x0}" y="${Yc(r) - 9}" width="${x1 - x0}" height="18" rx="4" style="fill:${COL[r]}"/>`; prev = r; }
  const span = Math.round((t1 - t0)/60000);
  return `<h3 style="margin:2px 0 4px;font-size:15px">Ta nuit · phases</h3><svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Phases de sommeil de la nuit">${g}</svg>
    <p class="tiny muted" style="margin:0 0 12px">${new Date(t0).toTimeString().slice(0, 5)} → ${new Date(t1).toTimeString().slice(0, 5)} (${Math.floor(span/60)}h${pad(span%60)}) · ${esc(src || '')}</p>`;
}

function projection(){
  const p = S.profile; const H = S.ftpHistory.filter(h => h.source === 'test');
  if (!H.length) return null;
  const last = H[H.length-1];
  const all = S.ftpHistory;
  let rate; // W par semaine
  if (H.length >= 2) { const first = H[0]; const w = diffDays(first.date, last.date)/7; rate = w > 0 ? (last.ftp - first.ftp)/w : 0; }
  else rate = 1.5; // hypothèse prudente : +1,5 W/semaine avec 2-3 séances structurées
  rate = clamp(rate, 0, 3);
  const weeks = Math.max(diffDays(last.date, p.goalDate)/7, 0);
  const value = Math.round(last.ftp + rate*weeks);
  const gap = p.goalFtp - value;
  const text = H.length >= 2
    ? `Au rythme mesuré entre tes tests (${rate.toFixed(1)} W/semaine), tu serais vers ${value} W le ${fmtShort(p.goalDate)}${gap>0?` (${gap} W sous l'objectif)`:' : objectif en vue'}.`
    : `Hypothèse prudente de +1,5 W/semaine : ~${value} W le ${fmtShort(p.goalDate)}. Il te faudrait ${((p.goalFtp-last.ftp)/Math.max(weeks,1)).toFixed(1)} W/semaine pour ${p.goalFtp} W. Le prochain test affinera.`;
  return { value, text, from: last.ftp, fromDate: last.date };
}

const HealthImport = (() => {
  const DAYS = 120;
  const Q = { // type HealthKit -> [métrique, agrégat]
    HKQuantityTypeIdentifierHeartRateVariabilitySDNN: ['hrv','avg'], HKQuantityTypeIdentifierRestingHeartRate: ['rhr','avg'],
    HKQuantityTypeIdentifierBodyMass: ['weight','last'], HKQuantityTypeIdentifierVO2Max: ['vo2max','last'],
    HKQuantityTypeIdentifierRespiratoryRate: ['resp_rate','avg'], HKQuantityTypeIdentifierOxygenSaturation: ['spo2','avg'],
    HKQuantityTypeIdentifierBodyFatPercentage: ['body_fat','last'], HKQuantityTypeIdentifierLeanBodyMass: ['lean_mass','last'],
    HKQuantityTypeIdentifierAppleExerciseTime: ['exercise_min','sum'], HKQuantityTypeIdentifierWalkingHeartRateAverage: ['walking_hr','avg'],
    HKQuantityTypeIdentifierBloodPressureSystolic: ['systolic','avg'], HKQuantityTypeIdentifierBloodPressureDiastolic: ['diastolic','avg'],
  };
  const SLEEP = 'HKCategoryTypeIdentifierSleepAnalysis';
  const WT = { Running:'Course à pied', Cycling:'Vélo', Swimming:'Natation', Walking:'Marche', Hiking:'Randonnée', TraditionalStrengthTraining:'Renforcement musculaire', FunctionalStrengthTraining:'Renforcement fonctionnel', HighIntensityIntervalTraining:'HIIT', CoreTraining:'Gainage', Yoga:'Yoga', Pilates:'Pilates', Elliptical:'Elliptique', Rowing:'Aviron', CrossTraining:'Cross training', Flexibility:'Mobilité', MixedCardio:'Cardio', Other:'Autre', Surfing:'Surf', SurfingSports:'Surf', Climbing:'Escalade', Cooldown:'Retour au calme', Soccer:'Football', Tennis:'Tennis', Basketball:'Basket', Skiing:'Ski', DownhillSkiing:'Ski alpin', CrossCountrySkiing:'Ski de fond', Boxing:'Boxe', MartialArts:'Arts martiaux', Paddling:'Paddle', StairClimbing:'Escaliers', Dance:'Danse', Badminton:'Badminton', Squash:'Squash', Padel:'Padel', PickleBall:'Pickleball' };
  const isoOf = s => s ? s.replace(' ', 'T').replace(/ ([+-]\d{2})(\d{2})$/, '$1:$2') : null; // "2026-10-20 07:12:00 +0200"
  const attrs = s => { const o = {}; s.replace(/(\w+)="([^"]*)"/g, (_, k, v) => { o[k] = v; return ''; }); return o; };

  // --- lecture du zip sans tout charger en mémoire (gère le ZIP64 des gros exports) ---
  async function zipEntry(file){
    const tailLen = Math.min(file.size, 70000), tail = new DataView(await file.slice(file.size - tailLen).arrayBuffer());
    let e = -1; for (let i = tailLen - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { e = i; break; }
    if (e < 0) throw new Error('Archive .zip illisible');
    let cdOff = tail.getUint32(e + 16, true), cdSize = tail.getUint32(e + 12, true), n = tail.getUint16(e + 10, true);
    if (cdOff === 0xFFFFFFFF || n === 0xFFFF) { // ZIP64
      const loc = e - 20; if (loc < 0 || tail.getUint32(loc, true) !== 0x07064b50) throw new Error('ZIP64 non reconnu');

    let p = 0;
    for (let k = 0; k < n && p < cd.byteLength; k++) {
      const method = cd.getUint16(p + 10, true); let csize = cd.getUint32(p + 20, true), usize = cd.getUint32(p + 24, true);
      const nl = cd.getUint16(p + 28, true), xl = cd.getUint16(p + 30, true), cl = cd.getUint16(p + 32, true); let off = cd.getUint32(p + 42, true);
      const name = new TextDecoder().decode(new Uint8Array(cd.buffer, p + 46, nl));
      let x = p + 46 + nl; const xe = x + xl;
      while (x + 4 <= xe) { const id = cd.getUint16(x, true), sz = cd.getUint16(x + 2, true); if (id === 1) { let q = x + 4; if (usize === 0xFFFFFFFF) { usize = Number(cd.getBigUint64(q, true)); q += 8; } if (csize === 0xFFFFFFFF) { csize = Number(cd.getBigUint64(q, true)); q += 8; } if (off === 0xFFFFFFFF) { off = Number(cd.getBigUint64(q, true)); } } x += 4 + sz; }
      p = xe + cl;

      const lh = new DataView(await file.slice(off, off + 30).arrayBuffer());
      const start = off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);

  async function run(file, box){
    const sb = Cloud.sb, user = Cloud.user;

    if (!('DecompressionStream' in window) || !('TextDecoderStream' in window)) { box.innerHTML = '<div class="note bad">Navigateur trop ancien : mets à jour iOS (16.4 minimum).</div>'; return; }

      let s = stream.s.pipeThrough(counter);

      const cutoff = addDays(todayISO(), -DAYS);

          const type = (at.workoutActivityType || '').replace('HKWorkoutActivityType', '');

      const union = iv => { iv.sort((a,b)=>a[0]-b[0]); let t=0, cs=-1, ce=-1; for (const [s,e] of iv){ if (s>ce){ if (ce>cs) t+=ce-cs; cs=s; ce=e; } else ce=Math.max(ce,e); } if (ce>cs) t+=ce-cs; return Math.round(t/60000); };

function challengesHTML(){

  return `<div class="card"><div class="row between"><h2>Défis</h2><span class="muted small">jusqu'au ${fmtShort(challenges()[0].end)}</span></div>` + challenges().map(c => {
    const done = chTotal(c), pct = clamp(done/c.target*100, 0, 100);
    const totalDays = Math.max(diffDays(c.start, c.end) + 1, 1), elapsed = clamp(diffDays(c.start, t) + 1, 0, totalDays);
    const expected = c.target * elapsed / totalDays, ahead = done - expected;
    const left = Math.max(c.target - done, 0), daysLeft = Math.max(diffDays(t, c.end) + 1, 1);
    const perDay = left / daysLeft, today = c.entries[t] || 0;
    const stCol = ahead >= 0 ? 'var(--ok)' : ahead > -c.target*0.03 ? 'var(--warn)' : 'var(--bad)';
    return `<div style="margin-top:14px">
      <div class="row between chhead" data-chedit="${c.id}" role="button" tabindex="0" title="Voir le détail"><b>${esc(c.name)} <span class="muted" style="font-weight:400">›</span></b><span class="num small"><b>${fmtCh(c, done)}</b> / ${fmtCh(c, c.target)} · ${Math.floor(pct)} %</span></div>
      <div class="bar" style="margin:8px 0;position:relative"><i style="width:${pct}%"></i><span title="Rythme prévu" style="position:absolute;top:-3px;bottom:-3px;left:${clamp(expected/c.target*100,0,100)}%;width:2px;background:var(--text);opacity:.5"></span></div>
      <div class="tiny muted">Aujourd'hui : <b style="color:var(--text)">${fmtCh(c, today)}</b> · objectif du jour ~${fmtCh(c, perDay)} · <span style="color:${stCol}">${ahead >= 0 ? `${fmtCh(c, ahead)} d'avance` : `${fmtCh(c, -ahead)} de retard`}</span></div>
      <div class="row" style="margin-top:8px;gap:6px">${c.step.map(s => `<button class="btn sm" data-chadd="${c.id}" data-v="${s}">+${s}${c.unit==='min'?' min':''}</button>`).join('')}
        <input type="text" inputmode="decimal" id="chIn-${c.id}" placeholder="${c.unit==='min'?'min':'nb'}" style="width:76px;min-height:32px;padding:4px 8px">
        <button class="btn sm primary" data-chadd="${c.id}">Ajouter</button>
        <button class="btn sm ghost" data-chedit="${c.id}">Détail</button></div>
    </div>`;
  }).join('') + `</div>`;
}
function chAdd(id, v){
  const c = challenges().find(x => x.id === id); if (!c || !(v > 0)) return toast('Indique un nombre');
  const t = todayISO(); c.entries[t] = +((c.entries[t] || 0) + v).toFixed(2);
  (c.log ||= []).push({ ts: Date.now(), v }); // journal horodaté : qui voit « +50 à 12:51 »
  save(); render(); toast(`+${fmtCh(c, v)} ${c.unit==='min'?'de chaise':'squats'} 💪`);
}
// détail d'un défi : chiffres clés, 30 derniers jours, journal jour par jour avec l'heure de chaque ajout, corrections

  const t = todayISO(), days = Object.keys(c.entries).filter(d => c.entries[d] > 0).sort().reverse();

  let streak = 0; for (let d = c.entries[t] > 0 ? t : addDays(t, -1); c.entries[d] > 0; d = addDays(d, -1)) streak++;
  const best = days.reduce((m, d) => c.entries[d] > (c.entries[m] || 0) ? d : m, null);
  const last30 = Array.from({ length: 30 }, (_, i) => addDays(t, i - 29)), max30 = Math.max(1, ...last30.map(d => c.entries[d] || 0));

        ${byDay[d]?.length ? `<div class="tiny muted">${byDay[d].sort((x, y) => x.ts - y.ts).map(e => `${e.v < 0 ? '' : '+'}${fmtCh(c, e.v)} à ${hm(e.ts)}`).join(' · ')}</div>` : '<div class="tiny muted">total du jour (saisi avant l\'horodatage)</div>'}</div>
        <b class="num">${fmtCh(c, c.entries[d])}</b></div>`).join('') + (days.length > 14 && !chShowAll ? `<button class="btn ghost more" id="chMore">+ Découvrir (${days.length} jours)</button>` : '')
      : '<p class="muted small">Aucune saisie pour l’instant.</p>'}</div>
    <details style="margin-top:14px"><summary class="small" style="cursor:pointer;font-weight:600">Corriger ou modifier l'objectif</summary>
      <div class="grid2"><div><label class="f" for="chT">Objectif (${c.unit==='min'?'minutes':'répétitions'})</label><input type="number" id="chT" value="${c.target}"></div><div><label class="f" for="chE">Échéance</label><input type="date" id="chE" value="${c.end}"></div></div>
      <label class="f" for="chD">Total d'un jour (0 pour l'effacer)</label><div class="row"><input type="date" id="chD" value="${t}" style="flex:1"><input type="text" inputmode="decimal" id="chV" placeholder="total du jour" style="width:120px"><button class="btn" id="chSet">Appliquer</button></div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="chSave">Enregistrer l'objectif</button></div></details>`);

    if (v - before) (c.log ||= []).push({ ts: Date.parse(d + 'T12:00:00') || Date.now(), v: +(Math.max(v, 0) - before).toFixed(2), fix: true });
    save(); chEditDlg(id); render(); };
  $('#chSave').onclick = () => { const tv = +$('#chT').value; if (tv > 0) c.target = tv; if ($('#chE').value) c.end = $('#chE').value; save(); closeDlg(); render(); };

/* ============ test : 20 min <-> rampe ERG ============ */
function switchTestProtocol(proto){
  const wid = proto === 'ramp' ? 'ramp' : 'test20';
  S.profile.testProtocol = proto;
  let n = 0; for (const s of S.plan) if (s.status === 'planned' && WORKOUTS[s.workoutId].type === 'test') { s.workoutId = wid; n++; }
  save(); closeDlg(); render();
  toast(`${n} test${n>1?'s':''} passé${n>1?'s':''} en ${proto==='ramp'?'rampe ERG':'20 min'}`);
}

/* ============ absences : reprogrammer les séances ============ */
function absencesHTML(){
  const list = (S.profile.absences || []).filter(a => a.to >= addDays(todayISO(), -14));
  if (!list.length) return '';
  return `<div style="margin-top:12px">${list.map(a => `<div class="hist"><span>✈︎</span><div style="flex:1"><b>${fmtShort(a.from)} → ${fmtShort(a.to)}</b><div class="tiny muted">${a.moves.length} séance${a.moves.length>1?'s':''} reprogrammée${a.moves.length>1?'s':''}${a.label?` · ${esc(a.label)}`:''}</div></div><button class="btn sm ghost" data-undoabs="${a.id}">Annuler</button></div>`).join('')}</div>`;
}
const dayFree = (date, exceptIds, absFrom, absTo) => !(date >= absFrom && date <= absTo) && !S.plan.some(x => x.date === date && x.status !== 'skipped' && !exceptIds.has(x.id) && mandatory(x));
function hardOk(s, date, moved){
  if (!isHard(s.workoutId)) return true;
  return !S.plan.some(x => x.id !== s.id && x.status !== 'skipped' && isHard(moved.get(x.id)?.workoutId || x.workoutId) && Math.abs(diffDays(moved.get(x.id)?.date || x.date, date)) < 2 && !(moved.get(x.id)?.skip));
}
// propose une nouvelle date pour chaque séance tombant pendant l'absence
function planAbsence(from, to){
  const p = S.profile, t = todayISO();
  const hit = S.plan.filter(s => s.status === 'planned' && s.date >= from && s.date <= to).sort((a,b) => (mandatory(b)-mandatory(a)) || a.date.localeCompare(b.date));
  const moved = new Map(); // id -> {date, skip}
  const taken = new Set();
  for (const s of hit) {
    if (!mandatory(s)) { moved.set(s.id, { date: s.date, skip: true, reason: 'optionnelle' }); continue; }
    const cands = [];
    for (let k = -4; k <= 9; k++) {
      const d = k < 0 ? addDays(from, k) : addDays(to, k + 1);
      if (d <= t || d > p.endDate) continue; // à partir de demain
      if (taken.has(d)) continue;
      const avail = p.days[dowMon(d)]?.avail;
      if (!dayFree(d, new Set([s.id]), from, to)) continue;
      if (!hardOk(s, d, moved)) continue;
      // éviter d'empiler le test juste avant/après une séance clé
      const dist = k < 0 ? -k : k + 1;
      const score = (avail ? 0 : 6) + dist + (k < 0 ? 0.5 : 0) + (WORKOUTS[s.workoutId].type === 'test' && k < 0 && dist === 1 ? 2 : 0);
      cands.push({ d, score });
    }
    cands.sort((a,b) => a.score - b.score);
    if (cands.length) { moved.set(s.id, { date: cands[0].d, skip: false }); taken.add(cands[0].d); }
    else moved.set(s.id, { date: s.date, skip: true, reason: 'pas de créneau' });
  }
  // un test doit précéder les séances clés suivantes (leurs watts en dépendent) : on échange
  for (const [id, m] of [...moved]) {
    const s = S.plan.find(x => x.id === id);
    if (m.skip || WORKOUTS[s.workoutId].type !== 'test') continue;
    const before = S.plan.filter(x => x.status === 'planned' && !moved.has(x.id) && mandatory(x) && WORKOUTS[x.workoutId].type !== 'test' && x.date > to && x.date < m.date).sort((a,b)=>a.date.localeCompare(b.date))[0];
    if (before) { const d = m.date; moved.set(id, { date: before.date, skip: false }); moved.set(before.id, { date: d, skip: false, reason: 'échangée avec le test pour qu’il passe en premier' }); }
  }
  // les séances optionnelles qui gênent un créneau choisi sont sautées
  const bump = [];
  for (const [id, m] of moved) if (!m.skip) for (const x of S.plan) if (x.date === m.date && x.status === 'planned' && !mandatory(x) && !moved.has(x.id)) bump.push(x);
  for (const x of bump) moved.set(x.id, { date: x.date, skip: true, reason: 'remplacée par une séance déplacée' });
  return { hit: [...moved.keys()].map(id => S.plan.find(s => s.id === id)), moved };
}
function absenceDlg(){
  const t = todayISO();
  openDlg(`<h2>Absence / vacances</h2><p class="muted small">Indique tes dates : je propose où recaser chaque séance, tu ajustes si besoin.</p>
    <div class="grid2"><div><label class="f" for="abFrom">Du</label><input type="date" id="abFrom" value="${addDays(t,2)}"></div><div><label class="f" for="abTo">Au (inclus)</label><input type="date" id="abTo" value="${addDays(t,5)}"></div></div>
    <label class="f" for="abLabel">Note (facultatif)</label><input type="text" id="abLabel" placeholder="Vacances, déplacement pro…">
    <div id="abPrev" style="margin-top:12px"></div>`);
  const prev = () => {
    const from = $('#abFrom').value, to = $('#abTo').value;
    if (!from || !to || to < from) { $('#abPrev').innerHTML = '<p class="small" style="color:var(--bad)">Vérifie les dates.</p>'; return; }
    const { hit, moved } = planAbsence(from, to);
    if (!hit.length) { $('#abPrev').innerHTML = `<div class="note ok">Aucune séance prévue sur ces dates : rien à déplacer.</div><div class="row"><button class="btn primary" id="abOk">Enregistrer l'absence</button></div>`; $('#abOk').onclick = () => applyAbsence(from, to, new Map()); return; }
    $('#abPrev').innerHTML = `<h3>${hit.length} séance${hit.length>1?'s':''} concernée${hit.length>1?'s':''}</h3>` + hit.sort((a,b)=>a.date.localeCompare(b.date)).map(s => {
      const m = moved.get(s.id);
      return `<div class="hist" style="flex-wrap:wrap"><div style="flex:1;min-width:160px"><b>${esc(WORKOUTS[s.workoutId].name)}</b><div class="tiny muted">prévue ${fmtDate(s.date)}${mandatory(s)?'':' · optionnelle'}</div></div>
        <div class="row" style="gap:6px"><select data-abmode="${s.id}" style="width:auto;min-height:36px;padding:4px 8px"><option value="move" ${m.skip?'':'selected'}>Déplacer au</option><option value="skip" ${m.skip?'selected':''}>Sauter</option></select>
        <input type="date" data-abdate="${s.id}" value="${m.date}" style="width:auto;min-height:36px;padding:4px 8px" ${m.skip?'disabled':''}></div>
        ${m.reason ? `<div class="tiny muted" style="width:100%">${esc(m.reason)}</div>` : ''}<div class="tiny" data-abwarn="${s.id}" style="width:100%;color:var(--warn)"></div></div>`;
    }).join('') + `<div class="row" style="margin-top:12px"><button class="btn primary" id="abOk">Appliquer</button></div>`;
    const check = () => {
      const tmp = new Map(); dlgBody.querySelectorAll('[data-abmode]').forEach(sel => { const id = sel.dataset.abmode; tmp.set(id, { skip: sel.value==='skip', date: dlgBody.querySelector(`[data-abdate="${id}"]`).value }); });
      for (const [id, m] of tmp) { const s = S.plan.find(x=>x.id===id); const w = dlgBody.querySelector(`[data-abwarn="${id}"]`); dlgBody.querySelector(`[data-abdate="${id}"]`).disabled = m.skip;
        w.textContent = m.skip ? '' : (m.date >= from && m.date <= to) ? '⚠️ toujours pendant ton absence' : tentativeConflict(s, m.date, tmp); }
      return tmp;
    };
    dlgBody.querySelectorAll('[data-abmode],[data-abdate]').forEach(el => el.onchange = check); check();
    $('#abOk').onclick = () => applyAbsence(from, to, check());
  };
  $('#abFrom').onchange = prev; $('#abTo').onchange = prev; prev();
}
function tentativeConflict(s, date, tmp){ // comme hardConflict, mais avec les déplacements proposés
  if (!isHard(s.workoutId)) return '';
  const near = S.plan.find(x => { if (x.id === s.id) return false; const m = tmp.get(x.id); if (m?.skip || (!m && x.status === 'skipped')) return false;
    return isHard(x.workoutId) && Math.abs(diffDays(m ? m.date : x.date, date)) < 2; });
  return near ? `⚠️ ${WORKOUTS[near.workoutId].name} à moins de 48 h` : '';
}
function applyAbsence(from, to, choices){
  const p = S.profile; p.absences ||= [];
  const rec = { id: uid(), from, to, label: $('#abLabel')?.value.trim() || '', moves: [] };
  for (const [id, m] of choices) {
    const s = S.plan.find(x => x.id === id); if (!s) continue;
    rec.moves.push({ id, date: s.date, status: s.status, week: s.week });
    if (m.skip) s.status = 'skipped';
    else { s.date = m.date; s.week = Math.floor(diffDays(monday(p.startDate), m.date)/7); }
  }
  // jours indisponibles mémorisés pour les prochaines régénérations
  p.absences.push(rec);
  S.plan.sort((a,b)=>a.date.localeCompare(b.date));
  save(); closeDlg(); render();
  const mv = rec.moves.length; toast(mv ? `Absence enregistrée · ${mv} séance${mv>1?'s':''} reprogrammée${mv>1?'s':''}` : 'Absence enregistrée');
}
function undoAbsence(id){
  const p = S.profile; const a = (p.absences||[]).find(x => x.id === id); if (!a) return;
  for (const m of a.moves) { const s = S.plan.find(x => x.id === m.id); if (s && s.status !== 'done') { s.date = m.date; s.status = m.status; s.week = m.week; } }
  p.absences = p.absences.filter(x => x.id !== id);
  S.plan.sort((x,y)=>x.date.localeCompare(y.date)); save(); render(); toast('Absence annulée, séances remises à leur place');
}

/* ============ graphique de séance : courbes superposables ============ */
const ActChart = (() => {
  const C = { pw:'var(--accent)', pw30:'#b4380a', hr:'var(--bad)', cad:'var(--z3)', tgt:'var(--z2)', cmp:'var(--muted)', spd:'#0ea5e9', alt:'var(--muted)' };
  const NAMES = { pw:'Puissance', pw30:'Puissance 30 s', hr:'FC', cad:'Cadence', tgt:'Cible prévue', cmp:'Comparaison', zones:'Zones', spd:'Vitesse', alt:'Altitude' };
  let st = { on: new Set(['pw','hr','tgt','spd','alt']), cmp: null, id: null, planId: null };
  const smooth = (arr, w) => { if (!arr) return null; const out = []; let s = 0; for (let i=0;i<arr.length;i++){ s += arr[i]; if (i>=w) s -= arr[i-w]; out.push(Math.round(s/Math.min(i+1,w))); } return out; };
  function target(planItem, secs, n){
    if (!planItem) return null;
    const steps = flat(WORKOUTS[planItem.workoutId].steps); const f = ftpAt(S.activities.find(a=>a.planId===planItem.id)?.date || todayISO()) * adj() * sAdj(planItem);
    const per = []; for (const s of steps) for (let k=0;k<s.d;k++) per.push(s.max ? null : Math.round(s.p/100*f));
    return Array.from({length:n}, (_,i) => { const t = Math.floor(i*secs/n); return t < per.length ? per[t] : null; });
  }
  function html(a, planItem){
    if (!a || !(a.pwSample || a.hrSample || a.spdSample)) return '';
    st.id = a.id; st.planId = planItem?.id || a.planId || null; if (st.cmp === a.id) st.cmp = null;
    const others = S.activities.filter(x => x.id !== a.id && x.pwSample).sort((x,y) => y.date.localeCompare(x.date)).slice(0, 30);
    const avail = availOf(a);
    return `<div class="actchart" data-aid="${a.id}">
      <div class="achips">${chips(avail)}<button type="button" class="afull" data-acfull="${a.id}" aria-label="Agrandir le graphique">⤢ Agrandir</button></div>
      <div class="awrap"><div class="achart">${svg(a)}</div><div class="atip" hidden></div></div>
      ${others.length && a.pwSample ? `<div class="row" style="margin-top:8px;gap:6px"><label class="small muted" for="acCmp">Superposer avec</label><select id="acCmp" style="flex:1;min-width:150px;min-height:36px;padding:4px 8px"><option value="">—</option>${others.map(o => `<option value="${o.id}" ${st.cmp===o.id?'selected':''}>${fmtShort(o.date)} · ${esc(o.planId ? WORKOUTS[S.plan.find(s=>s.id===o.planId)?.workoutId]?.name || o.name : o.name)}${o.np?` · ${o.np} W`:''}</option>`).join('')}</select></div>` : ''}
      ${a.best ? `<h3 style="margin-top:16px">Courbe de puissance</h3>${curve(a)}` : ''}
    </div>`;
  }
  const chips = avail => avail.map(k => `<button type="button" class="${st.on.has(k)?'on':''}" data-ac="${k}"><i style="background:${k==='zones'?'linear-gradient(90deg,var(--z2),var(--z4),var(--z6))':C[k]}"></i>${NAMES[k]}</button>`).join('');
  const availOf = a => ['pw','pw30','hr','spd','alt','cad','tgt','zones'].filter(k => k === 'zones' ? a.pwSample : k === 'tgt' ? !!(st.planId && S.plan.find(s=>s.id===st.planId)) : k === 'cad' ? a.cadSample : k === 'hr' ? a.hrSample : k === 'spd' ? a.spdSample : k === 'alt' ? a.altSample : a.pwSample);
  // plein écran : occupe tout l'écran et se redessine à la taille réelle (paysage si on tourne le téléphone)
  const fs = document.getElementById('fsDlg');
  function openFull(id){
    const a = S.activities.find(x => x.id === id); if (!a) return;
    const pl = S.plan.find(s => s.id === st.planId);
    fs.innerHTML = `<div class="actchart full" data-aid="${a.id}"><div class="fshead"><h3>${esc(pl ? WORKOUTS[pl.workoutId].name : a.name)} <span class="muted small">· ${fmtShort(a.date)}</span></h3><button type="button" data-fsclose aria-label="Fermer">×</button></div>
      <div class="achips">${chips(availOf(a))}</div><div class="awrap"><div class="achart"></div><div class="atip" hidden></div></div><div class="fshint">Tourne ton téléphone pour un affichage en paysage</div></div>`;
    fs.showModal(); redraw(fs.querySelector('.actchart'));
    try { if (fs.requestFullscreen && !/iPhone|iPod/.test(navigator.userAgent)) fs.requestFullscreen().catch(() => {}); } catch {}
  }
  function closeFull(){ if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); if (fs.open) fs.close(); }

/* ============ tracés GPS (sorties extérieures) ============ */
// stockés à part (table activity_tracks + cache local), retrouvés par l'heure de départ de la sortie
const Tracks = (() => {
  const KEY = 'ftpb-tracks', MAX_LOCAL = 40;
  let cache = {}; try { cache = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
  const persist = () => { try {
    const ks = Object.keys(cache);
    if (ks.length > MAX_LOCAL) ks.sort((a, b) => (cache[a].at || 0) - (cache[b].at || 0)).slice(0, ks.length - MAX_LOCAL).forEach(k => delete cache[k]);
    localStorage.setItem(KEY, JSON.stringify(cache));
  } catch {} };
  // séries alignées -> tracé compact (≤ 800 points) ; d en km, spd en km/h, alt en m
  function build({ lat, lon, alt, d, t, spd, hr }){
    const idx = []; for (let i = 0; i < (lat?.length || 0); i++) if (lat[i] != null && lon[i] != null && (lat[i] || lon[i])) idx.push(i);
    if (idx.length < 10) return null;
    const k = Math.max(1, Math.ceil(idx.length / 800)), pick = idx.filter((_, j) => j % k === 0); if (pick[pick.length-1] !== idx[idx.length-1]) pick.push(idx[idx.length-1]);
    const r = (x, n) => x == null || !isFinite(x) ? null : +(+x).toFixed(n);
    const col = (arr, n) => arr && arr.some(v => v != null) ? pick.map(i => r(arr[i], n)) : null;
    return { v:1, lat: pick.map(i => r(lat[i], 5)), lon: pick.map(i => r(lon[i], 5)), alt: col(alt, 1), d: col(d, 3), t: t ? pick.map(i => t[i]) : null, spd: col(spd, 1), hr: col(hr, 0) };
  }
  const fromRecords = recs => { const R = recs.filter(x => x.t != null); const t0 = R[0]?.t || 0;
    return build({ lat: R.map(x => x.lat), lon: R.map(x => x.lon), alt: R.map(x => x.alt), d: R.map(x => x.dist), t: R.map(x => x.t - t0), spd: R.map(x => x.spd), hr: R.map(x => x.hr) }); };
  const fromStreams = st => !st?.latlng ? null : build({ lat: st.latlng.map(p => p?.[0]), lon: st.latlng.map(p => p?.[1]), alt: st.altitude, d: st.distance?.map(x => x/1000), t: st.time, spd: st.velocity_smooth?.map(x => x*3.6), hr: st.heartrate });
  function local(ts){ for (const k of Object.keys(cache)) if (Math.abs(+k - ts) <= 180) return cache[k].track; return null; }
  async function put(ts, track, source){
    if (!ts || !track) return; cache[ts] = { track, at: Date.now() }; persist();
    try { const sb = Cloud.sb, u = Cloud.user; if (sb && u) await sb.from('activity_tracks').upsert({ user_id: u.id, start_ts: ts, source, track }); } catch (e) { console.warn('tracé', e); }
  }
  async function get(a){
    if (!a?.startTs) return null;
    const l = local(a.startTs); if (l) return l;
    try { const sb = Cloud.sb, u = Cloud.user; if (!sb || !u) return null;
      const { data } = await sb.from('activity_tracks').select('start_ts, track').gte('start_ts', a.startTs - 180).lte('start_ts', a.startTs + 180).limit(1);
      if (data?.[0]) { cache[data[0].start_ts] = { track: data[0].track, at: Date.now() }; persist(); return data[0].track; }
    } catch (e) { console.warn('tracé', e); }
    return null;
  }
  return { build, fromRecords, fromStreams, put, get, local };
})();

const Track3D = (() => {
  const LIBS = ['https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js', 'https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js'];

  const fs = document.getElementById('fsDlg');

  const STOPS = [[0,[0.15,0.55,1]],[0.4,[0.55,0.3,1]],[0.7,[1,0.35,0.45]],[0.88,[1,0.55,0.15]],[1,[1,0.9,0.35]]];

      geo: { lat0, lon0, kx, kz, latMin: Math.min(...tr.lat), latMax: Math.max(...tr.lat), lonMin: Math.min(...tr.lon), lonMax: Math.max(...tr.lon) } };

  const SAT = (z, y, x) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
  const lon2x = (lon, z) => (lon + 180)/360*2**z, lat2y = (lat, z) => { const r = lat*Math.PI/180; return (1 - Math.log(Math.tan(r) + 1/Math.cos(r))/Math.PI)/2*2**z; };

      $('#clEdStats').innerHTML = `<b class="num">${f1(L)} km</b> · <b class="num">${Math.round(H)} m</b> D+ · <b class="num">${f1(H/(L*10 || 1))} %</b> moy.${H < MIN_GAIN ? ' <span style="color:var(--warn)">· moins de 400 m : elle ne sera plus listée</span>' : ''}`;

    draw();
    $('#clEdSave').onclick = async () => {
      const to = { s: [tr.lat[A], tr.lon[A]], e: [tr.lat[B], tr.lon[B]] };
      const oldKey = g.key, newKey = `${to.e[0].toFixed(3)},${to.e[1].toFixed(3)}`;
      S.climbFix = (S.climbFix || []).filter(f => km(...f.to.e, ...g.e) >= 0.5 || km(...f.to.s, ...g.s) >= 0.5);
      for (const p of g.list) S.climbFix.push({ from: { s: p.s, e: p.e }, to }); // chaque passage reconnu à sa détection d'origine
      for (const p of g.list) { // recalcul immédiat de chaque passage
        const ac = S.activities.find(x => x.id === p.act), t2 = ac && (Tracks.local(ac.startTs) || await Tracks.get(ac)); if (!t2?.alt) continue;
        const P2 = prep(t2), ia = nearestIdx(t2, to.s), ib = nearestIdx(t2, to.e, ia.i + 1);
        const idx = (ac.climbs || []).findIndex(x => km(...x.s, ...p.s) < 0.05 && km(...x.e, ...p.e) < 0.05); if (idx < 0) continue;
        if (ia.dist > 0.3 || ib.dist > 0.3) continue;

    if (e.target.closest('[data-climbmore]')) { open = !open; render(); } });
  document.addEventListener('toggle', e => { if (e.target.classList?.contains('climbpredwrap')) predOpen = e.target.open; }, true);
  return { html, scan, detect, measure, predict, groups };
})();

/* ============ ajuster une séance selon la forme du jour ============ */
function adjustHTML(s, compact=false){
  if (s.status !== 'planned' || WORKOUTS[s.workoutId].type === 'test') return '';
  const easier = neighbor(s.workoutId, -1), harder = neighbor(s.workoutId, 1), k = sAdj(s);
  const chip = v => `<button type="button" class="${Math.abs(k - v) < 0.001 ? 'on' : ''}" data-sadj="${v}" data-sid="${s.id}">${v === 1 ? 'Prévu' : (v > 1 ? '+' : '−') + Math.round(Math.abs(v-1)*100) + ' %'}</button>`;
  return `<details class="adj" ${compact ? '' : 'open'} style="margin-top:12px"><summary class="small" style="cursor:pointer;color:var(--accent);font-weight:600">Ajuster selon ma forme</summary>
    <div class="row" style="margin-top:10px;gap:6px">
      ${easier ? `<button class="btn sm" data-sx="easier" data-sid="${s.id}" title="${esc(WORKOUTS[easier].name)}">⬇ Plus facile <span class="tiny muted">· ${esc(WORKOUTS[easier].name)}</span></button>` : ''}
      ${harder ? `<button class="btn sm" data-sx="harder" data-sid="${s.id}" title="${esc(WORKOUTS[harder].name)}">⬆ Plus dur <span class="tiny muted">· ${esc(WORKOUTS[harder].name)}</span></button>` : ''}
    </div>
    <div class="small muted" style="margin:10px 0 4px">Intensité de cette séance</div>
    <div class="seg">${[0.95, 0.97, 1, 1.03, 1.05].map(chip).join('')}</div>
    <div class="row" style="margin-top:10px;gap:6px">
      <button class="btn sm" data-sx="post" data-sid="${s.id}">Reporter</button>
      ${s.workoutId !== 'rec_45' ? `<button class="btn sm" data-sx="rec" data-sid="${s.id}">Remplacer par une récup</button>` : ''}
      ${s.origWorkoutId && s.origWorkoutId !== s.workoutId ? `<button class="btn sm ghost" data-sx="orig" data-sid="${s.id}">Revenir à « ${esc(WORKOUTS[s.origWorkoutId].name)} »</button>` : ''}
    </div></details><div style="height:12px"></div>`;
}
// suggestion du jour à partir de l'indice de forme et des ressentis récents
function formeHint(s){
  if (s.status !== 'planned' || !isHard(s.workoutId)) return '';
  const sc = (typeof Health !== 'undefined') ? Health.score() : null;
  const lastFeel = S.activities.filter(a => a.feel?.rpe).sort((a,b) => b.date.localeCompare(a.date))[0];
  let msg = '', btns = '';
  if (sc && sc.v < 40) { msg = `Indice de forme ${sc.v}/100 : ton corps n'a pas récupéré.`; btns = `<button class="btn sm" data-sx="post" data-sid="${s.id}">Reporter</button><button class="btn sm" data-sx="rec" data-sid="${s.id}">Récup à la place</button>`; }
  else if (sc && sc.v < 55) { msg = `Indice de forme ${sc.v}/100 : garde la séance mais lève un peu le pied.`; btns = `<button class="btn sm" data-sadj="0.95" data-sid="${s.id}">Cibles −5 %</button>${neighbor(s.workoutId,-1) ? `<button class="btn sm" data-sx="easier" data-sid="${s.id}">Version plus facile</button>` : ''}`; }
  else if (sc && sc.v >= 80 && (!lastFeel || lastFeel.feel.rpe <= 7)) { msg = `Indice de forme ${sc.v}/100 : tu es frais. Tu peux viser un cran au-dessus si les jambes répondent à l'échauffement.`; btns = `<button class="btn sm" data-sadj="1.03" data-sid="${s.id}">Cibles +3 %</button>${neighbor(s.workoutId,1) ? `<button class="btn sm" data-sx="harder" data-sid="${s.id}">Version plus dure</button>` : ''}`; }
  if (!msg) return '';
  return `<div class="note ${sc.v < 55 ? 'bad' : 'ok'}" style="margin:12px 0 0">${esc(msg)}<div class="row" style="margin-top:8px;gap:6px">${btns}</div></div>`;
}
function postpone(s){
  for (let k = 1; k <= 3; k++) {
    const d = addDays(s.date < todayISO() ? todayISO() : s.date, k);
    if (d > S.profile.endDate) break;
    if ((S.profile.absences || []).some(a => d >= a.from && d <= a.to)) continue;
    if (S.plan.some(x => x.id !== s.id && x.date === d && x.status === 'planned' && mandatory(x))) continue;
    if (hardConflict(s, d)) continue;
    for (const x of S.plan) if (x.date === d && x.status === 'planned' && !mandatory(x)) x.status = 'skipped'; // la sortie optionnelle cède sa place
    const from = s.date; s.date = d; s.week = Math.floor(diffDays(monday(S.profile.startDate), d)/7);
    S.plan.sort((a,b) => a.date.localeCompare(b.date));
    return { ok: true, from, to: d };
  }
  return { ok: false };
}

const Cloud = (() => {

  async function init(){

    sb.auth.onAuthStateChange((ev, s) => { const was = !!session; session = s; if (s && !was) afterLogin(); if (!s && was) { strava = { connected:false }; render(); } });
    await handleStravaReturn();
    if (session) await afterLogin();
  }
  async function afterLogin(){

    await refreshStrava();
    await importInbox();

    await Health.load(sb);
    render();
  }
  /* ----- Intervals.icu ----- */
  let icu = { connected:false }, icuBusy = false;
  async function refreshIcu(){
    if (!user()) return;
    const { data } = await sb.rpc('intervals_status');
    icu = data && data.length ? { connected:true, ...data[0] } : { connected:false };
  }
  async function icuCall(body){
    const { data, error } = await sb.functions.invoke('intervals', { body });
    if (error || data?.error) {
      let msg = data?.error || error?.message || 'erreur';
      try { const ctx = await error?.context?.json?.(); if (ctx?.error) msg = ctx.error; } catch(e){}
      throw new Error(msg);
    }
    return data;
  }
  // synchro silencieuse : au plus toutes les 15 min, et envoi du plan s'il a changé
  async function autoIcu(force=false){
    if (icuBusy || !icu.connected) return;
    const last = S.icuLastAuto || 0;
    if (!force && S.icuBackfill === 2 && Date.now() - last < 15*60000) return;
    icuBusy = true; S.icuLastAuto = Date.now();
    try {
      // une fois (puis à chaque synchro manuelle) : 4 mois d'historique pour récupérer les anciennes sorties avec leurs flux et tracés
      const deep = force || S.icuBackfill !== 2;
      const r = await icuCall({ action:'sync', days: deep ? 120 : 14 });
      const n = await importExt();
      if (deep && S.icuBackfill !== 2) { S.icuBackfill = 2; save(); }
      await Health.load(sb);
      const pushed = await pushPlan(false);
      if (force) toast(`Intervals : ${n} séance${n>1?'s':''} vélo importée${n>1?'s':''}, ${r.others} autre${r.others>1?'s':''} activité${r.others>1?'s':''}${pushed ? `, ${pushed} séance${pushed>1?'s':''} envoyée${pushed>1?'s':''} au calendrier` : ''}`);
      else if (n) toast(`${n} séance${n>1?'s':''} importée${n>1?'s':''} depuis Intervals.icu`);

      const inner = s.steps.some(x => x.repeat);
      if (inner) for (let k=0;k<s.repeat;k++) for (const x of s.steps) { if (x.repeat) { out.push('', `${x.repeat}x`, ...x.steps.map(line), ''); } else out.push(line(x)); }
      else out.push('', `${s.repeat}x`, ...s.steps.map(line), '');

    return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  async function pushPlan(force=true){
    if (!icu.connected || !S.profile) return 0;

/* ============ Apple Santé (via le Raccourci iOS) ============ */
const Health = (() => {
  const LS = 'ftpb_health_v1';
  let H = { daily: [], sleep: [], workouts: [], token: null, loadedAt: 0 };
  try { const r = localStorage.getItem(LS); if (r) H = Object.assign(H, JSON.parse(r)); } catch(e){}

  const INGEST_URL = SB_URL + '/functions/v1/health-ingest';

  async function load(sb){
    if (!sb) return;
    const since = addDays(todayISO(), -130);
    const [d, s, w, t, g] = await Promise.all([
      sb.from('health_daily').select('day, metric, value').gte('day', since).order('day'),
      sb.from('health_sleep').select('night, source, asleep_min, deep_min, rem_min, core_min, awake_min, in_bed_min, bed_start, bed_end').gte('night', since).order('night'),
      sb.from('health_workouts').select('start_at, end_at, type, duration_min, distance_km, energy_kcal, avg_hr, source, indoor, elevation_m, avg_speed_kmh, max_speed_kmh').gte('start_at', since).order('start_at'),
      sb.rpc('ingest_status'),
      sb.from('health_sleep_seg').select('start_at, end_at, stage, source').gte('end_at', addDays(todayISO(), -3)).order('start_at'), // phases détaillées (hypnogramme)
    ]);
    if (!d.error) H.daily = d.data; if (!s.error) H.sleep = s.data; if (!w.error) H.workouts = w.data; if (g && !g.error) H.segs = g.data;
    promoteBikes();
    H.token = t.data && t.data.length ? { last: t.data[0].last_used_at } : null;
    persist();
  }
  // séries utilitaires
  const series = m => H.daily.filter(x => x.metric === m).map(x => [x.day, x.value]);
  const valOn = (m, day) => H.daily.find(x => x.metric === m && x.day === day)?.value ?? null;
  const latest = m => { const s = series(m); return s.length ? s[s.length-1] : null; };
  function stats(m, upto, days=60){
    const vals = H.daily.filter(x => x.metric === m && x.day < upto && x.day >= addDays(upto, -days)).map(x => x.value);
    if (vals.length < 7) return null;
    const mean = vals.reduce((a,b)=>a+b,0)/vals.length, sd = Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length) || 1;
    return { mean, sd, n: vals.length };
  }
  // Indice de forme 0-100 : VFC (ln, vs 60 j), FC repos, sommeil (nuit + 3 nuits), équilibre de charge (TSB)
  function score(day = todayISO()){
    const parts = [];
    const hrv = valOn('hrv', day) ?? valOn('hrv', addDays(day,-1));
    const hs = (() => { const vals = H.daily.filter(x => x.metric==='hrv' && x.day < day && x.day >= addDays(day,-60)).map(x => Math.log(x.value)); if (vals.length < 7) return null; const m = vals.reduce((a,b)=>a+b,0)/vals.length; return { m, sd: Math.sqrt(vals.reduce((a,b)=>a+(b-m)**2,0)/vals.length) || 0.1 }; })();
    if (hrv != null && hs) { const z = (Math.log(hrv) - hs.m) / hs.sd; parts.push({ k:'VFC', w:.35, s: clamp(60 + z*22, 0, 100), d:`${Math.round(hrv)} ms vs ${Math.round(Math.exp(hs.m))} habituel` }); }
    const rhr = valOn('rhr', day) ?? valOn('rhr', addDays(day,-1)), rs = stats('rhr', day);
    if (rhr != null && rs) { const d = rhr - rs.mean; parts.push({ k:'FC repos', w:.2, s: clamp(75 - d*9, 0, 100), d:`${Math.round(rhr)} bpm (${d>=0?'+':''}${d.toFixed(0)})` }); }
    const sl = sleepOn(day);
    if (sl && sl.asleep_min) {
      const last3 = [0,1,2].map(i => sleepOn(addDays(day,-i))?.asleep_min).filter(Boolean);
      const avg3 = last3.reduce((a,b)=>a+b,0)/last3.length;
      const f = m => clamp((m/60 - 5) / 3 * 100, 0, 100); // 5 h = 0, 8 h = 100
      parts.push({ k:'Sommeil', w:.25, s: f(sl.asleep_min)*0.6 + f(avg3)*0.4, d:`${fmtDur(sl.asleep_min*60)} cette nuit, ${fmtDur(avg3*60)} sur 3 nuits` });
    }
    const L = loadSeries(); const l = L.find(x => x.d === day) || L[L.length-1];
    if (l && (S.activities.length || H.workouts.length)) parts.push({ k:'Charge', w:.2, s: clamp(65 + l.tsb*1.6, 0, 100), d:`forme (TSB) ${Math.round(l.tsb)}` });

  function baseline(m, upto, days=30){

  // 5 derniers jours d'un indicateur (+ moyenne 30 j) pour les graphiques des fiches « Forme du jour »
  function trend(kind, n = 5){
    const t = todayISO(); const days = Array.from({ length: n }, (_, i) => addDays(t, i - n + 1));
    if (kind === 'score') return days.map(d => ({ d, v: score(d)?.v ?? null, base: null }));
    if (kind === 'sleep') { const b = H.sleep.filter(x => x.night < t && x.night >= addDays(t, -30) && x.asleep_min).map(x => x.asleep_min/60);
      return days.map(d => ({ d, v: sleepOn(d)?.asleep_min ? sleepOn(d).asleep_min/60 : null, base: b.length >= 4 ? b.reduce((a, x) => a + x, 0)/b.length : null })); }
    return days.map(d => ({ d, v: valOn(kind, d), base: baseline(kind, t) }));
  }

  // sport -> catégorie + TSS estimé
  function sportOf(type){
    const t = (type||'').toLowerCase();
    if (/vélo|velo|cycl|bike|ride|vtt/.test(t)) return 'bike';
    if (/course|run|trail|jogging/.test(t)) return 'run';
    if (/nata|swim|piscine|eau libre/.test(t)) return 'swim';
    if (/renfo|force|muscu|strength|fonctionnel|hiit|core|training/.test(t)) return 'strength';
    if (/marche|walk|randonn|hiking/.test(t)) return 'walk';
    if (/yoga|pilates|étirement|mobilit|stretch/.test(t)) return 'mobility';
    return 'other';
  }
  const IF_GUESS = { run:0.78, swim:0.72, strength:0.6, walk:0.45, mobility:0.4, bike:0.7, other:0.65 };
  const ICON = { run:'🏃', swim:'🏊', strength:'🏋️', walk:'🚶', mobility:'🧘', bike:'🚴', other:'⏱️' };
  const LABEL = { run:'Course', swim:'Natation', strength:'Renfo', walk:'Marche', mobility:'Mobilité', bike:'Vélo', other:'Autre' };
  function wTss(w){
    const min = w.duration_min || (w.end_at ? (Date.parse(w.end_at)-Date.parse(w.start_at))/60000 : 0);
    const sp = sportOf(w.type);
    const hrMax = S.profile?.hrMax;
    if (w.avg_hr && hrMax && sp !== 'swim') return Math.round(min/60 * Math.pow(w.avg_hr/(0.9*hrMax), 2) * 100);
    return Math.round(min/60 * Math.pow(IF_GUESS[sp], 2) * 100);
  }
  // séances Santé à ajouter à la charge (sauf vélos déjà importés dans l'app)
  const bikeIndoor = w => w.indoor ?? /home trainer|intérieur|indoor|virtual|zwift|mywhoosh|rouvy/i.test(`${w.type} ${w.source}`);
  function fillSpeed(a, w){
    let ch = false;
    if (a.elevM == null && w.elevation_m != null) { a.elevM = Math.round(w.elevation_m); ch = true; }
    if (a.maxSpeed == null && w.max_speed_kmh) { a.maxSpeed = +(+w.max_speed_kmh).toFixed(1); ch = true; }

  function promoteBikes(){

      if ((S.dismissedHealth || []).includes(w.start_at)) continue;

        durationS: Math.round((w.duration_min || 0) * 60), distanceKm: w.distance_km ? +(+w.distance_km).toFixed(1) : null, avgHr: w.avg_hr ? Math.round(w.avg_hr) : null,

  // indicateur de forme du jour
  function readiness(day = todayISO()){
    const out = { items: [], bad: 0, warn: 0 };
    const hrv = valOn('hrv', day) ?? valOn('hrv', addDays(day,-1)), hrvB = baseline('hrv', day);
    if (hrv != null) { const r = hrvB ? hrv/hrvB : null; const st = r == null ? '' : r >= 0.95 ? 'ok' : r >= 0.85 ? 'warn' : 'bad';
      out.items.push({ l:'VFC', v:`${Math.round(hrv)} ms`, sub: hrvB ? `moy. 30 j ${Math.round(hrvB)}` : 'référence en construction', st }); }
    const rhr = valOn('rhr', day) ?? valOn('rhr', addDays(day,-1)), rhrB = baseline('rhr', day);
    if (rhr != null) { const d = rhrB ? rhr - rhrB : null; const st = d == null ? '' : d <= 2 ? 'ok' : d <= 5 ? 'warn' : 'bad';

      out.items.push({ l:'Sommeil', v:`${Math.floor(hh)}h${pad(Math.round(sl.asleep_min%60))}`, sub: sl.deep_min||sl.rem_min ? `profond ${fmtDur((sl.deep_min||0)*60)} · paradoxal ${fmtDur((sl.rem_min||0)*60)}` : esc(sl.source||''), st }); }

  function todayCard(){
    if (!H.daily.length && !H.sleep.length) return '';

    if (!r.items.length) return '';
    const msg = { ok:"Feu vert : tu es récupéré, fais la séance comme prévue.", warn:"Récupération moyenne : garde la séance, mais baisse les cibles de 3 à 5 % si les jambes ne répondent pas à l'échauffement.", bad:"Récupération faible : remplace la séance clé par de l'endurance ou décale-la de 24 h.", none:"Encore quelques jours de données et je pourrai comparer à tes valeurs habituelles." }[r.level];
    const col = { ok:'var(--ok)', warn:'var(--warn)', bad:'var(--bad)', '':'var(--muted)' };
    const p = S.profile; const wt = latest('weight');
    const wNote = wt && p && Math.abs(wt[1] - p.weightKg) >= 0.5 ? `<div class="row" style="margin-top:10px"><span class="small muted">Ton poids Santé (${wt[1].toFixed(1)} kg) diffère de ton profil (${p.weightKg} kg).</span><button class="btn sm" data-hweight="${wt[1].toFixed(1)}">Mettre à jour</button></div>` : '';
    const sc = score();
    const scCol = sc ? { ok:'var(--ok)', mid:'var(--z2)', warn:'var(--warn)', bad:'var(--bad)' }[sc.level] : 'var(--muted)';
    const scTxt = sc ? { ok:"Fais la séance comme prévue, c'est un bon jour pour pousser.", mid:"Séance prévue, sans chercher à dépasser les cibles.", warn:"Garde la séance mais baisse les cibles de 3 à 5 %, ou raccourcis le bloc principal.", bad:"Remplace la séance clé par de l'endurance ou décale-la de 24 h." }[sc.level] : msg;
    const gauge = sc ? `<div class="row" style="gap:16px;margin-bottom:12px;cursor:pointer" data-i="score">
        <svg viewBox="0 0 120 70" width="132" height="77" aria-label="Indice de forme ${sc.v} sur 100"><path d="M10 62 A50 50 0 0 1 110 62" fill="none" stroke="var(--bg2)" stroke-width="12" stroke-linecap="round"/><path d="M10 62 A50 50 0 0 1 110 62" fill="none" stroke="${scCol}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${Math.PI*50*sc.v/100} 999"/><text x="60" y="58" text-anchor="middle" style="font:700 30px 'Barlow Condensed','Arial Narrow',sans-serif;fill:var(--text)">${sc.v}</text></svg>

    return `<div class="card"><div class="row between"><h2>Forme du jour</h2><span class="chip" style="color:${col[r.level==='none'?'':r.level]}">● ${ {ok:'Récupéré',warn:'Moyen',bad:'Fatigué',none:'Apple Santé'}[r.level] }</span></div>
      ${gauge}<div class="grid4">${r.items.map(i=>`<div class="kpi"><div class="v num" style="font-size:24px;color:${i.st?col[i.st]:'var(--text)'}">${i.v}</div><div class="l">${i.l}</div><div class="tiny muted" style="margin-top:2px">${i.sub}</div></div>`).join('')}</div>
      ${sc ? '' : `<p class="small" style="margin:10px 0 0">${msg}</p>`}${wNote}
      ${H.daily.filter(x => x.metric === 'hrv' && x.day >= addDays(todayISO(), -60)).length < 21 ? `<p class="tiny muted" style="margin:10px 0 0">Pour un indice fiable dès aujourd'hui, importe ton historique Santé (Profil › Apple Santé) : il faut ~3 semaines de VFC pour connaître ta normale.</p>` : ''}</div>`;

  function progressCards(){
    if (!H.daily.length && !H.sleep.length && !H.workouts.length) return '';

    if (hrv.length >= 3 || rhr.length >= 3) {
      const X = d => parseD(d).getTime(); const all = [...hrv.map(x=>x[1]), ...rhr.map(x=>x[1])];

  let sportsOpen = false;
  document.addEventListener('click', e => { if (e.target.closest('[data-sportsmore]')) { sportsOpen = !sportsOpen; render(); } });
  function otherSportsHTML(){
    if (!S.profile) return ''; const t = todayISO(); let h = '';

    if (exm.length && !H.workouts.length) h += `<div class="card"><h2>Autres sports</h2><div style="display:flex;align-items:flex-end;gap:4px;height:70px">${exm.map(x=>`<div title="${fmtShort(x.date)} · ${x.minutes} min" style="flex:1;max-width:24px;height:${clamp(x.minutes/120*100,5,100)}%;border-radius:4px 4px 0 0;background:var(--z3)"></div>`).join('')}</div>
      <p class="tiny muted" style="margin:6px 0 0">Minutes d'exercice Apple Santé hors vélo, 14 derniers jours : ${exm.reduce((a,x)=>a+x.minutes,0)} min. Comptées dans ta forme/fatigue (~0,9 TSS/min).</p></div>`;

  function settingsHTML(){

  });

  // plan B : minutes d'exercice du jour (Apple Santé) moins le temps des séances vélo déjà dans l'app

  dlgBody.querySelectorAll('.seg[data-feel]').forEach(seg => seg.querySelectorAll('button').forEach(b => { if (feel[seg.dataset.feel] === +b.dataset.v) b.classList.add('on'); b.onclick = () => { feel[seg.dataset.feel] = +b.dataset.v; seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); }; }));
  $('#fSave').onclick = () => { a.feel = { ...feel, note: $('#fNote').value.trim() || null }; if (!a.np) computeLoad(a); save(); closeDlg(); render();
    const pl = a.planId ? S.plan.find(s=>s.id===a.planId) : null, e = pl ? sessionEval(a, pl) : null;
    toast(e ? `${e.icon} ${e.title}` : 'Ressenti enregistré'); };
}

if (S.profile && repairAutoLinks()) save();
render();
Cloud.init().catch(e => console.warn('cloud', e));
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(() => { const ts = $('#themeSel'); if (ts) ts.value = S.settings.theme; }, 0);
// accès pour les tests
window.FTPB = { FIT, WORKOUTS, generatePlan, encodeWorkout, activityFromFit, powerSeries, defaultProfile, compliance, sessionEval, render, save, get S(){ return S; } };
</script>
</body>
